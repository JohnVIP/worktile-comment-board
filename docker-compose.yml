services:
  app:
    build: .
    image: worktile-comment-board:latest
    container_name: worktile-comment-board
    restart: unless-stopped          # 容器挂掉/云主机重启都自动拉起
    ports:
      - "5080:5080"                  # 主机 5080 -> 容器 5080
    environment:
      - PORT=5080
      - FERNET_KEY=${FERNET_KEY}     # 从同目录 .env 读取，务必自己生成并固定
    # 持久化会话目录（容器重建/更新后已登录的租户不丢登录态）。
    # 必须挂目录而不是单文件：命名卷挂到镜像内不存在的文件路径时，
    # Docker 会把挂载点创建成目录，应用写 sessions.json 会报 IsADirectoryError，
    # 登录态静默丢失。应用现在把加密会话写到 data/sessions.json。
    volumes:
      - wt_sessions:/app/data

volumes:
  wt_sessions:                      # 命名卷，由 docker 管理，跨容器重建保留

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Worktile 任务评论区看板</title>
<style>
  :root {
    /* ============ 基础色板：中性灰 + 单一强调色 ============ */
    --bg:           #f6f8fb;
    --bg-grad:      radial-gradient(ellipse at top left, #eef2ff 0%, #f6f8fb 50%, #f6f8fb 100%);
    --panel:        #ffffff;
    --panel-soft:   #fafbfc;
    --text:         #0f172a;
    --text-2:       #334155;
    --muted:        #64748b;
    --muted-2:      #94a3b8;
    --border:       #e2e8f0;
    --border-soft:  #eef2f7;
    --accent:       #4f46e5;
    --accent-2:     #6366f1;
    --accent-soft:  #eef2ff;
    --accent-ring:  rgba(79, 70, 229, .18);
    --danger:       #dc2626;
    --warn:         #f59e0b;
    --success:      #10b981;

    /* ============ 项目色循环（6 色） ============ */
    --p-1: #6366f1;   /* indigo */
    --p-2: #06b6d4;   /* cyan   */
    --p-3: #f59e0b;   /* amber  */
    --p-4: #10b981;   /* emerald*/
    --p-5: #ec4899;   /* pink   */
    --p-6: #8b5cf6;   /* violet */

    /* ============ 间距梯度（4 倍数） ============ */
    --s-1:  4px;
    --s-2:  8px;
    --s-3: 12px;
    --s-4: 16px;
    --s-5: 20px;
    --s-6: 24px;
    --s-8: 32px;

    /* ============ 圆角 ============ */
    --r-sm:  6px;
    --r-md: 10px;
    --r-lg: 14px;
    --r-xl: 18px;
    --r-pill: 999px;

    /* ============ 阴影层级 ============ */
    --sh-1: 0 1px 2px rgba(15, 23, 42, .04);
    --sh-2: 0 2px 8px rgba(15, 23, 42, .06);
    --sh-3: 0 8px 24px rgba(15, 23, 42, .08);
    --sh-4: 0 16px 48px rgba(15, 23, 42, .12);

    /* ============ 字体梯度 ============ */
    --ff: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI",
          "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    --ff-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    --fs-xs: 11.5px;
    --fs-sm: 12.5px;
    --fs-md: 14px;
    --fs-lg: 15px;
    --fs-xl: 17px;
    --fs-2xl: 20px;
    --fs-3xl: 24px;
    --lh-tight: 1.3;
    --lh-base:  1.5;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: var(--ff);
    background: var(--bg);
    background-image: var(--bg-grad);
    background-attachment: fixed;
    color: var(--text);
    font-size: var(--fs-md);
    line-height: var(--lh-base);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }
  .wrap { width: auto; max-width: calc(100vw - 32px); margin: 0 auto; padding: var(--s-6);
    overflow-x: auto; }   /* 取消固定 width：表格按内容自然撑开后，wrap 跟着表格走，
                              但不超过视窗（-32px 留滚动条空位）；视窗 < 表格总宽时 wrap 自身横滚 */

  /* ---------- 登录页 ---------- */
  .login-card {
    max-width: 420px; margin: 12vh auto; background: var(--panel);
    border: 1px solid var(--border); border-radius: var(--r-lg); padding: var(--s-8);
    box-shadow: var(--sh-3);
  }
  .login-card h1 { font-size: var(--fs-2xl); margin: 0 0 var(--s-2); letter-spacing: -.01em; }
  .login-card p.sub { color: var(--muted); margin: 0 0 var(--s-6); font-size: var(--fs-sm); }
  label.field { display: block; margin-bottom: var(--s-4); }
  label.field span { display: block; margin-bottom: var(--s-2); font-weight: 600; font-size: var(--fs-sm); color: var(--text-2); }
  input[type=text], input[type=password], select {
    width: 100%; padding: 10px var(--s-3); border: 1px solid var(--border);
    border-radius: var(--r-md); font-size: var(--fs-md); background: #fff; color: var(--text);
    transition: border-color .15s, box-shadow .15s;
  }
  input:focus, select:focus { outline: none; border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-ring); }
  button {
    cursor: pointer; border: none; border-radius: var(--r-md); font-size: var(--fs-md);
    padding: 10px var(--s-4); background: var(--accent); color: #fff; font-weight: 600;
    transition: background .15s, transform .1s, box-shadow .15s;
    box-shadow: 0 1px 2px rgba(79,70,229,.18);
  }
  button:hover { background: var(--accent-2); }
  button:active { transform: translateY(1px); }
  button:disabled { opacity: .5; cursor: not-allowed; transform: none; }
  .btn-ghost { background: transparent; color: var(--text-2); border: 1px solid var(--border); box-shadow: none; font-weight: 500; }
  .btn-ghost:hover { background: var(--panel-soft); color: var(--text); border-color: var(--muted-2); }
  .alert { background: #fef2f2; color: var(--danger); border: 1px solid #fecaca;
    border-radius: var(--r-md); padding: var(--s-3); margin-bottom: var(--s-4); font-size: var(--fs-sm); }

  /* ---------- 看板：顶栏 ---------- */
  .topbar {
    display: flex; align-items: center; gap: var(--s-3);
    margin-bottom: var(--s-5);
    padding: var(--s-3) var(--s-4);
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--r-lg);
    box-shadow: var(--sh-1);
  }
  .topbar .brand {
    display: flex; align-items: center; gap: var(--s-3);
    flex: 1; min-width: 0;
  }
  .topbar .brand-mark {
    width: 36px; height: 36px;
    background: linear-gradient(135deg, var(--accent) 0%, #818cf8 100%);
    border-radius: var(--r-md);
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-weight: 700; font-size: 16px;
    box-shadow: 0 4px 10px rgba(79,70,229,.25);
    flex-shrink: 0;
  }
  .topbar .brand-name {
    display: flex; flex-direction: column; min-width: 0;
  }
  .topbar .brand-name .title {
    font-size: var(--fs-lg); font-weight: 700; color: var(--text); letter-spacing: -.01em;
    line-height: 1.2;
  }
  .topbar .brand-name .sub {
    font-size: var(--fs-xs); color: var(--muted); line-height: 1.3; margin-top: 2px;
  }
  .topbar .account {
    display: flex; align-items: center; gap: var(--s-2);
    padding: 6px var(--s-2) 6px 4px;
    background: var(--panel-soft);
    border: 1px solid var(--border);
    border-radius: var(--r-pill);
    font-size: var(--fs-sm); color: var(--text-2);
  }
  .topbar .account .av {
    width: 28px; height: 28px;
    background: linear-gradient(135deg, #818cf8 0%, #c084fc 100%);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-weight: 700; font-size: 12px;
    flex-shrink: 0;
  }
  .topbar .account .av.guest {
    background: linear-gradient(135deg, var(--muted-2) 0%, var(--muted) 100%);
  }
  .topbar .account .who {
    display: flex; flex-direction: column; line-height: 1.15;
    max-width: 220px; overflow: hidden;
  }
  .topbar .account .who .label {
    font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em;
  }
  .topbar .account .who .val {
    font-size: var(--fs-sm); color: var(--text); font-weight: 500;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    font-variant-numeric: tabular-nums;
  }
  .topbar .icon-btn {
    width: 36px; height: 36px;
    display: inline-flex; align-items: center; justify-content: center;
    background: transparent;
    color: var(--muted);
    border-radius: var(--r-md);
    padding: 0;
    box-shadow: none;
    font-weight: 400;
  }
  .topbar .icon-btn:hover { background: var(--accent-soft); color: var(--accent); }
  .topbar .icon-btn svg { width: 18px; height: 18px; }

  /* ---------- 工具栏（三段卡片式：左筛选 / 中搜索 / 右操作） ---------- */
  .toolbar {
    display: flex; align-items: center; gap: var(--s-2);
    margin-bottom: var(--s-4);
    flex-wrap: wrap; row-gap: var(--s-2);
  }
  .tb-card {
    display: flex; align-items: center; gap: 6px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--r-md);
    padding: 5px 8px;
    box-shadow: var(--sh-1);
  }
  .tb-filters { flex: 0 0 auto; flex-wrap: wrap; row-gap: 6px; }
  .tb-search  { flex: 1 1 320px; min-width: 220px; }
  .tb-actions { flex: 0 0 auto; flex-wrap: wrap; justify-content: flex-end; gap: 4px; row-gap: 6px; }
  /* 中窄屏（≤1366）：操作组落入第二行时占满整行并左对齐，
     避免「右侧空、左侧重」的失衡；宽屏（>1366）则三段同行。 */
  @media (max-width: 1366px) {
    .tb-actions { flex: 1 1 100%; justify-content: flex-start; }
  }

  /* 组内字段标签：始终横排，不被拆成竖向单字 */
  .tb-group-label {
    font-size: var(--fs-xs); color: var(--muted); font-weight: 600;
    white-space: nowrap; flex-shrink: 0; margin-right: 2px;
  }
  .tb-sep {
    width: 1px; height: 20px; background: var(--border);
    margin: 0 2px; flex-shrink: 0;
  }
  /* 搜索下拉：不再被 content 强行撑宽，给一个可控最小宽度 */
  .toolbar .search-select { flex-shrink: 1; min-width: 150px; }
  .toolbar select { flex-shrink: 0; }
  .toolbar select, .toolbar .search-select input {
    width: auto; padding: 6px var(--s-3);
    border: 1px solid transparent; background: transparent;
    border-radius: var(--r-sm);
    font-size: var(--fs-sm); color: var(--text); cursor: pointer;
    transition: background .15s, border-color .15s;
  }
  .toolbar select:hover, .toolbar .search-select input:hover { background: var(--panel-soft); }
  /* 中段搜索卡片：独占一整段，吸纳所有剩余横向空间。
     关键：必须覆盖 base `.chip-search { max-width:420px; display:inline-flex; min-width:240px }` 的尺寸锁，
     否则搜索盒在 1280-1366 视口下会被卡死成 420，右侧残留 280+px 空白。 */
  .tb-card.tb-search .chip-search {
    display: flex;
    flex: 1 1 0%;
    min-width: 0;
    max-width: none;
    width: 100%;
    background: var(--panel-soft);
    border: 1px solid transparent;
    border-radius: var(--r-sm);
    margin-left: 0;
  }
  .tb-search .chip-search:focus-within {
    background: #fff; border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-ring);
  }
  .toolbar .pill-btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 6px var(--s-3);
    background: transparent;
    color: var(--text-2); font-weight: 500;
    border-radius: var(--r-sm);
    border: none;
    box-shadow: none;
    font-size: var(--fs-sm);
    transition: background .15s, color .15s;
  }
  .toolbar .pill-btn:hover { background: var(--accent-soft); color: var(--accent); }
  .toolbar .pill-btn svg { width: 15px; height: 15px; }
  .toolbar .pill-btn.primary {
    background: var(--accent); color: #fff;
    box-shadow: 0 1px 2px rgba(79,70,229,.18);
  }
  .toolbar .pill-btn.primary:hover { background: var(--accent-2); color: #fff; }
  .toolbar .pill-btn.active {
    background: var(--accent-soft); color: var(--accent);
    box-shadow: inset 0 0 0 1px var(--accent);
  }
  /* 导出进度浮层 */
  .export-progress {
    position: fixed; inset: 0; z-index: 300;
    display: flex; align-items: center; justify-content: center;
    background: rgba(15, 18, 28, .45);
  }
  .export-progress.hidden { display: none; }
  .ep-card {
    width: 340px; background: var(--panel); border: 1px solid var(--border);
    border-radius: var(--r-md); padding: 22px 22px 19px;
    box-shadow: 0 12px 40px rgba(0, 0, 0, .25);
  }
  .ep-title { font-weight: 600; font-size: 15px; color: var(--text-2); margin-bottom: 14px; }
  .ep-bar {
    height: 8px; border-radius: 99px; background: var(--accent-soft);
    overflow: hidden;
  }
  .ep-fill {
    height: 100%; width: 0%; background: var(--accent);
    border-radius: 99px; transition: width .35s ease;
  }
  .ep-status { margin-top: 11px; font-size: 13px; color: var(--text-2); min-height: 18px; }
  .ep-meta { margin-top: 4px; font-size: 12px; color: #94a3b8; }
  /* 导出开关：仅任务 / 含评论 分段控件 */
  .toolbar .export-switch {
    display: inline-flex; border: 1px solid var(--border);
    border-radius: 8px; overflow: hidden; margin-left: 6px;
  }
  .toolbar .export-switch .seg {
    border: none; background: var(--panel); color: #64748b;
    padding: 6px 11px; cursor: pointer; font-size: 13px; line-height: 1.2;
  }
  .toolbar .export-switch .seg:hover { background: var(--accent-soft); }
  .toolbar .export-switch .seg.active {
    background: var(--accent-soft); color: var(--accent); font-weight: 600;
  }
  .toolbar .pill-btn.primary:disabled { opacity: .6; cursor: default; }
  /* 「延期任务」按钮 badge 探测中态：文字色变弱 + 一个跳动的省略号点 */
  #overdueBtnLabel.scanning {
    color: var(--muted);
    position: relative;
    padding-left: 14px;
  }
  #overdueBtnLabel.scanning::before {
    content: "";
    position: absolute;
    left: 0; top: 50%;
    width: 6px; height: 6px;
    margin-top: -3px;
    border-radius: 50%;
    background: var(--accent);
    animation: badge-dot 0.9s ease-in-out infinite;
  }
  @keyframes badge-dot {
    0%, 100% { opacity: 0.3; transform: scale(0.8); }
    50%      { opacity: 1;   transform: scale(1.2); }
  }

  /* 搜索式项目选择器 */
  .search-select { position: relative; display: inline-block; min-width: 180px; }
  .search-select input {
    width: 100%; padding: 6px 28px 6px var(--s-3); border: 1px solid transparent;
    border-radius: var(--r-sm); font-size: var(--fs-sm); background: transparent;
    color: var(--text); cursor: pointer; font-weight: 500;
    transition: background .15s;
  }
  .search-select input:hover { background: var(--panel-soft); }
  .search-select input:focus { outline: none; background: #fff;
    box-shadow: 0 0 0 3px var(--accent-ring); }
  .search-select .caret {
    position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
    pointer-events: none; color: var(--muted); font-size: 11px;
  }
  /* 通用搜索式下拉（项目选择器 / 任务名候选） */
  .search-select-menu {
    position: fixed; min-width: 260px; max-height: 320px;
    overflow-y: auto; background: var(--panel); border: 1px solid var(--border);
    border-radius: var(--r-md); box-shadow: var(--sh-3);
    z-index: 2000;
  }
  .search-select-menu .menu-title {
    padding: 8px 12px; font-size: var(--fs-xs); color: var(--muted);
    background: var(--panel-soft); border-bottom: 1px solid var(--border-soft);
    border-radius: var(--r-md) var(--r-md) 0 0;
    display: flex; align-items: center; gap: 6px;
    text-transform: uppercase; letter-spacing: .04em; font-weight: 600;
  }
  .search-select-menu .menu-title .dot {
    width: 7px; height: 7px; background: var(--accent); border-radius: 50%;
    display: inline-block;
  }
  .search-select-menu .opt {
    padding: 8px 12px; cursor: pointer; font-size: var(--fs-sm); color: var(--text);
    border-bottom: 1px solid var(--border-soft);
    transition: background .1s;
  }
  .search-select-menu .opt:last-child { border-bottom: none; }
  .search-select-menu .opt:hover,
  .search-select-menu .opt.highlighted { background: var(--accent-soft); }
  .search-select-menu .opt.selected { font-weight: 600; color: var(--accent); }
  .search-select-menu .opt .hl {
    background: #fff3a0; color: #333; border-radius: 2px; padding: 0 1px;
  }
  .search-select-menu .opt-meta { font-size: var(--fs-xs); color: var(--muted); margin-left: 6px; }
  .search-select-menu .opt-empty {
    padding: var(--s-4); color: var(--muted); text-align: center; font-size: var(--fs-sm);
  }
  .search-select-menu .menu-hint {
    padding: 6px 12px; font-size: var(--fs-xs); color: var(--muted);
    background: var(--panel-soft); border-top: 1px solid var(--border-soft);
    border-radius: 0 0 var(--r-md) var(--r-md); text-align: center;
  }

  /* 任务名称模糊搜索框 */
  .chip-search {
    position: relative; display: inline-flex; flex-wrap: wrap; align-items: center;
    gap: 6px; min-width: 240px; max-width: 420px;
    padding: 4px var(--s-2); border: 1px solid transparent; border-radius: var(--r-md);
    background: var(--panel-soft); color: var(--text);
    transition: background .15s, border-color .15s, box-shadow .15s;
  }
  .chip-search:focus-within {
    background: #fff; border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-ring);
  }
  .chip-area { display: contents; }   /* 让 chip 直接参与父容器 flex 排列 */
  .chip {
    display: inline-flex; align-items: center; gap: 4px; max-width: 220px;
    padding: 3px 4px 3px 8px; background: var(--accent-soft);
    border: 1px solid #bfdbfe; border-radius: 14px;
    font-size: 12.5px; color: #1e40af; line-height: 1.3;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .chip .chip-meta {
    color: #64748b; margin-right: 2px; max-width: 80px;
    overflow: hidden; text-overflow: ellipsis;
  }
  .chip .chip-close {
    border: none; background: transparent; color: #475569;
    width: 18px; height: 18px; line-height: 16px; text-align: center;
    border-radius: 50%; padding: 0; font-size: 14px; cursor: pointer;
  }
  .chip .chip-close:hover { background: rgba(0,0,0,.08); }
  .chip-search .search-input { position: relative; display: inline-flex; align-items: center; flex: 1; min-width: 160px; }
  .chip-search .search-input input {
    flex: 1; min-width: 140px; padding: 4px 26px 4px 6px;
    border: none; outline: none; background: transparent;
    font-size: 14px; color: var(--text);
  }
  .chip-search .search-clear {
    position: absolute; right: 4px; top: 50%; transform: translateY(-50%);
    width: 18px; height: 18px; line-height: 16px; text-align: center;
    border: none; background: #e5e7eb; color: #475569; border-radius: 50%;
    font-size: 14px; padding: 0; cursor: pointer; display: none;
  }
  .chip-search .search-clear:hover { background: #d1d5db; }
  .chip-search.has-value .search-clear { display: block; }
  .chip-search .search-go {
    padding: 5px 12px; font-size: 13px; line-height: 1;
  }
  .chip-hint {
    flex-basis: 100%; padding: 0 2px; font-size: 11.5px; color: var(--muted);
    line-height: 1.5;
  }
  .chip-hint kbd {
    display: inline-block; padding: 1px 5px; border-radius: 3px;
    border: 1px solid #e2e8f0; background: #f1f5f9; font-size: 10.5px;
    color: #475569;
  }

  /* 任务名称命中关键词高亮 */
  td.cell-title .hl {
    background: #fff3a0; color: #333; border-radius: 2px; padding: 0 1px;
  }
  .search-banner {
    margin-bottom: 12px; padding: 9px 14px;
    background: var(--accent-soft); border: 1px solid #bfdbfe;
    border-radius: 8px; font-size: 13px; color: #1e40af;
  }
  .search-banner b { color: #1d4ed8; }

  table { width: 100%; border-collapse: separate; border-spacing: 0;
    background: var(--panel); border-radius: var(--r-lg); }
  /* 项目卡片内的表格：宽度按内容贴合，短列贴短内容、长列贴长内容。
     - 自适应 (auto) 列：renderTable 后 measureAndFitAutoColumns() 量该列所有 cell 的
       "内容宽 + padding"（取表头与 body 的较大者），写入 col.style.width 让列宽贴住内容。
     - 固定 (fixed) 列：col 显式 style.width（用户可拖拽改），不参与测量。
     - 关键：measureAndFitAutoColumns() 还会把整张表定宽到"各列宽之和"（确定像素宽），
       让剩余空间 = 0，浏览器不再把容器剩余宽度均摊给 auto 列（否则短 cell 被拉宽）。
     - 列总宽 ≤ 容器时表格居左、右侧留白；列总宽 > 容器时 .proj-block 已设 overflow-x:auto 横滚。
     - 跨多张项目表时，measureAndFitAutoColumns() 还会取每个 colIdx 在所有表里的"最大值"
       作为该列的统一宽 —— 保证所有项目表的同一列宽度一致，跨表数据"列对列"自然对齐。
     - table-layout:fixed（而非 auto）：auto 模式下浏览器会把"容器-内容"的剩余空间分配
       给各列（实测 code/owner/updated 被拉到 134/147/160px），fixed + 确定表宽可根治。 */
  table.proj-table { width: auto; table-layout: fixed; }
  table.proj-table th, table.proj-table td {
    overflow-wrap: anywhere; word-break: break-word;
  }
  /* 自适应列：渲染后 JS 会精确测量每列最长内容 + padding 写入 col.style.width。
     td 上 white-space:nowrap + overflow:hidden + ellipsis 是兜底 —— 极长内容超
     测量阈值时截断省略号，不会撑爆列宽。 */
  table.proj-table col[data-mode="auto"],
  table.proj-table th[data-mode="auto"],
  table.proj-table td[data-mode="auto"] {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  /* updated 列豁免上面 auto 兜底规则（auto 模式也允许换行两段显示） */
  table.proj-table col.cell-updated[data-mode="auto"],
  table.proj-table td.cell-updated[data-mode="auto"],
  table.proj-table th.cell-updated[data-mode="auto"] {
    white-space: normal;
    overflow: visible;
    text-overflow: clip;
  }
  /* 任务编号/任务名称：通常是短字段，给个最小可见宽度 */
  table.proj-table td.cell-id,
  table.proj-table td.cell-title { min-width: 60px; }
  /* 任务负责人（窄列下不拆字符 + 截断省略号）。
     updated 列单独走两行渲染（日期 + 时间各一段），不在这里命中。
     命中规则必须用 .cell-* class，不能用 nth-last-child(-n+2)，否则列序变动时会误伤其他列。 */
  table.proj-table td.cell-owner,
  table.proj-table th.cell-owner {
    overflow-wrap: normal; word-break: normal;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  /* updated 列允许换行（窄列下日期/时间拆两行显示），不再 nowrap+ellipsis */
  table.proj-table td.cell-updated,
  table.proj-table th.cell-updated {
    white-space: normal;
  }
  /* 截止时间列：复用 updated-time 等宽数字样式，允许换行 */
  table.proj-table td.cell-due {
    color: var(--muted); font-size: var(--fs-xs); white-space: normal;
  }
  table.proj-table td.cell-due .updated-time { font-variant-numeric: tabular-nums; }
  /* 逾期天数：按严重程度分级配色（<=3 天浅 / 3~7 天中 / >=7 天深红） */
  table.proj-table td.cell-overdue {
    text-align: center; font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  table.proj-table td.cell-overdue .overdue-num { font-weight: 700; font-size: 14px; }
  table.proj-table td.cell-overdue .overdue-unit { font-size: 11px; color: var(--muted); margin-left: 1px; }
  table.proj-table td.cell-overdue.sev-low  .overdue-num { color: #b45309; }
  table.proj-table td.cell-overdue.sev-mid  .overdue-num { color: #ea580c; }
  table.proj-table td.cell-overdue.sev-high .overdue-num { color: #dc2626; }
  /* 右端点（最后一列）只在视觉上贴右，不再贴粗边、硬色块 —— 用柔和的内边距 + 极淡
     左边线 + 文字右对齐，告诉用户这是右端点，但更克制 */
  table.proj-table thead th:last-child {
    position: relative;
  }
  table.proj-table thead th:last-child::after {
    content: "";
    position: absolute; left: 0; top: 18%; bottom: 18%;
    width: 1px; background: var(--border);
  }
  table.proj-table th[data-endanchor] {
    text-align: right;
    padding-right: var(--s-4);
  }
  table.proj-table td:last-child {
    text-align: right;
    padding-right: var(--s-4);
  }
  /* 评论列：内容可能很长（多评论+图片），让列内独立横向滚动，不再撑宽整表 */
  table.proj-table td.cell-comments {
    max-width: 600px;
    overflow: hidden;             /* cell 不撑列，列宽只由 colgroup 决定 */
  }
  table.proj-table td.cell-comments .comments-inner {
    max-width: 100%;              /* 不超过 cell 宽 */
    overflow-x: auto;             /* 长评论/长附件在 cell 内独立横向滚动 */
    overflow-y: visible;
  }
  /* 评论列的表头：防止"评论"两字被换行 */
  table.proj-table thead th.cell-comments {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  /* 表头：作为 resizer 绝对定位的参考系 */
  table.proj-table thead th { position: relative; }
  /* 列宽调节手柄：悬停在 th 右侧边缘 */
  table.proj-table .col-resizer {
    position: absolute; top: 0; right: -3px;
    width: 8px; height: 100%; cursor: col-resize;
    z-index: 3; user-select: none;
  }
  table.proj-table .col-resizer::after {
    content: ""; position: absolute; top: 25%; bottom: 25%; left: 3px;
    width: 2px; background: transparent; border-radius: 2px;
    transition: background 0.15s;
  }
  table.proj-table .col-resizer:hover::after,
  table.proj-table .col-resizer.dragging::after { background: var(--accent); }
  /* 拖拽列宽时全局禁用文字选择、强制手型光标 */
  body.col-resizing, body.col-resizing * {
    cursor: col-resize !important; user-select: none !important;
  }
  /* ============ th/td 基础节奏 ============ */
  th, td {
    text-align: left; padding: 14px var(--s-4);
    border-bottom: 1px solid var(--border-soft);
    vertical-align: middle;
  }
  th {
    background: linear-gradient(180deg, #fafbfd 0%, #f6f8fb 100%);
    font-weight: 600; color: var(--text-2);
    font-size: var(--fs-xs);
    text-transform: uppercase; letter-spacing: .04em;
    border-bottom: 1px solid var(--border);
  }
  tbody tr.task-row { transition: background .12s; }
  tbody tr.task-row:hover { background: var(--accent-soft); }
  tbody tr.task-row td { color: var(--text); font-size: var(--fs-sm); }
  /* ============ 项目分组卡片 ============ */
  .proj-block {
    margin-bottom: var(--s-4);
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--r-lg);
    overflow-x: auto;     /* 表格列宽总和 > 容器宽时允许水平滚动（不裁掉最后几列） */
    overflow-y: hidden;
    max-width: 100%;
    box-sizing: border-box;
    box-shadow: var(--sh-1);
  }
  .proj-block:last-child { margin-bottom: 0; }
  .proj-block table { border: none; border-radius: var(--r-lg); }
  /* 项目单元格：横排展示 + 色点标识 + 任务数，不再用竖排文字 */
  td.proj-cell {
    background: linear-gradient(180deg, #fafbfd 0%, #f6f8fb 100%);
    vertical-align: middle;
    border-right: 1px solid var(--border-soft);
    padding: var(--s-3) var(--s-4);
    min-width: 140px;
  }
  td.proj-cell .proj-head {
    display: flex; align-items: center; gap: var(--s-2);
    margin-bottom: 4px;
  }
  td.proj-cell .proj-dot {
    width: 10px; height: 10px; border-radius: 50%;
    flex-shrink: 0;
    box-shadow: 0 0 0 3px rgba(99,102,241,.12);
  }
  td.proj-cell .proj-name {
    font-weight: 700; font-size: var(--fs-md);
    color: var(--text); line-height: 1.3;
    overflow-wrap: anywhere;
    word-break: keep-all;
    display: inline-block;
  }
  td.proj-cell .proj-meta {
    display: flex; align-items: center; gap: var(--s-2);
    font-size: var(--fs-xs); color: var(--muted);
    line-height: 1.3;
  }
  td.proj-cell .proj-count {
    display: inline-flex; align-items: center; gap: 4px;
  }
  td.proj-cell .proj-count strong {
    color: var(--text); font-weight: 700; font-variant-numeric: tabular-nums;
  }
  td.proj-cell .proj-dot-c1 { background: var(--p-1); box-shadow: 0 0 0 3px rgba(99,102,241,.12); }
  td.proj-cell .proj-dot-c2 { background: var(--p-2); box-shadow: 0 0 0 3px rgba(6,182,212,.12); }
  td.proj-cell .proj-dot-c3 { background: var(--p-3); box-shadow: 0 0 0 3px rgba(245,158,11,.14); }
  td.proj-cell .proj-dot-c4 { background: var(--p-4); box-shadow: 0 0 0 3px rgba(16,185,129,.12); }
  td.proj-cell .proj-dot-c5 { background: var(--p-5); box-shadow: 0 0 0 3px rgba(236,72,153,.12); }
  td.proj-cell .proj-dot-c6 { background: var(--p-6); box-shadow: 0 0 0 3px rgba(139,92,246,.12); }

  /* ============ 单表模式（overdue 视图）：项目列紧凑版 ============
     不再 rowspan 合并，每行单独显示；色点 + 项目名，列宽固定 180px，
     长项目名截断省略号。色点色板与 proj-cell 复用 1~6。 */
  td.proj-cell-inline {
    vertical-align: middle;
    padding: 10px var(--s-3);
    border-right: 1px solid var(--border-soft);
    background: linear-gradient(180deg, #fafbfd 0%, #f6f8fb 100%);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  td.proj-cell-inline .proj-dot {
    display: inline-block;
    width: 8px; height: 8px; border-radius: 50%;
    margin-right: 6px;
    vertical-align: middle;
    flex-shrink: 0;
  }
  td.proj-cell-inline .proj-name {
    font-size: var(--fs-xs);
    color: var(--text-2);
    font-weight: 500;
    vertical-align: middle;
  }
  td.proj-cell-inline .proj-dot-c1 { background: var(--p-1); box-shadow: 0 0 0 2px rgba(99,102,241,.12); }
  td.proj-cell-inline .proj-dot-c2 { background: var(--p-2); box-shadow: 0 0 0 2px rgba(6,182,212,.12); }
  td.proj-cell-inline .proj-dot-c3 { background: var(--p-3); box-shadow: 0 0 0 2px rgba(245,158,11,.14); }
  td.proj-cell-inline .proj-dot-c4 { background: var(--p-4); box-shadow: 0 0 0 2px rgba(16,185,129,.12); }
  td.proj-cell-inline .proj-dot-c5 { background: var(--p-5); box-shadow: 0 0 0 2px rgba(236,72,153,.12); }
  td.proj-cell-inline .proj-dot-c6 { background: var(--p-6); box-shadow: 0 0 0 2px rgba(139,92,246,.12); }
  /* 项目切换处的可视分隔线（同一张表内，相邻行项目名变化时加一道浅分割） */
  tbody tr.task-row.project-change td {
    border-top: 1px solid var(--border);
  }

  /* ============ 任务编号：等宽 # ID 风格 ============ */
  td.cell-id .id-tag {
    display: inline-flex; align-items: center;
    padding: 3px 8px;
    background: var(--panel-soft);
    border: 1px solid var(--border);
    border-radius: var(--r-sm);
    font-family: var(--ff-mono);
    font-size: var(--fs-xs);
    color: var(--text-2);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  td.cell-id .id-tag::before {
    content: "#";
    color: var(--muted-2); margin-right: 1px; font-weight: 600;
  }
  /* 任务名称：可点击跳转 Worktile 任务详情页（新标签页） */
  td.cell-title a {
    color: var(--accent); text-decoration: none; font-weight: 600;
  }
  td.cell-title a:hover { text-decoration: underline; }
  /* 最近更新时间：弱化显示 + 等宽数字。
     列宽够时单行显示 'YYYY-MM-DD HH:MM:SS'；列宽窄时在中间空格处自然换行成两行。
     原理：white-space: normal（默认）是空格处可断行的普通排版，浏览器根据可用宽度
     自动决定是否换行。这里不用 pre-line —— 那会把 \n 当强制换行，列宽够也会换行；
     这里也用 nowrap + ellipsis —— 那个会把内容截成省略号而非换行。 */
  td.cell-updated { color: var(--muted); font-size: var(--fs-xs); line-height: 1.35; white-space: normal; }
  td.cell-updated .updated-time {
    font-variant-numeric: tabular-nums;
  }
  .muted { color: var(--muted); }

  /* ============ 任务负责人：头像 / ghost 未分配 ============ */
  td.cell-owner { vertical-align: middle; }
  td.cell-owner .owner {
    display: inline-flex; align-items: center; gap: 8px;
    font-size: var(--fs-sm); color: var(--text); font-weight: 500;
    line-height: 1.2;
  }
  td.cell-owner .owner .av {
    width: 28px; height: 28px; border-radius: 50%;
    display: inline-flex; align-items: center; justify-content: center;
    color: #fff; font-weight: 700; font-size: 12px;
    background: linear-gradient(135deg, var(--accent) 0%, #818cf8 100%);
    flex-shrink: 0;
    box-shadow: 0 1px 2px rgba(15,23,42,.06);
  }
  td.cell-owner .owner .av.c1 { background: linear-gradient(135deg, #6366f1, #818cf8); }
  td.cell-owner .owner .av.c2 { background: linear-gradient(135deg, #06b6d4, #67e8f9); }
  td.cell-owner .owner .av.c3 { background: linear-gradient(135deg, #f59e0b, #fbbf24); }
  td.cell-owner .owner .av.c4 { background: linear-gradient(135deg, #10b981, #6ee7b7); }
  td.cell-owner .owner .av.c5 { background: linear-gradient(135deg, #ec4899, #f9a8d4); }
  td.cell-owner .owner .av.c6 { background: linear-gradient(135deg, #8b5cf6, #c4b5fd); }
  td.cell-owner .owner .name {
    max-width: 120px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  td.cell-owner .owner.unassigned {
    color: var(--muted-2);
    font-weight: 400;
  }
  td.cell-owner .owner.unassigned .av {
    background: transparent;
    border: 1.5px dashed var(--muted-2);
    color: var(--muted-2);
  }
  td.cell-owner .owner.unassigned .av::after {
    content: "?"; font-weight: 600; font-size: 13px;
  }
  td.cell-owner .owner.unassigned .av-letter { display: none; }
  td.cell-owner .owner.unassigned .name {
    font-style: italic;
  }

  /* 任务行内的评论列：紧凑堆叠多条评论 */
  td.cell-comments { vertical-align: top; overflow-wrap: anywhere; }
  td.cell-comments .comments-inner { padding: 0; }
  /* 评论卡：圆角 + 柔和底色 + 头像（不是左竖线） */
  .comment-block {
    padding: 10px 12px;
    margin-bottom: 10px;
    background: var(--panel-soft);
    border: 1px solid var(--border-soft);
    border-radius: var(--r-md);
    transition: border-color .12s, background .12s;
  }
  .comment-block:hover { border-color: var(--border); background: #fff; }
  .comment-block:last-child { margin-bottom: 0; }
  .comment-block .meta {
    display: flex; align-items: center; gap: 8px;
    font-size: var(--fs-xs); color: var(--muted); margin-bottom: 6px;
  }
  .comment-block .meta .meta-av {
    width: 20px; height: 20px; border-radius: 50%;
    background: linear-gradient(135deg, #94a3b8, #cbd5e1);
    color: #fff; font-size: 10px; font-weight: 700;
    display: inline-flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .comment-block .meta b {
    color: var(--text); font-weight: 600; font-size: var(--fs-sm);
  }
  .comment-block .body.emoji-only {
    font-size: 28px; line-height: 1.2;
    padding: 4px 0 2px;
  }
  /* 评论正文：超长无空格字符串（包括中文 CJK 长串、连续英文字母、单一 URL 等）
     都应该能按容器宽度断行 —— 用 overflow-wrap: anywhere + word-break: break-word 双保险 */
  .comment-block .body {
    font-size: 13px; line-height: 1.55;
    overflow-wrap: anywhere;
    word-break: break-word;
    min-width: 0;            /* flex/grid 内也能正常断行 */
    max-width: 100%;
  }
  .comment-block .body p {
    margin: 0 0 6px;
    line-height: 1.55;
    overflow-wrap: anywhere;
    word-break: break-word;
    min-width: 0;
    max-width: 100%;
  }
  .comment-block .body p:last-child { margin-bottom: 0; }
  /* 评论文本里的 URL 自动链接化（renderContent 中识别 https?://...） */
  .comment-block .body a.cmt-link {
    color: var(--accent);
    text-decoration: none;
    word-break: break-all;
    border-bottom: 1px solid rgba(79, 70, 229, .35);
    transition: color .12s, border-color .12s, background .12s;
  }
  .comment-block .body a.cmt-link:hover {
    color: var(--accent-2);
    background: rgba(79, 70, 229, .08);
    border-bottom-color: var(--accent);
  }
  .comment-block .body a.cmt-link::after {
    content: "↗";
    display: inline-block;
    margin-left: 2px;
    font-size: 0.85em;
    opacity: .55;
    text-decoration: none;
    vertical-align: baseline;
  }
  /* 行内 code（含 markdown `code`） */
  .comment-block .body code:not(pre code) {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    background: #f1f5f9; color: #0f172a;
    padding: 1px 5px; border-radius: 3px;
    border: 1px solid #e2e8f0;
    font-size: 12.5px; word-break: break-all;
  }
  /* 代码块（``` ``` 包裹 / 启发式 shell 段） */
  .comment-block .body pre.code-block {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    background: #0f172a; color: #e2e8f0;
    padding: 10px 12px; border-radius: 6px;
    margin: 6px 0; overflow-x: auto;
    font-size: 12.5px; line-height: 1.55;
    white-space: pre; word-break: normal;
    border: 1px solid #1e293b;
  }
  .comment-block .body pre.code-block .lang {
    display: block;
    color: #64748b; font-size: 11px;
    margin-bottom: 6px; letter-spacing: .05em;
    text-transform: uppercase; user-select: none;
  }
  .comment-block .atts {
    margin-top: 6px;
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  /* 图片附件：垂直卡片（缩略图上 + 文件名下），长文件名自动换行 */
  .comment-block .att.img-type {
    display: inline-flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 4px;
    padding: 4px;
    max-width: 200px;
    background: #ecfeff;
    color: #155e75;
    border: 1px solid #a5f3fc;
    border-radius: 4px;
    font-size: 12px;
  }
  /* 文件附件：链接，长文件名自动换行 */
  .comment-block .att.file-type {
    display: inline-flex;
    align-items: flex-start;
    padding: 4px 8px;
    max-width: 240px;
    background: #f1f5f9;
    color: #334155;
    border: 1px solid #cbd5e1;
    border-radius: 4px;
    font-size: 12px;
    text-decoration: none;
    word-break: break-all;
  }
  .comment-block .att.file-type:hover { background: #e2e8f0; }
  /* 文件名：自动换行 */
  .comment-block .att .fname {
    font-weight: 500;
    display: block;
    width: 100%;
    word-break: break-all;
    line-height: 1.4;
  }
  /* 图片缩略图：可点击放大，宽度在父容器内自适应 */
  .att-thumb {
    display: block;
    max-width: 100%;
    max-height: 92px;
    width: auto; height: auto;
    border-radius: 4px;
    border: 1px solid #cbd5e1;
    object-fit: cover;
    cursor: zoom-in;
  }
  /* 图片放大遮罩层 */
  #lightbox {
    position: fixed; inset: 0; z-index: 9999;
    display: none;
    align-items: center; justify-content: center;
    background: rgba(15, 23, 42, 0.82);
    cursor: zoom-out;
  }
  #lightbox.active { display: flex; }
  #lightbox img {
    max-width: 92vw; max-height: 92vh;
    object-fit: contain;
    border-radius: 6px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.5);
  }
  .cell-loading, .cell-empty, .cell-error {
    font-size: var(--fs-sm); color: var(--muted);
    display: flex; align-items: center; gap: 8px;
    padding: var(--s-2) 0;
  }
  .cell-loading::before, .cell-empty::before, .cell-error::before {
    content: ""; width: 8px; height: 8px; border-radius: 50%;
    background: var(--border); flex-shrink: 0;
  }
  .cell-loading::before {
    background: var(--accent);
    animation: cellPulse 1.4s ease-in-out infinite;
  }
  .cell-empty { color: var(--muted-2); font-style: italic; }
  .cell-error { color: var(--danger); }
  .cell-error::before { background: var(--danger); }
  @keyframes cellPulse {
    0%, 100% { opacity: .35; }
    50%      { opacity: 1;   }
  }
  .comment .empty { color: var(--muted); font-style: italic; }
  /* 全局 loading：友好骨架/文案 */
  .loading {
    padding: 60px 24px; text-align: center;
    color: var(--muted); font-size: var(--fs-sm);
    display: flex; flex-direction: column; align-items: center; gap: var(--s-3);
  }
  .loading::before {
    content: ""; width: 32px; height: 32px;
    border: 3px solid var(--border); border-top-color: var(--accent);
    border-radius: 50%; animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading.error {
    color: var(--danger);
    background: #fef2f2; border-radius: var(--r-md);
    border: 1px solid #fecaca;
    padding: var(--s-4) var(--s-6);
  }
  .loading.error::before { display: none; }
  .error-hint { margin-top: var(--s-2); font-size: var(--fs-sm); color: var(--muted); }
  /* 空态：与 .loading 同尺寸同位置，但无 spinner 旋转动画 */
  .empty {
    padding: 60px 24px; text-align: center;
    color: var(--muted); font-size: var(--fs-sm);
  }

  /* 分页 */
  .pager {
    display: flex; align-items: center; justify-content: center;
    gap: var(--s-3); flex-wrap: wrap;
    margin-top: var(--s-5); margin-bottom: var(--s-2);
  }
  .pager .info { color: var(--muted); font-size: var(--fs-sm); font-variant-numeric: tabular-nums; }
  .pager .pager-btn {
    padding: 7px var(--s-4); border: 1px solid var(--border);
    background: #fff; color: var(--text); border-radius: var(--r-md);
    font-size: var(--fs-sm); font-weight: 500; cursor: pointer;
    transition: border-color .15s, background .15s, color .15s;
    box-shadow: var(--sh-1);
  }
  .pager .pager-btn:hover:not(:disabled) {
    border-color: var(--accent); color: var(--accent);
    background: var(--accent-soft);
  }
  .pager .pager-btn:disabled {
    opacity: .4; cursor: not-allowed; background: var(--panel-soft); box-shadow: none;
  }
  .pager .page-jump {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: var(--fs-sm); color: var(--muted);
  }
  .pager .page-input {
    width: 56px; padding: 6px var(--s-2); text-align: center;
    border: 1px solid var(--border); border-radius: var(--r-sm); font-size: var(--fs-sm);
    background: #fff; color: var(--text);
    transition: border-color .15s, box-shadow .15s;
    font-variant-numeric: tabular-nums;
  }
  .pager .page-input:focus {
    outline: none; border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-ring);
  }
  .pager .page-input:disabled {
    background: var(--panel-soft); color: var(--muted-2); cursor: not-allowed;
  }
  .pager .page-go {
    padding: 6px var(--s-3); border: 1px solid var(--border);
    background: #fff; color: var(--accent); border-radius: var(--r-sm);
    font-size: var(--fs-sm); font-weight: 500; cursor: pointer; transition: all .15s;
  }
  .pager .page-go:hover {
    background: var(--accent-soft); border-color: var(--accent);
  }
  .hidden { display: none; }

  /* ============== 列设置弹窗 ============== */
  /* 用 :not(.hidden) 而非默认 flex：保证 .hidden { display:none } 真的能隐藏弹窗。
     否则 .col-modal-mask 与 .hidden 同优先级，后定义的 flex 会覆盖 none。 */
  .col-modal-mask:not(.hidden) {
    position: fixed; inset: 0; z-index: 5000;
    background: rgba(15, 23, 42, 0.42);
    display: flex; align-items: center; justify-content: center;
  }
  .col-modal-mask.hidden { display: none; }
  .col-modal {
    width: 460px; max-width: calc(100vw - 32px);
    background: var(--panel); border-radius: 12px;
    box-shadow: 0 20px 60px rgba(0,0,0,.25);
    overflow: hidden; animation: colModalIn 0.18s ease-out;
  }
  @keyframes colModalIn { from { transform: translateY(-8px); opacity: 0 } to { transform: none; opacity: 1 } }
  .col-modal header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 20px; border-bottom: 1px solid var(--border);
    background: #f8fafc;
  }
  .col-modal header h3 { margin: 0; font-size: 16px; }
  .col-modal header .x {
    border: none; background: transparent; color: var(--muted);
    font-size: 20px; line-height: 1; padding: 4px 8px; border-radius: 6px;
    cursor: pointer;
  }
  .col-modal header .x:hover { background: #eef2f7; color: var(--text); }
  .col-modal .modal-body { padding: 14px 20px 8px; }
  .col-modal .modal-hint {
    font-size: 12.5px; color: var(--muted); margin: 0 0 12px; line-height: 1.6;
  }
  .col-modal .cols-list { list-style: none; padding: 0; margin: 0; }
  .col-modal .col-row {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 12px; margin-bottom: 6px;
    border: 1px solid var(--border); border-radius: 8px;
    background: #fff; transition: border-color .12s, background .12s, box-shadow .12s;
    user-select: none;
  }
  .col-modal .col-row:hover { border-color: #c7d2fe; }
  .col-modal .col-row.dragging {
    opacity: 0.5; border-style: dashed;
  }
  .col-modal .col-row.drag-over-top { box-shadow: 0 -2px 0 0 var(--accent) inset; }
  .col-modal .col-row.drag-over-bot { box-shadow: 0 2px 0 0 var(--accent) inset; }
  .col-modal .col-row.is-hidden { background: #f8fafc; color: var(--muted); }
  .col-modal .col-row .drag-handle {
    color: #94a3b8; font-size: 14px; line-height: 1;
    cursor: grab; padding: 0 2px; letter-spacing: -2px;
  }
  .col-modal .col-row.anchor .drag-handle {
    cursor: not-allowed; color: #cbd5e1;
  }
  .col-modal .col-row .drag-handle:active { cursor: grabbing; }
  .col-modal .col-row input[type=checkbox] {
    width: 16px; height: 16px; cursor: pointer;
    accent-color: var(--accent);
  }
  .col-modal .col-row input[type=checkbox]:disabled { cursor: not-allowed; opacity: .6; }
  .col-modal .col-row .col-label {
    flex: 1; font-size: 14px; font-weight: 500;
  }
  .col-modal .col-row .col-tag {
    font-size: 11.5px; padding: 2px 8px; border-radius: 999px;
    background: #fef3c7; color: #92400e; border: 1px solid #fde68a;
  }
  /* 模式切换器：右端，segmented control 风格 */
  .col-modal .col-row .mode-switch {
    display: flex; border: 1px solid var(--border); border-radius: 6px;
    overflow: hidden; background: #fff; flex-shrink: 0;
  }
  .col-modal .col-row .mode-switch .mode-opt {
    display: flex; align-items: center; gap: 4px;
    padding: 4px 10px; font-size: 12px; color: var(--muted);
    cursor: pointer; user-select: none;
    border-right: 1px solid var(--border);
    transition: background .12s, color .12s;
  }
  .col-modal .col-row .mode-switch .mode-opt:last-child { border-right: none; }
  .col-modal .col-row .mode-switch .mode-opt:hover { background: #f8fafc; }
  .col-modal .col-row .mode-switch .mode-opt.active {
    background: var(--accent-soft); color: var(--accent); font-weight: 500;
  }
  .col-modal .col-row .mode-switch .mode-opt.disabled {
    cursor: not-allowed; opacity: .5; background: #f3f4f6;
  }
  .col-modal .col-row .mode-switch .mode-opt input[type=radio] {
    display: none; /* 自定义 segmented 外观，隐藏原生 radio */
  }
  .col-modal .col-row.anchor { background: #fffbeb; border-color: #fde68a; }
  .col-modal footer {
    display: flex; justify-content: space-between; gap: 12px;
    padding: 14px 20px; border-top: 1px solid var(--border);
    background: #f8fafc;
  }
  .col-modal footer .left { display: flex; gap: 8px; }
  .col-modal footer .right { display: flex; gap: 8px; }
  .col-modal .btn-text {
    background: transparent; color: var(--muted);
    border: 1px solid var(--border); padding: 7px 14px;
    font-size: 13px;
  }
  .col-modal .btn-text:hover { background: #f1f5f9; color: var(--text); }
</style>
</head>
<body>
<div class="wrap">

  <!-- 登录页 -->
  <div id="loginView">
    <div class="login-card">
      <h1>Worktile 任务评论区看板</h1>
      <p class="sub">输入租户的 Client ID 与 Client Secret 即可查看对应数据（公有云）</p>
      <div id="loginAlert" class="alert hidden"></div>
      <label class="field">
        <span>Client ID</span>
        <input type="text" id="clientId" placeholder="请输入 Client ID" autocomplete="off">
      </label>
      <label class="field">
        <span>Client Secret</span>
        <input type="password" id="clientSecret" placeholder="请输入 Client Secret" autocomplete="off">
      </label>
      <label class="field">
        <span>Worktile 域名（用于跳转任务详情页）</span>
        <input type="text" id="tenantInput" value="techwll.worktile.com"
               placeholder="如 techwll.worktile.com" autocomplete="off" spellcheck="false">
      </label>
      <button id="loginBtn" style="width:100%" onclick="doLogin()">进入看板</button>
    </div>
  </div>

  <!-- 看板页 -->
  <div id="boardView" class="hidden">
    <div class="topbar">
      <div class="brand">
        <div class="brand-mark">评</div>
        <div class="brand-name">
          <span class="title">任务评论区看板</span>
          <span class="sub">跨项目评论与负责人一览 · 按项目分组</span>
        </div>
      </div>
      <div class="account">
        <span class="av" id="accountAv">租</span>
        <span class="who">
          <span class="label">当前租户</span>
          <span class="val" id="tenantBadge">—</span>
        </span>
      </div>
      <button class="icon-btn" onclick="doLogout()" title="退出登录">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      </button>
    </div>

    <div class="toolbar">
      <!-- 左：筛选 -->
      <div class="tb-card tb-filters">
        <span class="tb-group-label">项目</span>
        <div class="search-select" id="projectPicker">
          <input type="text" id="projectInput" placeholder="搜索或选择项目…" autocomplete="off" spellcheck="false">
          <span class="caret">▾</span>
          <div class="search-select-menu" id="projectMenu" hidden></div>
        </div>
        <span class="tb-sep"></span>
        <span class="tb-group-label">负责人</span>
        <div class="search-select" id="ownerPicker">
          <input type="text" id="ownerInput" placeholder="全部负责人" autocomplete="off" spellcheck="false">
          <span class="caret">▾</span>
          <div class="search-select-menu" id="ownerMenu" hidden></div>
        </div>
        <span class="tb-sep"></span>
        <span class="tb-group-label">每页</span>
        <select id="pageSize" onchange="onPageSizeChange()">
          {% for opt in page_size_options %}
          <option value="{{ opt }}" {% if opt == 50 %}selected{% endif %}>{{ opt }}</option>
          {% endfor %}
        </select>
      </div>

      <!-- 中：搜索（独占一段，吸纳剩余空间） -->
      <div class="tb-card tb-search">
        <div class="chip-search" id="chipSearch">
          <div class="chip-area" id="chipArea"></div>
          <div class="search-input" id="titleSearchWrap">
            <input type="text" id="titleSearch" placeholder="搜索任务名称…" autocomplete="off" spellcheck="false">
            <button id="titleClear" class="search-clear" title="清除全部" onclick="clearTitleSearch()">×</button>
          </div>
          <button id="titleSearchBtn" class="search-go" onclick="onChipSearch()" title="按已选条件执行全局查询并拉评论">全局查询</button>
          <div class="search-select-menu" id="titleMenu" hidden></div>
        </div>
      </div>

      <!-- 右：操作（功能操作 / 业务操作 两块） -->
      <div class="tb-card tb-actions">
        <button id="overdueBtn" class="pill-btn" onclick="toggleOverdueView()" title="查看所有已过期且未完成的任务">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2"/><path d="M9 2h6"/></svg>
          <span id="overdueBtnLabel">延期任务</span>
        </button>
        <button id="refreshBtn" class="pill-btn" onclick="refreshAll()" title="重新拉取任务列表与评论">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
          刷新
        </button>
        <button id="colSettingsBtn" class="pill-btn" onclick="openColumnSettings()" title="自定义列显示与展示顺序">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><circle cx="3.5" cy="6" r="1.2" fill="currentColor"/><circle cx="3.5" cy="12" r="1.2" fill="currentColor"/><circle cx="3.5" cy="18" r="1.2" fill="currentColor"/></svg>
          列设置
        </button>
        <span class="tb-sep"></span>
        <div class="export-switch" id="exportSwitch">
          <button type="button" class="seg" id="expTasks" onclick="setExportMode('tasks')">仅任务</button>
          <button type="button" class="seg active" id="expComments" onclick="setExportMode('comments')">含评论</button>
        </div>
        <button id="exportBtn" class="pill-btn primary" onclick="exportExcel()" title="按当前视图与筛选条件导出 Excel">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          导出 Excel
        </button>
      </div>
    </div>

    <div id="tableArea"></div>

    <!-- 导出进度浮层 -->
    <div id="exportProgress" class="export-progress hidden">
      <div class="ep-card">
        <div class="ep-title">正在导出 Excel</div>
        <div class="ep-bar"><div class="ep-fill" id="epFill"></div></div>
        <div class="ep-status" id="epStatus">准备中…</div>
        <div class="ep-meta" id="epMeta"></div>
      </div>
    </div>

    <div class="pager" id="pager"></div>
  </div>

</div>

<script>
// ====================== 列定义元数据 ======================
// 端点锚定：项目名称（最左） + 最近更新时间（最右） 都是端点列 ——
// 永远在两端、永远可见、不可被其他列拖到中间；端点列不加 resizer，
// 只有"中间的列"才允许通过拖拽手柄调节列宽。
// 模式：fixed=固定列宽（可拖拽调节），auto=按内容自适应列宽。
// 列默认宽度（按截图实测：项目 230 / 编号 110 / 名称 270 / 负责人 130 / 评论 280 / 时间 90；
// fixed 列（项目/评论）硬按此值；auto 列（编号/名称/负责人/时间）按内容自适应，
// 实际渲染中 content 决定最终宽度，DEFAULT_COL_WIDTHS 仅在回退场景使用）
const COLS_META = [
  { key: "proj",     label: "项目名称",     width: 230, anchor: true,    mode: "fixed" },
  { key: "code",     label: "任务编号",     width: 110,               mode: "auto"  },
  { key: "title",    label: "任务名称",     width: 270,               mode: "auto"  },
  { key: "owner",    label: "任务负责人",   width: 130,               mode: "auto"  },
  { key: "due",      label: "截止时间",     width: 150,               mode: "auto"  },  // 仅「延期任务」视图显示
  { key: "overdue",  label: "逾期天数",     width: 90,                mode: "auto"  },  // 仅「延期任务」视图显示
  { key: "comments", label: "评论",        width: 490,               mode: "fixed" },
  { key: "updated",  label: "最近更新时间", width: 90,  endAnchor: true, mode: "auto" },
];
const DEFAULT_COL_MODES = Object.fromEntries(COLS_META.map(c => [c.key, c.mode]));

// 列宽最小值（自适应/固定列都遵守，避免列窄到看不见）
const COL_MIN_WIDTH = 36;

const COLUMN_CONFIG_KEY = "wt-board:column-config:v2";   // v2: 增加 modes 字段
const COL_WIDTHS_KEY    = "wt-board:col-widths:v2";      // 沿用 v2 键；索引按渲染时的当前 col 下标
const COL_WIDTHS_SCHEMA = 3;                             // 列宽存储 schema：v3 起附带 __schema 字段以利迁移；列顺序/默认值变更时 bump 该值
const DEFAULT_COL_ORDER = COLS_META.map(c => c.key);
const DEFAULT_COL_WIDTHS = Object.fromEntries(COLS_META.map(c => [c.key, c.width]));

const state = {
  projectId: "__all__",
  projectName: "全部项目",
  projects: [],       // 项目列表缓存（来自 /api/projects）
  // 负责人筛选：null=全部 / "__unassigned__"=未分配 / {uid, name}=具体成员
  // 负责人列表来自 /api/members，按 uid 匹配（name 中文相同也可能存在重复 uid）
  ownerFilter: null,
  // 导出模式：comments=含评论（默认）/ tasks=仅任务（不含评论 sheet，更快）
  exportMode: "comments",
  members: [],        // 负责人列表缓存（来自 /api/members），[{uid, name}]
  // 切换项目时清空 ownerFilter（避免跨项目残留不同成员造成"筛了等于没筛"的困惑）
  // ownerFilter 重置在 selectProject 内执行。
  tenantHost: "techwll.worktile.com",  // 任务详情页跳转用的租户域名（来自 /api/me 或登录响应）
  clientIdMasked: "",    // 当前租户打码后的 client_id（隔离标识，来自 /api/me 或登录响应）
  tenantFingerprint: "", // 当前租户指纹（隔离证明，同一租户恒定、不同租户不同）
  // 任务名称搜索：typeahead + 多选 chip + OR 查询
  titleChips: [],         // 已选 chip 列表（每项 {task_id, identifier, title, project_name}）
  titleDraft: "",         // 输入框当前草稿（未选中前）
  titleCandidates: [],    // 当前候选列表（typeahead）
  titleIdx: -1,           // 候选下拉键盘高亮下标
  titleDebounceTimer: null,
  titleDebounceMs: 100,
  page: 0,
  pageSize: 50,
  total: null,
  hasMore: false,
  expanded: new Set(),
  commentsCache: {},   // taskId -> comments array
  colWidths: {},       // 用户自定义列宽（按当前渲染顺序的 col index -> px），来自 localStorage
  colOrder: [...DEFAULT_COL_ORDER],            // 当前列展示顺序（proj 始终在 [0]）
  colVisible: Object.fromEntries(COLS_META.map(c => [c.key, true])),  // 每列显隐
  colModes: { ...DEFAULT_COL_MODES },          // 每列宽度模式：fixed=固定可拖 / auto=按内容自适应
  // 视图模式：board=普通看板，overdue=延期任务视图（仅后者显示 截止时间/逾期天数 两列）
  view: "board",
  // 主看板布局快照（进入逾期视图前保存，切回时恢复，互不污染）
  boardColOrder: null,
  boardColVisible: null,
  boardColModes: null,
  overdueForceRefresh: false,   // 逾期视图点「刷新」时置 true，绕过缓存
};

// =================== 列宽拖拽调节 ===================
// 注：COL_WIDTHS_KEY 已在 COLS_META 块顶部声明（line 631），避免重复声明。

function loadColumnWidths(){
  // schema 迁移：v3 之前 colWidths 按下标（render order）存储；改列顺序后下标错位会导致宽度错乱。
  // 新版写入时附带 __schema 字段；读取时若缺字段即视为旧版本，自动清空。
  try {
    const raw = localStorage.getItem(COL_WIDTHS_KEY);
    if (!raw) return;
    const obj = JSON.parse(raw);
    if (obj && typeof obj === "object"){
      if (obj.__schema === COL_WIDTHS_SCHEMA){
        const { __schema, ...rest } = obj;
        state.colWidths = rest;
      } else {
        state.colWidths = {};  // 旧版本：列顺序或默认值已变，丢弃旧宽度让用户用新默认值
      }
    }
  } catch(e){ /* localStorage 可能被禁用，忽略 */ }
  // 迁移：旧版本可能给评论列存了 380px，导致整表溢出容器。
  // 强制重置为默认宽度（250px），让三遍法重新规划列宽预算。
  try {
    const commentsIdx = COLS_META.findIndex(c => c.key === "comments");
    if (commentsIdx >= 0 && state.colWidths[commentsIdx] !== undefined) {
      delete state.colWidths[commentsIdx];
    }
  } catch(e){}
}

function saveColumnWidths(){
  try {
    localStorage.setItem(COL_WIDTHS_KEY, JSON.stringify({ ...state.colWidths, __schema: COL_WIDTHS_SCHEMA }));
  } catch(e){}
}

// =================== 列配置：显示哪些列、按什么顺序 ===================
/** 从 localStorage 恢复列配置；任何字段缺失/非法都回退默认；保证 proj 始终 [0] + 可见。 */
function loadColumnConfig(){
  try {
    const raw = localStorage.getItem(COLUMN_CONFIG_KEY);
    if (!raw) return;
    const obj = JSON.parse(raw);
    if (obj && Array.isArray(obj.order)){
      // 与 DEFAULT_COL_ORDER 求并集、按用户顺序 + 默认补漏，剔除未知 key
      const seen = new Set();
      const merged = [];
      for (const k of obj.order){
        if (typeof k === "string" && COLS_META.some(c => c.key === k) && !seen.has(k)){
          merged.push(k); seen.add(k);
        }
      }
      for (const k of DEFAULT_COL_ORDER){
        if (!seen.has(k)){ merged.push(k); seen.add(k); }
      }
      // 强制 proj 永远在第一位，updated 永远在最后一位
      merged.sort((a, b) => {
        if (a === "proj") return -1;
        if (b === "proj") return 1;
        if (a === "updated") return 1;
        if (b === "updated") return -1;
        return 0;
      });
      state.colOrder = merged;
    }
    if (obj && obj.visible && typeof obj.visible === "object"){
      for (const c of COLS_META){
        if (typeof obj.visible[c.key] === "boolean"){
          state.colVisible[c.key] = obj.visible[c.key];
        }
      }
    }
    // 加载 modes：每列固定/自适应（v2 才有，缺失时回退到默认）
    if (obj && obj.modes && typeof obj.modes === "object"){
      for (const c of COLS_META){
        if (obj.modes[c.key] === "fixed" || obj.modes[c.key] === "auto"){
          state.colModes[c.key] = obj.modes[c.key];
        }
      }
    }
  } catch(e){ /* localStorage 异常时沿用默认 */ }
  // 强制左端点 proj：永远在第一个、永远可见、固定列宽（这是分组合并视觉的硬约束）
  state.colOrder = ["proj", ...state.colOrder.filter(k => k !== "proj")];
  state.colVisible["proj"] = true;
  state.colModes["proj"] = "fixed";
  // 强制右端点 updated：永远在最后一位、永远可见（端点对称设计 —— proj 在最左、updated 在最右，中间列才能拖动改变列宽）
  state.colOrder = [...state.colOrder.filter(k => k !== "updated"), "updated"];
  state.colVisible["updated"] = true;
  // 强制中间 auto 列（code / title / owner）一定是 auto —— 不管 localStorage 历史脏数据写的是什么。
  // 真正的可拖拽列只有 comments（中间固定列），其余中间列永远按内容自适应，不允许手动调宽。
  // 这样可以根治"任务负责人列可拖拽、遮挡文字"这类问题。
  for (const k of ["code", "title", "owner"]) {
    state.colModes[k] = "auto";
  }
  // 强制中间顺序：code → title → owner → comments。owner 必须在 comments 前面（保持产品视角的阅读次序）：
  // 编号 → 名称 → 谁负责 → 评论，逻辑递进。
  {
    const middle = state.colOrder.filter(k => k !== "proj" && k !== "updated");
    const preferred = ["code", "title", "owner", "comments"];
    const seen = new Set();
    const ordered = [];
    for (const k of preferred){
      if (middle.includes(k) && !seen.has(k)){ ordered.push(k); seen.add(k); }
    }
    for (const k of middle){
      if (!seen.has(k)){ ordered.push(k); seen.add(k); }
    }
    state.colOrder = ["proj", ...ordered, "updated"];
  }
  // 截止时间 / 逾期天数 两列仅用于「延期任务」视图，绝不在普通看板出现
  for (const k of ["due", "overdue"]){
    state.colVisible[k] = false;
    state.colOrder = state.colOrder.filter(x => x !== k);
  }
}
function saveColumnConfig(){
  try {
    localStorage.setItem(COLUMN_CONFIG_KEY, JSON.stringify({
      order: state.colOrder,
      visible: state.colVisible,
      modes: state.colModes
    }));
  } catch(e){}
}
/** 弹窗变更后调用：持久化 + 重渲染当前页（不重新拉数据）。 */
function applyColumnConfig(){
  saveColumnConfig();
  // 重新触发渲染：用当前 items 渲染一次（性能可接受，因为评论都在 cache 里）
  if (state.lastItems) renderTable(state.lastItems);
}

// 把 state.colWidths 应用到当前页面所有 .proj-table 的 colgroup 上
//   - widths 索引是"原始下标"（renderTable 中 col 上的 data-col），与列顺序解耦
//   - 只有当 col 上声明了 data-col 时才覆盖，避免影响未受影响的列
function applyColumnWidths(){
  const widths = state.colWidths || {};
  const keys = Object.keys(widths);
  if (!keys.length) return;
  document.querySelectorAll("#tableArea .proj-table").forEach(tbl => {
    const cols = tbl.querySelectorAll("colgroup col");
    cols.forEach((c) => {
      const idx = parseInt(c.dataset.col, 10);
      if (Number.isFinite(idx) && widths[idx] != null){
        c.style.width = widths[idx] + "px";
      }
    });
  });
}

// 全局拖拽：仅绑定一次（页面生命周期内）
let _colDrag = null;

/**
 * 自适应列精确测量 + 跨表统一列宽 —— 让自适应列严格贴紧"最长内容"，
 * 并保证所有项目表用同一套列宽（数据列对列自然对齐）。
 *
 * 为什么之前一直失败（关键坑，已用真实浏览器实测定位）：
 *   table-layout:fixed + table{width:auto} 下，表格的"使用宽度" = max(容器宽, 各列宽之和)。
 *   只要内容总宽 < 容器宽，表格就会撑满容器，多余空间被均摊给 auto 列 ——
 *   于是 "2" / "John" / "08-12 14:43" 这些短 cell 被拉到 134 / 147 / 160px。
 *   即便给 col 单独写死 84px 也没用：表格一撑满容器就会重新分配，覆盖掉 col 宽度。
 *   同时单纯设 width:max-content 在 fixed 布局下也不会生效。
 *
 *   ✅ 唯一可靠解：给表格一个【确定的像素宽度 = 各列宽之和】，让剩余空间 = 0，无空间可分配。
 *
 * 流程（三遍，确保所有表同列同宽）：
 *   1. 第一遍：每张表各自测量每列目标宽（auto 列基于自身 body+header，fixed 列取 colgroup 既定宽），
 *      记录到 tableTargets[i]，此时不写 DOM。
 *   2. 第二遍：对每个 colIdx，在所有表的 targets 里取最大值 → globalMax[colIdx]。
 *      这样宽窄内容混合的多张表，会按"最宽的那张"的列宽对齐，所有列跨表一致。
 *   3. 第三遍：把 globalMax[colIdx] 写到所有表的 col.style.width，并写
 *      tbl.style.width = 各列宽之和（确定像素宽 → 剩余空间 = 0 → 浏览器不再均摊）。
 */
const AUTO_COL_MAX_W = 240;   // 自适应列内容上限：超长内容截断省略号，避免撑爆整表。
  // 从 320 降到 240：实测最常见的「任务名称」最长 ~170px，240 已够，再大只会在窄视窗下挤占右侧端点列的空间。
const AUTO_COL_MIN_W = 60;    // 自适应列最小宽（与 td.cell-id/cell-title 的 CSS min-width 对齐，
                              // 避免"表宽 < 列宽之和"导致浏览器反向压缩列）
const DRAG_COL_MIN_W = 40;    // 拖拽列宽最小值（再小就看不见内容了）
const DRAG_COL_MAX_W = 600;   // 拖拽列宽最大值（防止用户拖出"无限制延伸"的不合理宽）
function measureAndFitAutoColumns(){
  const tables = [...document.querySelectorAll("#tableArea .proj-table")];
  if (!tables.length) return;

  // 第一遍：每张表各自测量每列目标宽（不动 DOM）。返回的每个数组的下标 == 列渲染下标，
  // 跨表 colIdx 一致（同一 state.colOrder/state.colVisible 派生），所以可以直接逐位取 max。
  const tableTargets = tables.map(tbl => {
    const cols = tbl.querySelectorAll("colgroup col");
    if (!cols.length) return null;
    const trs = tbl.querySelectorAll("tbody tr");
    if (!trs.length) return null;

    // 列几何位置（rect.left/right）作为锚点：每个 td 用几何范围匹配自己属于哪一列。
    // 不能用 td.children[colIdx] —— proj 单元格 rowspan=N 让后续行 children 下标整体前移，
    // 会导致 title 长串被误算到 code 列头上。
    const colRects = [...cols].map(c => c.getBoundingClientRect());
    const ths = tbl.querySelectorAll("thead th");

    // 注意 fixed 列取既定宽（renderTable / applyColumnWidths 写入的 style.width），
    // 绝不能读当前 rect —— 那可能是上一次被容器撑开后的宽，会越积越大。
    const targets = [];
    cols.forEach((col, colIdx) => {
      if (col.dataset.mode !== "auto"){
        let fw = parseFloat(col.style.width);
        if (!fw || !isFinite(fw)) fw = col.getBoundingClientRect().width;
        targets[colIdx] = fw;
        return;
      }
      let maxBodyW = 0, maxHeadW = 0;
      const colX = colRects[colIdx].left;
      for (const tr of trs){
        const tds = tr.children;
        let matchedTd = null;
        for (const td of tds){
          if (td.style.display === "none" || td.hidden) continue;
          const r = td.getBoundingClientRect();
          // td 的几何范围落在 col 的范围内，即属于此列
          if (r.left >= colX - 2 && r.right <= colRects[colIdx].right + 2){
            matchedTd = td;
            break;
          }
        }
        if (!matchedTd) continue;
        const range = document.createRange();
        range.selectNodeContents(matchedTd);
        const rect = range.getBoundingClientRect();
        const cs = getComputedStyle(matchedTd);
        const cellW = rect.width + (parseFloat(cs.paddingLeft)||0) + (parseFloat(cs.paddingRight)||0);
        if (cellW > maxBodyW) maxBodyW = cellW;
      }
      // 表头：逐子节点量内容宽再求和（文本节点 + 端点角标 span 等 inline 元素）。
      // 注意：绝不能用 range.selectNodeContents(th) —— 在表格单元格里它会返回整个 th 的
      // 盒宽（= 列宽，如 134px）而非文字宽，导致表头测量虚高、整列被撑宽。
      const th = ths[colIdx];
      if (th){
        const range = document.createRange();
        let headContent = 0;
        th.childNodes.forEach(n => {
          if (n.nodeType === 3){
            if (!n.textContent.trim()) return;
            range.selectNode(n);
            headContent += range.getBoundingClientRect().width;
          } else if (n.nodeType === 1){
            headContent += n.getBoundingClientRect().width;
          }
        });
        const cs = getComputedStyle(th);
        maxHeadW = headContent + (parseFloat(cs.paddingLeft)||0) + (parseFloat(cs.paddingRight)||0);
      }
      let targetW = Math.min(AUTO_COL_MAX_W, Math.ceil(Math.max(maxBodyW, maxHeadW)));
      targetW = Math.max(AUTO_COL_MIN_W, targetW);
      targets[colIdx] = targetW;
    });
    return targets;
  });

  // 第二遍：取每个 colIdx 在所有表里的最大值 → 保证所有表用同一套列宽，
  // 跨表数据"列对列"自然对齐（短内容列也被拉到与最长内容列同宽）。
  const colCount = tableTargets[0]?.length || 0;
  const globalMax = [];
  for (let ci = 0; ci < colCount; ci++){
    let m = 0;
    for (const targets of tableTargets){
      const w = targets?.[ci] || 0;
      if (w > m) m = w;
    }
    globalMax[ci] = m;
  }

  // 第三遍：把 globalMax 写到所有表的 col.style.width，并按其总和确定每张表的表宽。
  // 关键点：累加时直接用 globalMax 数组（已确定值），不读实时 col rect。
  tables.forEach((tbl, ti) => {
    const cols = tbl.querySelectorAll("colgroup col");
    const targets = tableTargets[ti];
    if (!cols.length || !targets) return;
    let total = 0;
    cols.forEach((col, colIdx) => {
      const w = globalMax[colIdx] || targets[colIdx] || 0;
      col.style.width = w + "px";
      total += w;
    });
    tbl.style.width = Math.ceil(total) + "px";
  });
}
function expandEndpointColumns(){
  // 端点列扩展 + 表格总宽夹紧：让"最近更新时间"(endAnchor 右端点)自动吸收容器剩余空间，
  // 使其真正贴在 proj-block 的最右边缘，而不是停在表格内的最后位置。
  //
  // 两层兜底：
  //   1. 正常路径：otherSum + updated(60~800) ≤ containerW → updated 吸收剩余空间（贴边）
  //   2. 兜底路径：otherSum > containerW - 60（user 拖宽中间列 / 窄视窗）→ auto 列按比例压缩，
  //      让总表宽 ≤ containerW，updated 保底 60。fixed 列不参与压缩（保留 user 主动设置）。
  //
  // 视窗变化：通过 window resize listener（debounce 100ms）重新跑本函数，保持表格贴边。
  const updatedIdx = state.colOrder.indexOf("updated");
  if (updatedIdx < 0) return;
  const tables = [...document.querySelectorAll("#tableArea .proj-table")];
  if (!tables.length) return;

  const blocks = document.querySelectorAll("#tableArea .proj-block");
  let containerW = Infinity;
  blocks.forEach(b => { const w = b.clientWidth; if (w && w < containerW) containerW = w; });
  if (!isFinite(containerW) || containerW < 200) return;

  const sample = tables[0];
  const cols = sample.querySelectorAll("colgroup col");
  if (cols.length < 2) return;
  const updatedRenderIdx = cols.length - 1;
  const overhead = 4;

  // 算 otherSum = 除 updated 外所有列的当前 style.width 之和
  let otherSum = 0;
  cols.forEach((c, i) => {
    if (i === updatedRenderIdx) return;
    let w = parseFloat(c.style.width);
    if (!w || !isFinite(w)) w = c.getBoundingClientRect().width || 0;
    otherSum += w;
  });

  let actualUpdated;

  // 统计 fixed/auto 列宽（其他列 = 除 updated 外所有列）
  let fixedSum = 0, autoNatural = 0, autoCount = 0;
  cols.forEach((c, i) => {
    if (i === updatedRenderIdx) return;
    let w = parseFloat(c.style.width);
    if (!w || !isFinite(w)) w = c.getBoundingClientRect().width || 0;
    if (c.dataset.mode === "fixed"){
      fixedSum += w;
    } else {
      autoNatural += w;
      autoCount++;
    }
  });
  const MIN_UPDATED = 90;   // updated 列最小保证宽：能放下 "08-12 14:43" 这种内容（窄视窗兜底）
const MAX_UPDATED = 800;  // updated 列最大宽：极端宽屏下不要把列拉到离谱宽

  if (fixedSum + autoNatural + MIN_UPDATED + overhead <= containerW){
    // 路径 1（默认 / 宽视窗）：空间充足 → updated 吸收容器剩余空间，真正贴到 .proj-block 最右
    // 这是右端点列"靠最右边"的核心行为，必须保留；视窗越宽，updated 越宽。
    actualUpdated = Math.floor(containerW - fixedSum - autoNatural - overhead);
    actualUpdated = Math.max(MIN_UPDATED, Math.min(MAX_UPDATED, actualUpdated));
  } else {
    // 路径 2：auto 列需要压缩才能腾出空间（保证 updated 至少 MIN_UPDATED）
    // fixed 列不参与压缩（保留 user 主动设置，如拖宽 comments）
    const target_other = containerW - MIN_UPDATED - overhead;
    const target_auto = Math.max(autoCount * 60, target_other - fixedSum);
    const scale = autoNatural > 0 ? (target_auto / autoNatural) : 1;
    tables.forEach(tbl => {
      tbl.querySelectorAll("colgroup col").forEach((c, i) => {
        if (i === updatedRenderIdx) return;
        if (c.dataset.mode === "auto"){
          let w = parseFloat(c.style.width);
          if (!w || !isFinite(w)) w = c.getBoundingClientRect().width || 0;
          c.style.width = Math.max(60, Math.floor(w * scale)) + "px";
        }
      });
    });
    actualUpdated = MIN_UPDATED;
  }

  // 同步写 updated 列到所有表 + 重算 tbl.style.width
  tables.forEach(tbl => {
    const u = tbl.querySelectorAll("colgroup col")[updatedRenderIdx];
    if (u) u.style.width = actualUpdated + "px";
    let total = 0;
    tbl.querySelectorAll("colgroup col").forEach(c => {
      let w = parseFloat(c.style.width);
      if (!w || !isFinite(w)) w = c.getBoundingClientRect().width || 0;
      total += w;
    });
    tbl.style.width = Math.ceil(total) + "px";
  });
}
// 视窗变化时重跑扩展（debounce 100ms 防连续 reflow）
(function(){
  let timer = null;
  window.addEventListener("resize", () => {
    if (timer) clearTimeout(timer);
    timer = setTimeout(() => {
      timer = null;
      if (typeof expandEndpointColumns === "function") expandEndpointColumns();
    }, 100);
  });
})();
function bindColumnResize(){
  // 用事件委托：任何 col-resizer 的 mousedown 都接管（绑在 document 上，避免依赖元素是否存在）
  document.addEventListener("mousedown", e => {
    const hand = e.target.closest && e.target.closest(".col-resizer");
    if (!hand) return;
    e.preventDefault();
    const L_idx = parseInt(hand.dataset.col, 10);   // resizer 所属列 = 左侧列
    if (!Number.isFinite(L_idx)) return;
    const table = hand.closest("table");
    if (!table) return;

    // 在当前表里按 DOM 顺序找 L、R 两列的 <col> 节点
    const allCols = [...table.querySelectorAll("colgroup col")];
    const L_colNode = allCols.find(c => parseInt(c.dataset.col, 10) === L_idx);
    if (!L_colNode) return;
    const L_renderIdx = allCols.indexOf(L_colNode);
    const R_colNode = allCols[L_renderIdx + 1] || null;
    const R_idx = R_colNode ? parseInt(R_colNode.dataset.col, 10) : null;
    // R 是不是 auto 列？auto 不写 state.colWidths，但本次拖动期间需要临时调整 col.style.width。
    const R_isAuto = R_colNode ? (R_colNode.dataset.mode === "auto") : false;

    // 取"最窄 .proj-block 容器宽"作为总宽上限（跨表一致约束）
    const projBlock = table.parentElement;
    const allBlocks = document.querySelectorAll("#tableArea .proj-block");
    let minBlockW = Infinity;
    allBlocks.forEach(b => { if (b.clientWidth && b.clientWidth < minBlockW) minBlockW = b.clientWidth; });
    if (!isFinite(minBlockW)) minBlockW = projBlock.clientWidth || 1200;

    // L、R 之外的其他列宽之和
    let otherSum = 0;
    allCols.forEach(c => {
      const ci = parseInt(c.dataset.col, 10);
      if (ci === L_idx || ci === R_idx) return;
      let w = parseFloat(c.style.width);
      if (!w || !isFinite(w)) w = c.getBoundingClientRect().width || 0;
      otherSum += w;
    });

    // 起宽：先读 col.style.width（已被 measureAndFitAutoColumns / mouseup save 写入），
    // 兜底读 getBoundingClientRect —— 后者在拖动过程中会被列和表格 layout 重算，
    // 这里只在 mousedown 抓取，所以是稳定的"起宽"。
    const startWL = (() => {
      let w = parseFloat(L_colNode.style.width);
      if (!w || !isFinite(w)) w = L_colNode.getBoundingClientRect().width || 0;
      return Math.round(w);
    })();
    let startWR = 0;
    if (R_colNode) {
      let w = parseFloat(R_colNode.style.width);
      if (!w || !isFinite(w)) w = R_colNode.getBoundingClientRect().width || 0;
      startWR = Math.round(w);
    }

    _colDrag = {
      L_idx, R_idx, R_isAuto, R_colNode,
      hand, table,
      startX: e.clientX,
      startWL, startWR,
      otherSum,
      maxWL: DRAG_COL_MAX_W,
      maxWR: DRAG_COL_MAX_W,
      minBlockW,
      lastW: { L: startWL, R: startWR }
    };
    hand.classList.add("dragging");
    document.body.classList.add("col-resizing");
  });

  document.addEventListener("mousemove", e => {
    if (!_colDrag) return;
    const dx = e.clientX - _colDrag.startX;
    const { L_idx, R_idx, R_isAuto, R_colNode, startWL, startWR, otherSum, maxWL, maxWR, minBlockW } = _colDrag;

    // 双列联动核心：L 加 dx、R 减 dx（总列宽不变 = startWL + startWR 不变）。
    let newWL = Math.round(startWL + dx);
    let newWR = Math.round(startWR - dx);

    // 1) 单列夹紧
    newWL = Math.max(DRAG_COL_MIN_W, Math.min(maxWL, newWL));
    if (R_colNode) newWR = Math.max(DRAG_COL_MIN_W, Math.min(maxWR, newWR));
    else newWR = 0;

    // 2) 容器上限：L+R 不得超出 minBlockW - otherSum
    const totalAllow = Math.max(
      DRAG_COL_MIN_W * (R_colNode ? 2 : 1),
      Math.floor(minBlockW - otherSum)
    );
    if (newWL + newWR > totalAllow){
      const over = newWL + newWR - totalAllow;
      // 优先让 R 列承担压缩（保留 L 的调整意愿）
      if (R_colNode){
        const shrink = Math.min(newWR - DRAG_COL_MIN_W, over);
        newWR -= shrink;
        const rest = over - shrink;
        if (rest > 0){
          newWL = Math.max(DRAG_COL_MIN_W, newWL - rest);
        }
      } else {
        newWL = Math.max(DRAG_COL_MIN_W, newWL - over);
      }
    }

    // 3) 与上次相同 → 跳过
    if (newWL === _colDrag.lastW.L && newWR === _colDrag.lastW.R) return;
    _colDrag.lastW = { L: newWL, R: newWR };

    // 4) 写 state（auto 列不持久化）
    state.colWidths[L_idx] = newWL;
    if (R_colNode && !R_isAuto){
      state.colWidths[R_idx] = newWR;
    }

    // 5) 同步所有表的对应 col.style.width
    document.querySelectorAll('#tableArea .proj-table colgroup col[data-col="' + L_idx + '"]')
      .forEach(c => { c.style.width = newWL + "px"; });
    if (R_colNode){
      document.querySelectorAll('#tableArea .proj-table colgroup col[data-col="' + R_idx + '"]')
        .forEach(c => { c.style.width = newWR + "px"; });
    }

    // 6) 重算 tbl.style.width = 各列宽之和（确定像素宽）
    document.querySelectorAll("#tableArea .proj-table").forEach(tbl => {
      let total = 0;
      tbl.querySelectorAll("colgroup col").forEach(c => {
        let w = parseFloat(c.style.width);
        if (!w || !isFinite(w)) w = c.getBoundingClientRect().width || 0;
        total += w;
      });
      tbl.style.width = Math.ceil(total) + "px";
    });
  });

  document.addEventListener("mouseup", () => {
    if (!_colDrag) return;
    _colDrag.hand.classList.remove("dragging");
    document.body.classList.remove("col-resizing");
    saveColumnWidths();
    // 拖完后：auto 列（比如 owner 任务负责人）可能被双列联动临时拉窄/拉宽，
    // 这里强制重跑 measureAndFitAutoColumns + expandEndpointColumns，
    // 让所有 auto 列回到"按内容自适应"的自然宽度，文字不再被遮挡。
    try { measureAndFitAutoColumns(); expandEndpointColumns(); } catch(e) { console.warn("[post-drag autofit]", e); }
    _colDrag = null;
  });
}

function show(el){ document.getElementById(el).classList.remove("hidden"); }
function hide(el){ document.getElementById(el).classList.add("hidden"); }

async function api(path, opts){
  const resp = await fetch(path, Object.assign({credentials:"same-origin"}, opts));
  let data = null;
  try { data = await resp.json(); } catch(e){}
  if (resp.status === 401){
    // 会话失效，回到登录页
    hide("boardView"); show("loginView");
    throw new Error("会话已失效，请重新登录");
  }
  if (!resp.ok || (data && data.ok === false)){
    throw new Error((data && data.error) || ("请求失败：" + resp.status));
  }
  return data;
}

async function doLogin(){
  const btn = document.getElementById("loginBtn");
  const alert = document.getElementById("loginAlert");
  alert.classList.add("hidden");
  const clientId = document.getElementById("clientId").value.trim();
  const clientSecret = document.getElementById("clientSecret").value.trim();
  if (!clientId || !clientSecret){
    alert.textContent = "Client ID 和 Client Secret 均不能为空";
    alert.classList.remove("hidden");
    return;
  }
  btn.disabled = true; btn.textContent = "验证中…";
  try {
    const r = await api("/api/login", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({
        client_id: clientId,
        client_secret: clientSecret,
        tenant: document.getElementById("tenantInput").value.trim()
      })
    });
    if (r.tenant_host) state.tenantHost = r.tenant_host;
    if (r.client_id_masked) state.clientIdMasked = r.client_id_masked;
    if (r.tenant_fingerprint) state.tenantFingerprint = r.tenant_fingerprint;
    renderTenantBadge();
    hide("loginView"); show("boardView");
    await loadProjects();
  } catch(e){
    alert.textContent = e.message;
    alert.classList.remove("hidden");
  } finally {
    btn.disabled = false; btn.textContent = "进入看板";
  }
}

async function doLogout(){
  try { await api("/api/logout", {method:"POST"}); } catch(e){}
  state.expanded.clear(); state.commentsCache = {};
  state.clientIdMasked = ""; state.tenantFingerprint = "";
  renderTenantBadge();
  hide("boardView"); show("loginView");
  document.getElementById("clientSecret").value = "";
}

/** 顶栏租户徽标：展示当前租户打码 client_id 与指纹，让用户直观确认
 *  自己处于隔离的租户空间（与其他租户数据互不可见）。 */
function renderTenantBadge(){
  const el = document.getElementById("tenantBadge");
  if (!el) return;
  if (state.clientIdMasked){
    const fp = state.tenantFingerprint ? ` · #${state.tenantFingerprint}` : "";
    el.textContent = `${state.clientIdMasked}${fp}`;
    el.classList.add("active");
  } else {
    el.textContent = "未登录";
    el.classList.remove("active");
  }
}

async function loadProjects(){
  const data = await api("/api/projects");
  state.projects = data.projects || [];  renderProjectMenu("");
  if (data.projects && data.projects.length){
    selectProject("__all__", "全部项目");
    // 项目列表拉取成功后，并行拉负责人列表（独立接口，失败不影响主流程）
    loadMembers().catch(e => console.warn("loadMembers 失败：", e && e.message));
  } else if (data.error){
    document.getElementById("tableArea").innerHTML =
      '<div class="loading error">加载项目失败：' + escapeHtml(data.error) +
      '<div class="error-hint">请检查网络代理是否能访问 Worktile 服务器（沙箱出网代理可能会拦截）。</div></div>';
  } else {
    document.getElementById("tableArea").innerHTML =
      '<div class="empty">该租户下没有可用的项目</div>';

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Worktile 任务评论区看板</title>
<style>
  :root {
    --bg: #f5f7fa;
    --panel: #ffffff;
    --text: #1f2937;
    --muted: #6b7280;
    --border: #e5e7eb;
    --accent: #2563eb;
    --accent-soft: #eff6ff;
    --danger: #dc2626;
    --tag-img-bg: #fef3c7;
    --tag-img-fg: #92400e;
    --tag-file-bg: #e0e7ff;
    --tag-file-fg: #3730a3;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    line-height: 1.5;
  }
  .wrap { width: auto; max-width: calc(100vw - 32px); margin: 0 auto; padding: 24px;
    overflow-x: auto; }   /* 取消固定 width：表格按内容自然撑开后，wrap 跟着表格走，
                              但不超过视窗（-32px 留滚动条空位）；视窗 < 表格总宽时 wrap 自身横滚 */

  /* ---------- 登录页 ---------- */
  .login-card {
    max-width: 420px; margin: 12vh auto; background: var(--panel);
    border: 1px solid var(--border); border-radius: 12px; padding: 32px;
    box-shadow: 0 4px 20px rgba(0,0,0,.06);
  }
  .login-card h1 { font-size: 20px; margin: 0 0 6px; }
  .login-card p.sub { color: var(--muted); margin: 0 0 24px; }
  label.field { display: block; margin-bottom: 16px; }
  label.field span { display: block; margin-bottom: 6px; font-weight: 600; }
  input[type=text], input[type=password], select {
    width: 100%; padding: 10px 12px; border: 1px solid var(--border);
    border-radius: 8px; font-size: 14px; background: #fff; color: var(--text);
  }
  input:focus, select:focus { outline: none; border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft); }
  button {
    cursor: pointer; border: none; border-radius: 8px; font-size: 14px;
    padding: 10px 16px; background: var(--accent); color: #fff; font-weight: 600;
  }
  button:hover { filter: brightness(1.05); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .btn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); }
  .alert { background: #fef2f2; color: var(--danger); border: 1px solid #fecaca;
    border-radius: 8px; padding: 10px 12px; margin-bottom: 16px; font-size: 13px; }

  /* ---------- 看板 ---------- */
  .topbar { display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    margin-bottom: 16px; }
  .topbar h2 { font-size: 18px; margin: 0; flex: 1; }
  .tenant-badge {
    font-size: 13px; padding: 5px 12px; border-radius: 999px;
    background: var(--panel, #f1f3f5); color: var(--muted, #888);
    border: 1px solid var(--border, #e3e6ea); white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }
  .tenant-badge.active {
    background: #e7f0ff; color: #1a66d6; border-color: #bcd6ff;
  }
  .toolbar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    margin-bottom: 16px; }
  .toolbar .group { display: flex; align-items: center; gap: 6px; }
  .toolbar select { width: auto; padding: 8px 10px; }

  /* 搜索式项目选择器 */
  .search-select { position: relative; display: inline-block; min-width: 220px; }
  .search-select input {
    width: 100%; padding: 8px 28px 8px 10px; border: 1px solid var(--border);
    border-radius: 8px; font-size: 14px; background: #fff; color: var(--text);
    cursor: pointer;
  }
  .search-select input:focus { outline: none; border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft); }
  .search-select .caret {
    position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
    pointer-events: none; color: var(--muted); font-size: 12px;
  }
  /* 通用搜索式下拉（项目选择器 / 任务名候选） */
  .search-select-menu {
    position: fixed; min-width: 260px; max-height: 320px;
    overflow-y: auto; background: var(--panel); border: 1px solid var(--border);
    border-radius: 10px; box-shadow: 0 10px 30px rgba(15,23,42,.18);
    z-index: 2000;
  }
  .search-select-menu .menu-title {
    padding: 8px 12px; font-size: 12px; color: var(--muted);
    background: #f8fafc; border-bottom: 1px solid var(--border);
    border-radius: 10px 10px 0 0; display: flex; align-items: center; gap: 6px;
  }
  .search-select-menu .menu-title .dot {
    width: 7px; height: 7px; background: var(--accent); border-radius: 50%;
    display: inline-block;
  }
  .search-select-menu .opt {
    padding: 8px 12px; cursor: pointer; font-size: 14px; color: var(--text);
    border-bottom: 1px solid #f3f4f6;
  }
  .search-select-menu .opt:last-child { border-bottom: none; }
  .search-select-menu .opt:hover,
  .search-select-menu .opt.highlighted { background: var(--accent-soft); }
  .search-select-menu .opt.selected { font-weight: 600; color: var(--accent); }
  .search-select-menu .opt .hl {
    background: #fff3a0; color: #333; border-radius: 2px; padding: 0 1px;
  }
  .search-select-menu .opt-meta { font-size: 12px; color: var(--muted); margin-left: 6px; }
  .search-select-menu .opt-empty {
    padding: 14px; color: var(--muted); text-align: center; font-size: 13px;
  }
  .search-select-menu .menu-hint {
    padding: 6px 12px; font-size: 11.5px; color: var(--muted);
    background: #fafbfc; border-top: 1px solid var(--border);
    border-radius: 0 0 10px 10px; text-align: center;
  }

  /* 任务名称模糊搜索框 */
  .chip-search {
    position: relative; display: inline-flex; flex-wrap: wrap; align-items: center;
    gap: 6px; min-width: 320px; max-width: 580px;
    padding: 6px 8px; border: 1px solid var(--border); border-radius: 8px;
    background: #fff; color: var(--text);
  }
  .chip-search:focus-within { border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft); }
  .chip-area { display: contents; }   /* 让 chip 直接参与父容器 flex 排列 */
  .chip {
    display: inline-flex; align-items: center; gap: 4px; max-width: 220px;
    padding: 3px 4px 3px 8px; background: var(--accent-soft);
    border: 1px solid #bfdbfe; border-radius: 14px;
    font-size: 12.5px; color: #1e40af; line-height: 1.3;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .chip .chip-meta {
    color: #64748b; margin-right: 2px; max-width: 80px;
    overflow: hidden; text-overflow: ellipsis;
  }
  .chip .chip-close {
    border: none; background: transparent; color: #475569;
    width: 18px; height: 18px; line-height: 16px; text-align: center;
    border-radius: 50%; padding: 0; font-size: 14px; cursor: pointer;
  }
  .chip .chip-close:hover { background: rgba(0,0,0,.08); }
  .chip-search .search-input { position: relative; display: inline-flex; align-items: center; flex: 1; min-width: 160px; }
  .chip-search .search-input input {
    flex: 1; min-width: 140px; padding: 4px 26px 4px 6px;
    border: none; outline: none; background: transparent;
    font-size: 14px; color: var(--text);
  }
  .chip-search .search-clear {
    position: absolute; right: 4px; top: 50%; transform: translateY(-50%);
    width: 18px; height: 18px; line-height: 16px; text-align: center;
    border: none; background: #e5e7eb; color: #475569; border-radius: 50%;
    font-size: 14px; padding: 0; cursor: pointer; display: none;
  }
  .chip-search .search-clear:hover { background: #d1d5db; }
  .chip-search.has-value .search-clear { display: block; }
  .chip-search .search-go {
    padding: 5px 12px; font-size: 13px; line-height: 1;
  }
  .chip-hint {
    flex-basis: 100%; padding: 0 2px; font-size: 11.5px; color: var(--muted);
    line-height: 1.5;
  }
  .chip-hint kbd {
    display: inline-block; padding: 1px 5px; border-radius: 3px;
    border: 1px solid #e2e8f0; background: #f1f5f9; font-size: 10.5px;
    color: #475569;
  }

  /* 任务名称命中关键词高亮 */
  td.cell-title .hl {
    background: #fff3a0; color: #333; border-radius: 2px; padding: 0 1px;
  }
  .search-banner {
    margin-bottom: 12px; padding: 9px 14px;
    background: var(--accent-soft); border: 1px solid #bfdbfe;
    border-radius: 8px; font-size: 13px; color: #1e40af;
  }
  .search-banner b { color: #1d4ed8; }

  table { width: 100%; border-collapse: collapse; background: var(--panel);
    border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  /* 项目卡片内的表格：宽度按内容贴合，短列贴短内容、长列贴长内容。
     - 自适应 (auto) 列：renderTable 后 measureAndFitAutoColumns() 量该列所有 cell 的
       "内容宽 + padding"（取表头与 body 的较大者），写入 col.style.width 让列宽贴住内容。
     - 固定 (fixed) 列：col 显式 style.width（用户可拖拽改），不参与测量。
     - 关键：measureAndFitAutoColumns() 还会把整张表定宽到"各列宽之和"（确定像素宽），
       让剩余空间 = 0，浏览器不再把容器剩余宽度均摊给 auto 列（否则短 cell 被拉宽）。
     - 列总宽 ≤ 容器时表格居左、右侧留白；列总宽 > 容器时 .proj-block 已设 overflow-x:auto 横滚。
     - 跨多张项目表时，measureAndFitAutoColumns() 还会取每个 colIdx 在所有表里的"最大值"
       作为该列的统一宽 —— 保证所有项目表的同一列宽度一致，跨表数据"列对列"自然对齐。
     - table-layout:fixed（而非 auto）：auto 模式下浏览器会把"容器-内容"的剩余空间分配
       给各列（实测 code/owner/updated 被拉到 134/147/160px），fixed + 确定表宽可根治。 */
  table.proj-table { width: auto; table-layout: fixed; }
  table.proj-table th, table.proj-table td {
    overflow-wrap: anywhere; word-break: break-word;
  }
  /* 自适应列：渲染后 JS 会精确测量每列最长内容 + padding 写入 col.style.width。
     td 上 white-space:nowrap + overflow:hidden + ellipsis 是兜底 —— 极长内容超
     测量阈值时截断省略号，不会撑爆列宽。 */
  table.proj-table col[data-mode="auto"],
  table.proj-table th[data-mode="auto"],
  table.proj-table td[data-mode="auto"] {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  /* 任务编号/任务名称：通常是短字段，给个最小可见宽度 */
  table.proj-table td.cell-id,
  table.proj-table td.cell-title { min-width: 60px; }
  /* 最后两列（任务负责人、最近更新时间）：时间戳/名字无空格，被 break-word 拆字符后会溢出；
     改为不拆字符 + 截断省略号，列宽小时显示 ... 而不是内容跑到外面。 */
  table.proj-table td:nth-last-child(-n+2),
  table.proj-table th:nth-last-child(-n+2) {
    overflow-wrap: normal; word-break: normal;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  /* 评论列：内容可能很长（多评论+图片），设最大宽度避免撑爆 */
  table.proj-table td.cell-comments { max-width: 600px; }
  /* 表头：作为 resizer 绝对定位的参考系 */
  table.proj-table thead th { position: relative; }
  /* 列宽调节手柄：悬停在 th 右侧边缘 */
  table.proj-table .col-resizer {
    position: absolute; top: 0; right: -3px;
    width: 8px; height: 100%; cursor: col-resize;
    z-index: 3; user-select: none;
  }
  table.proj-table .col-resizer::after {
    content: ""; position: absolute; top: 25%; bottom: 25%; left: 3px;
    width: 2px; background: transparent; border-radius: 2px;
    transition: background 0.15s;
  }
  table.proj-table .col-resizer:hover::after,
  table.proj-table .col-resizer.dragging::after { background: var(--accent); }
  /* 自适应列标签：表头右侧小角标，让用户知道这列是按内容自适应（不可拖拽） */
  table.proj-table .mode-tag {
    display: inline-block; margin-left: 6px; padding: 1px 6px;
    font-size: 11px; line-height: 1.4; color: var(--muted);
    background: #f3f4f6; border-radius: 4px; vertical-align: middle;
  }
  /* 拖拽列宽时全局禁用文字选择、强制手型光标 */
  body.col-resizing, body.col-resizing * {
    cursor: col-resize !important; user-select: none !important;
  }
  th, td { text-align: left; padding: 12px 14px; border-bottom: 1px solid var(--border);
    vertical-align: top; }
  th { background: #f9fafb; font-weight: 600; color: var(--muted); font-size: 13px; }
  tbody tr.task-row:hover { background: var(--accent-soft); }
  /* 项目名称合并单元格（Excel 跨行合并风格） */
  /* 每个项目一个独立 <table>，外加 .proj-block 分组卡片 */
  .proj-block {
    margin-bottom: 16px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow-x: auto;     /* 表格列宽总和 > 容器宽时允许水平滚动（不裁掉最后几列） */
    overflow-y: hidden;
  }
  .proj-block:last-child { margin-bottom: 0; }
  .proj-block table { border: none; border-radius: 0; }   /* 让卡片自带的边框生效 */
  td.proj-cell {
    background: #eef4ff;            /* 浅蓝底，明显区别于白底任务行 */
    vertical-align: top;             /* 顶对齐：长项目名时保持从顶端开始阅读 */
    font-weight: 700; font-size: 15px;
    color: #1e3a8a;
    line-height: 1.4;
    /* 四周都有边框，让合并区域边界清晰 */
    border-top: 2px solid #93c5fd;
    border-bottom: 2px solid #93c5fd;
    border-left: 2px solid #93c5fd;
    border-right: 2px solid #2563eb;  /* 右侧加重，做"分栏线" */
    padding: 12px 14px;
    /* 注意：不要对 td 用 position: sticky，Chrome/Safari 对 td 的 sticky
       支持不完善，会让同一列的合并单元格错位呈现"嵌套"假象 */
  }
  td.proj-cell .proj-name {
    /* 中文按词换行（word-break: keep-all），英文才拆字符。
       默认 break-all 会让「熟悉项目应用」被强拆成「熟/悉/项/目/应/用」。 */
    overflow-wrap: anywhere;
    word-break: keep-all;
    display: block;
  }
  td.proj-cell .proj-count {
    display: block; margin-top: 6px;       /* 任务数独占一行，更像 Excel 标签 */
    font-weight: 500; font-size: 12px;
    color: #475569;
  }
  /* 任务名称：可点击跳转 Worktile 任务详情页（新标签页） */
  td.cell-title a {
    color: var(--accent); text-decoration: none; font-weight: 600;
  }
  td.cell-title a:hover { text-decoration: underline; }
  .muted { color: var(--muted); }

  /* 任务行内的评论列：紧凑堆叠多条评论 */
  td.cell-comments { vertical-align: top; overflow-wrap: anywhere; }
  td.cell-comments .comments-inner { padding: 0; }
  .comment-block {
    border-left: 3px solid var(--accent-soft);
    padding: 6px 10px;
    margin-bottom: 8px;
    background: #fbfcfe;
    border-radius: 0 6px 6px 0;
  }
  .comment-block:last-child { margin-bottom: 0; }
  .comment-block .meta {
    font-size: 12px; color: var(--muted); margin-bottom: 3px;
  }
  .comment-block .meta b { color: var(--text); margin-right: 4px; }
  .comment-block .body.emoji-only {
    font-size: 28px; line-height: 1.2;
    padding: 4px 0 2px;
  }
  .comment-block .body {
    font-size: 13px; line-height: 1.5;
    word-break: break-word;
  }
  /* 评论正文段落换行 */
  .comment-block .body p { margin: 0 0 6px; line-height: 1.55; word-break: break-word; }
  .comment-block .body p:last-child { margin-bottom: 0; }
  /* 行内 code（含 markdown `code`） */
  .comment-block .body code:not(pre code) {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    background: #f1f5f9; color: #0f172a;
    padding: 1px 5px; border-radius: 3px;
    border: 1px solid #e2e8f0;
    font-size: 12.5px; word-break: break-all;
  }
  /* 代码块（``` ``` 包裹 / 启发式 shell 段） */
  .comment-block .body pre.code-block {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    background: #0f172a; color: #e2e8f0;
    padding: 10px 12px; border-radius: 6px;
    margin: 6px 0; overflow-x: auto;
    font-size: 12.5px; line-height: 1.55;
    white-space: pre; word-break: normal;
    border: 1px solid #1e293b;
  }
  .comment-block .body pre.code-block .lang {
    display: block;
    color: #64748b; font-size: 11px;
    margin-bottom: 6px; letter-spacing: .05em;
    text-transform: uppercase; user-select: none;
  }
  .comment-block .atts {
    margin-top: 6px;
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  /* 图片附件：垂直卡片（缩略图上 + 文件名下），长文件名自动换行 */
  .comment-block .att.img-type {
    display: inline-flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 4px;
    padding: 4px;
    max-width: 200px;
    background: #ecfeff;
    color: #155e75;
    border: 1px solid #a5f3fc;
    border-radius: 4px;
    font-size: 12px;
  }
  /* 文件附件：链接，长文件名自动换行 */
  .comment-block .att.file-type {
    display: inline-flex;
    align-items: flex-start;
    padding: 4px 8px;
    max-width: 240px;
    background: #f1f5f9;
    color: #334155;
    border: 1px solid #cbd5e1;
    border-radius: 4px;
    font-size: 12px;
    text-decoration: none;
    word-break: break-all;
  }
  .comment-block .att.file-type:hover { background: #e2e8f0; }
  /* 文件名：自动换行 */
  .comment-block .att .fname {
    font-weight: 500;
    display: block;
    width: 100%;
    word-break: break-all;
    line-height: 1.4;
  }
  /* 图片缩略图：可点击放大，宽度在父容器内自适应 */
  .att-thumb {
    display: block;
    max-width: 100%;
    max-height: 92px;
    width: auto; height: auto;
    border-radius: 4px;
    border: 1px solid #cbd5e1;
    object-fit: cover;
    cursor: zoom-in;
  }
  /* 图片放大遮罩层 */
  #lightbox {
    position: fixed; inset: 0; z-index: 9999;
    display: none;
    align-items: center; justify-content: center;
    background: rgba(15, 23, 42, 0.82);
    cursor: zoom-out;
  }
  #lightbox.active { display: flex; }
  #lightbox img {
    max-width: 92vw; max-height: 92vh;
    object-fit: contain;
    border-radius: 6px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.5);
  }
  .cell-loading, .cell-empty, .cell-error {
    font-size: 12px; color: var(--muted); padding: 6px 0;
  }
  .cell-error { color: #b91c1c; }
  .comment .empty { color: var(--muted); font-style: italic; }
  .loading { padding: 24px; text-align: center; color: var(--muted); }
  .loading.error { color: var(--danger); background: #fef2f2; border-radius: 6px; border: 1px solid #fecaca; }
  .error-hint { margin-top: 8px; font-size: 12px; color: var(--muted); }

  /* 分页 */
  .pager {
    display: flex; align-items: center; justify-content: center;
    gap: 12px; flex-wrap: wrap; margin-top: 18px; margin-bottom: 8px;
  }
  .pager .info { color: var(--muted); font-size: 13px; }
  .pager .pager-btn {
    padding: 6px 14px; border: 1px solid var(--border);
    background: #fff; color: var(--text); border-radius: 6px;
    font-size: 13.5px; cursor: pointer;
    transition: border-color .15s, background .15s, color .15s;
  }
  .pager .pager-btn:hover:not(:disabled) {
    border-color: var(--accent); color: var(--accent);
    background: var(--accent-soft);
  }
  .pager .pager-btn:disabled {
    opacity: .45; cursor: not-allowed; background: #f8fafc;
  }
  .pager .page-jump {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 13px; color: var(--muted);
  }
  .pager .page-input {
    width: 56px; padding: 6px 8px; text-align: center;
    border: 1px solid var(--border); border-radius: 6px; font-size: 13px;
    background: #fff; color: var(--text);
    transition: border-color .15s, box-shadow .15s;
  }
  .pager .page-input:focus {
    outline: none; border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }
  .pager .page-input:disabled {
    background: #f1f5f9; color: #94a3b8; cursor: not-allowed;
  }
  .pager .page-go {
    padding: 6px 12px; border: 1px solid var(--border);
    background: #fff; color: var(--accent); border-radius: 6px;
    font-size: 13px; cursor: pointer; transition: all .15s;
  }
  .pager .page-go:hover {
    background: var(--accent-soft); border-color: var(--accent);
  }
  .hidden { display: none; }

  /* ============== 列设置弹窗 ============== */
  /* 用 :not(.hidden) 而非默认 flex：保证 .hidden { display:none } 真的能隐藏弹窗。
     否则 .col-modal-mask 与 .hidden 同优先级，后定义的 flex 会覆盖 none。 */
  .col-modal-mask:not(.hidden) {
    position: fixed; inset: 0; z-index: 5000;
    background: rgba(15, 23, 42, 0.42);
    display: flex; align-items: center; justify-content: center;
  }
  .col-modal-mask.hidden { display: none; }
  .col-modal {
    width: 460px; max-width: calc(100vw - 32px);
    background: var(--panel); border-radius: 12px;
    box-shadow: 0 20px 60px rgba(0,0,0,.25);
    overflow: hidden; animation: colModalIn 0.18s ease-out;
  }
  @keyframes colModalIn { from { transform: translateY(-8px); opacity: 0 } to { transform: none; opacity: 1 } }
  .col-modal header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 20px; border-bottom: 1px solid var(--border);
    background: #f8fafc;
  }
  .col-modal header h3 { margin: 0; font-size: 16px; }
  .col-modal header .x {
    border: none; background: transparent; color: var(--muted);
    font-size: 20px; line-height: 1; padding: 4px 8px; border-radius: 6px;
    cursor: pointer;
  }
  .col-modal header .x:hover { background: #eef2f7; color: var(--text); }
  .col-modal .modal-body { padding: 14px 20px 8px; }
  .col-modal .modal-hint {
    font-size: 12.5px; color: var(--muted); margin: 0 0 12px; line-height: 1.6;
  }
  .col-modal .cols-list { list-style: none; padding: 0; margin: 0; }
  .col-modal .col-row {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 12px; margin-bottom: 6px;
    border: 1px solid var(--border); border-radius: 8px;
    background: #fff; transition: border-color .12s, background .12s, box-shadow .12s;
    user-select: none;
  }
  .col-modal .col-row:hover { border-color: #c7d2fe; }
  .col-modal .col-row.dragging {
    opacity: 0.5; border-style: dashed;
  }
  .col-modal .col-row.drag-over-top { box-shadow: 0 -2px 0 0 var(--accent) inset; }
  .col-modal .col-row.drag-over-bot { box-shadow: 0 2px 0 0 var(--accent) inset; }
  .col-modal .col-row.is-hidden { background: #f8fafc; color: var(--muted); }
  .col-modal .col-row .drag-handle {
    color: #94a3b8; font-size: 14px; line-height: 1;
    cursor: grab; padding: 0 2px; letter-spacing: -2px;
  }
  .col-modal .col-row.anchor .drag-handle {
    cursor: not-allowed; color: #cbd5e1;
  }
  .col-modal .col-row .drag-handle:active { cursor: grabbing; }
  .col-modal .col-row input[type=checkbox] {
    width: 16px; height: 16px; cursor: pointer;
    accent-color: var(--accent);
  }
  .col-modal .col-row input[type=checkbox]:disabled { cursor: not-allowed; opacity: .6; }
  .col-modal .col-row .col-label {
    flex: 1; font-size: 14px; font-weight: 500;
  }
  .col-modal .col-row .col-tag {
    font-size: 11.5px; padding: 2px 8px; border-radius: 999px;
    background: #fef3c7; color: #92400e; border: 1px solid #fde68a;
  }
  /* 模式切换器：右端，segmented control 风格 */
  .col-modal .col-row .mode-switch {
    display: flex; border: 1px solid var(--border); border-radius: 6px;
    overflow: hidden; background: #fff; flex-shrink: 0;
  }
  .col-modal .col-row .mode-switch .mode-opt {
    display: flex; align-items: center; gap: 4px;
    padding: 4px 10px; font-size: 12px; color: var(--muted);
    cursor: pointer; user-select: none;
    border-right: 1px solid var(--border);
    transition: background .12s, color .12s;
  }
  .col-modal .col-row .mode-switch .mode-opt:last-child { border-right: none; }
  .col-modal .col-row .mode-switch .mode-opt:hover { background: #f8fafc; }
  .col-modal .col-row .mode-switch .mode-opt.active {
    background: var(--accent-soft); color: var(--accent); font-weight: 500;
  }
  .col-modal .col-row .mode-switch .mode-opt.disabled {
    cursor: not-allowed; opacity: .5; background: #f3f4f6;
  }
  .col-modal .col-row .mode-switch .mode-opt input[type=radio] {
    display: none; /* 自定义 segmented 外观，隐藏原生 radio */
  }
  .col-modal .col-row.anchor { background: #fffbeb; border-color: #fde68a; }
  .col-modal footer {
    display: flex; justify-content: space-between; gap: 12px;
    padding: 14px 20px; border-top: 1px solid var(--border);
    background: #f8fafc;
  }
  .col-modal footer .left { display: flex; gap: 8px; }
  .col-modal footer .right { display: flex; gap: 8px; }
  .col-modal .btn-text {
    background: transparent; color: var(--muted);
    border: 1px solid var(--border); padding: 7px 14px;
    font-size: 13px;
  }
  .col-modal .btn-text:hover { background: #f1f5f9; color: var(--text); }
  /* 列设置触发按钮（toolbar 内） */
  .col-settings-btn {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 7px 12px !important; font-size: 13.5px !important;
    background: #fff !important; color: var(--text) !important;
    border: 1px solid var(--border) !important; font-weight: 500 !important;
  }
  .col-settings-btn:hover { border-color: var(--accent) !important; color: var(--accent) !important; }
  .col-settings-btn svg { width: 14px; height: 14px; }
</style>
</head>
<body>
<div class="wrap">

  <!-- 登录页 -->
  <div id="loginView">
    <div class="login-card">
      <h1>Worktile 任务评论区看板</h1>
      <p class="sub">输入租户的 Client ID 与 Client Secret 即可查看对应数据（公有云）</p>
      <div id="loginAlert" class="alert hidden"></div>
      <label class="field">

        <svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path d="M11.49 2.26c.41-.69 1.36-.82 1.93-.31l.05.05.93.93a1.24 1.24 0 0 1 .33 1.31l-.19.55a.62.62 0 0 0 .16.62l.43.43a.62.62 0 0 0 .62.16l.55-.19a1.24 1.24 0 0 1 1.31.33l.05.05.93.93c.51.57.36 1.52-.33 1.93l-.5.31a.62.62 0 0 0-.27.6l.05.57a.62.62 0 0 0 .46.51l.57.13c.74.17 1.1.99.74 1.66l-.43.79c-.36.67-1.23.83-1.78.33l-.43-.39a.62.62 0 0 0-.66-.09l-.52.23a.62.62 0 0 0-.37.55v.58c0 .77-.7 1.34-1.45 1.18l-.87-.19a1.21 1.21 0 0 1-.93-1.18v-.55a.62.62 0 0 0-.32-.53l-.49-.27a.62.62 0 0 0-.66.05l-.42.32c-.58.44-1.41.25-1.71-.4l-.34-.78c-.3-.65.05-1.42.74-1.59l.55-.13a.62.62 0 0 0 .46-.51l.03-.55a.62.62 0 0 0-.27-.57l-.46-.31c-.6-.4-.71-1.22-.23-1.74Z"/><circle cx="14.5" cy="14.5" r="3.2" fill="#fff"/><circle cx="14.5" cy="14.5" r="2.4"/></svg>
        列设置
      </button>
    </div>

    <div id="tableArea"></div>

<script>
// ====================== 列定义元数据 ======================
// 第一列（项目名称）作为分组锚定：永远在第一个、永远可见、不可被其他列拖到前面。
// 模式：fixed=固定列宽（可拖拽调节），auto=按内容自适应列宽。
const COLS_META = [
  { key: "proj",     label: "项目名称",     width: 96,  anchor: true, mode: "fixed"  },
  { key: "code",     label: "任务编号",     width: 72,               mode: "auto"   },
  { key: "title",    label: "任务名称",     width: 180,              mode: "auto"   },
  { key: "comments", label: "评论",        width: 380,              mode: "fixed"  },
  { key: "owner",    label: "任务负责人",   width: 80,               mode: "auto"   },
  { key: "updated",  label: "最近更新时间", width: 110,              mode: "auto"   },
];
const DEFAULT_COL_MODES = Object.fromEntries(COLS_META.map(c => [c.key, c.mode]));

// 列宽最小值（自适应/固定列都遵守，避免列窄到看不见）
const COL_MIN_WIDTH = 36;

const COLUMN_CONFIG_KEY = "wt-board:column-config:v2";   // v2: 增加 modes 字段
const COL_WIDTHS_KEY    = "wt-board:col-widths:v2";      // 沿用 v2 键；索引按渲染时的当前 col 下标
const DEFAULT_COL_ORDER = COLS_META.map(c => c.key);
const DEFAULT_COL_WIDTHS = Object.fromEntries(COLS_META.map(c => [c.key, c.width]));

const state = {
  projectId: "__all__",
  projectName: "全部项目",
  projects: [],       // 项目列表缓存（来自 /api/projects）
  tenantHost: "techwll.worktile.com",  // 任务详情页跳转用的租户域名（来自 /api/me 或登录响应）
  clientIdMasked: "",    // 当前租户打码后的 client_id（隔离标识，来自 /api/me 或登录响应）
  tenantFingerprint: "", // 当前租户指纹（隔离证明，同一租户恒定、不同租户不同）
  // 任务名称搜索：typeahead + 多选 chip + OR 查询
  titleChips: [],         // 已选 chip 列表（每项 {task_id, identifier, title, project_name}）
  titleDraft: "",         // 输入框当前草稿（未选中前）
  titleCandidates: [],    // 当前候选列表（typeahead）
  titleIdx: -1,           // 候选下拉键盘高亮下标
  titleDebounceTimer: null,
  titleDebounceMs: 100,
  page: 0,
  pageSize: 50,
  total: null,
  hasMore: false,
  expanded: new Set(),
  commentsCache: {},   // taskId -> comments array
  colWidths: {},       // 用户自定义列宽（按当前渲染顺序的 col index -> px），来自 localStorage
  colOrder: [...DEFAULT_COL_ORDER],            // 当前列展示顺序（proj 始终在 [0]）
  colVisible: Object.fromEntries(COLS_META.map(c => [c.key, true])),  // 每列显隐
  colModes: { ...DEFAULT_COL_MODES },          // 每列宽度模式：fixed=固定可拖 / auto=按内容自适应
};

// =================== 列宽拖拽调节 ===================
// 注：COL_WIDTHS_KEY 已在 COLS_META 块顶部声明（line 631），避免重复声明。

function loadColumnWidths(){
  try {
    const raw = localStorage.getItem(COL_WIDTHS_KEY);
    if (!raw) return;
    const obj = JSON.parse(raw);
    if (obj && typeof obj === "object") state.colWidths = obj;
  } catch(e){ /* localStorage 可能被禁用，忽略 */ }
}

function saveColumnWidths(){
  try { localStorage.setItem(COL_WIDTHS_KEY, JSON.stringify(state.colWidths)); }
  catch(e){}
}

// =================== 列配置：显示哪些列、按什么顺序 ===================
/** 从 localStorage 恢复列配置；任何字段缺失/非法都回退默认；保证 proj 始终 [0] + 可见。 */
function loadColumnConfig(){
  try {
    const raw = localStorage.getItem(COLUMN_CONFIG_KEY);
    if (!raw) return;
    const obj = JSON.parse(raw);
    if (obj && Array.isArray(obj.order)){
      // 与 DEFAULT_COL_ORDER 求并集、按用户顺序 + 默认补漏，剔除未知 key
      const seen = new Set();
      const merged = [];
      for (const k of obj.order){
        if (typeof k === "string" && COLS_META.some(c => c.key === k) && !seen.has(k)){
          merged.push(k); seen.add(k);
        }
      }
      for (const k of DEFAULT_COL_ORDER){
        if (!seen.has(k)){ merged.push(k); seen.add(k); }
      }
      // 强制 proj 永远在第一位
      merged.sort((a, b) => a === "proj" ? -1 : (b === "proj" ? 1 : 0));
      state.colOrder = merged;
    }
    if (obj && obj.visible && typeof obj.visible === "object"){
      for (const c of COLS_META){
        if (typeof obj.visible[c.key] === "boolean"){
          state.colVisible[c.key] = obj.visible[c.key];
        }
      }
    }
    // 加载 modes：每列固定/自适应（v2 才有，缺失时回退到默认）
    if (obj && obj.modes && typeof obj.modes === "object"){
      for (const c of COLS_META){
        if (obj.modes[c.key] === "fixed" || obj.modes[c.key] === "auto"){
          state.colModes[c.key] = obj.modes[c.key];
        }
      }
    }
  } catch(e){ /* localStorage 异常时沿用默认 */ }
  // 强制锚定列：永远在第一个、永远可见、固定列宽（这是分组合并视觉的硬约束）
  state.colOrder = state.colOrder.filter(k => k !== "proj").concat(["proj"]);
  state.colOrder = ["proj", ...state.colOrder.filter(k => k !== "proj")];
  state.colVisible["proj"] = true;
  state.colModes["proj"] = "fixed";
}
function saveColumnConfig(){
  try {
    localStorage.setItem(COLUMN_CONFIG_KEY, JSON.stringify({
      order: state.colOrder,
      visible: state.colVisible,
      modes: state.colModes
    }));
  } catch(e){}
}
/** 弹窗变更后调用：持久化 + 重渲染当前页（不重新拉数据）。 */
function applyColumnConfig(){
  saveColumnConfig();
  // 重新触发渲染：用当前 items 渲染一次（性能可接受，因为评论都在 cache 里）
  if (state.lastItems) renderTable(state.lastItems);
}

// 把 state.colWidths 应用到当前页面所有 .proj-table 的 colgroup 上
//   - widths 索引是"原始下标"（renderTable 中 col 上的 data-col），与列顺序解耦
//   - 只有当 col 上声明了 data-col 时才覆盖，避免影响未受影响的列
function applyColumnWidths(){
  const widths = state.colWidths || {};
  const keys = Object.keys(widths);
  if (!keys.length) return;
  document.querySelectorAll("#tableArea .proj-table").forEach(tbl => {
    const cols = tbl.querySelectorAll("colgroup col");
    cols.forEach((c) => {
      const idx = parseInt(c.dataset.col, 10);
      if (Number.isFinite(idx) && widths[idx] != null){
        c.style.width = widths[idx] + "px";
      }
    });
  });
}

// 全局拖拽：仅绑定一次（页面生命周期内）
let _colDrag = null;

/**
 * 自适应列精确测量 + 跨表统一列宽 —— 让自适应列严格贴紧"最长内容"，
 * 并保证所有项目表用同一套列宽（数据列对列自然对齐）。
 *
 * 为什么之前一直失败（关键坑，已用真实浏览器实测定位）：
 *   table-layout:fixed + table{width:auto} 下，表格的"使用宽度" = max(容器宽, 各列宽之和)。
 *   只要内容总宽 < 容器宽，表格就会撑满容器，多余空间被均摊给 auto 列 ——
 *   于是 "2" / "John" / "08-12 14:43" 这些短 cell 被拉到 134 / 147 / 160px。
 *   即便给 col 单独写死 84px 也没用：表格一撑满容器就会重新分配，覆盖掉 col 宽度。
 *   同时单纯设 width:max-content 在 fixed 布局下也不会生效。
 *
 *   ✅ 唯一可靠解：给表格一个【确定的像素宽度 = 各列宽之和】，让剩余空间 = 0，无空间可分配。
 *
 * 流程（三遍，确保所有表同列同宽）：
 *   1. 第一遍：每张表各自测量每列目标宽（auto 列基于自身 body+header，fixed 列取 colgroup 既定宽），
 *      记录到 tableTargets[i]，此时不写 DOM。
 *   2. 第二遍：对每个 colIdx，在所有表的 targets 里取最大值 → globalMax[colIdx]。
 *      这样宽窄内容混合的多张表，会按"最宽的那张"的列宽对齐，所有列跨表一致。
 *   3. 第三遍：把 globalMax[colIdx] 写到所有表的 col.style.width，并写
 *      tbl.style.width = 各列宽之和（确定像素宽 → 剩余空间 = 0 → 浏览器不再均摊）。
 */
const AUTO_COL_MAX_W = 320;   // 自适应列内容上限：超长内容截断省略号，避免撑爆整表
const AUTO_COL_MIN_W = 60;    // 自适应列最小宽（与 td.cell-id/cell-title 的 CSS min-width 对齐，
                              // 避免"表宽 < 列宽之和"导致浏览器反向压缩列）
function measureAndFitAutoColumns(){
  const tables = [...document.querySelectorAll("#tableArea .proj-table")];
  if (!tables.length) return;

  // 第一遍：每张表各自测量每列目标宽（不动 DOM）。返回的每个数组的下标 == 列渲染下标，
  // 跨表 colIdx 一致（同一 state.colOrder/state.colVisible 派生），所以可以直接逐位取 max。
  const tableTargets = tables.map(tbl => {
    const cols = tbl.querySelectorAll("colgroup col");
    if (!cols.length) return null;
    const trs = tbl.querySelectorAll("tbody tr");
    if (!trs.length) return null;

    // 列几何位置（rect.left/right）作为锚点：每个 td 用几何范围匹配自己属于哪一列。
    // 不能用 td.children[colIdx] —— proj 单元格 rowspan=N 让后续行 children 下标整体前移，
    // 会导致 title 长串被误算到 code 列头上。
    const colRects = [...cols].map(c => c.getBoundingClientRect());
    const ths = tbl.querySelectorAll("thead th");

    // 注意 fixed 列取既定宽（renderTable / applyColumnWidths 写入的 style.width），
    // 绝不能读当前 rect —— 那可能是上一次被容器撑开后的宽，会越积越大。
    const targets = [];
    cols.forEach((col, colIdx) => {
      if (col.dataset.mode !== "auto"){
        let fw = parseFloat(col.style.width);
        if (!fw || !isFinite(fw)) fw = col.getBoundingClientRect().width;
        targets[colIdx] = fw;
        return;
      }
      let maxBodyW = 0, maxHeadW = 0;
      const colX = colRects[colIdx].left;
      for (const tr of trs){
        const tds = tr.children;
        let matchedTd = null;
        for (const td of tds){
          if (td.style.display === "none" || td.hidden) continue;
          const r = td.getBoundingClientRect();
          // td 的几何范围落在 col 的范围内，即属于此列
          if (r.left >= colX - 2 && r.right <= colRects[colIdx].right + 2){
            matchedTd = td;
            break;
          }
        }
        if (!matchedTd) continue;
        const range = document.createRange();
        range.selectNodeContents(matchedTd);
        const rect = range.getBoundingClientRect();
        const cs = getComputedStyle(matchedTd);
        const cellW = rect.width + (parseFloat(cs.paddingLeft)||0) + (parseFloat(cs.paddingRight)||0);
        if (cellW > maxBodyW) maxBodyW = cellW;
      }
      // 表头：逐子节点量内容宽再求和（文本节点 + "自适应"角标 span 等 inline 元素）。
      // 注意：绝不能用 range.selectNodeContents(th) —— 在表格单元格里它会返回整个 th 的
      // 盒宽（= 列宽，如 134px）而非文字宽，导致表头测量虚高、整列被撑宽。
      const th = ths[colIdx];
      if (th){
        const range = document.createRange();
        let headContent = 0;
        th.childNodes.forEach(n => {
          if (n.nodeType === 3){
            if (!n.textContent.trim()) return;
            range.selectNode(n);
            headContent += range.getBoundingClientRect().width;
          } else if (n.nodeType === 1){
            headContent += n.getBoundingClientRect().width;
          }
        });
        const cs = getComputedStyle(th);
        maxHeadW = headContent + (parseFloat(cs.paddingLeft)||0) + (parseFloat(cs.paddingRight)||0);
      }
      let targetW = Math.min(AUTO_COL_MAX_W, Math.ceil(Math.max(maxBodyW, maxHeadW)));
      targetW = Math.max(AUTO_COL_MIN_W, targetW);
      targets[colIdx] = targetW;
    });
    return targets;
  });

  // 第二遍：取每个 colIdx 在所有表里的最大值 → 保证所有表用同一套列宽，
  // 跨表数据"列对列"自然对齐（短内容列也被拉到与最长内容列同宽）。
  const colCount = tableTargets[0]?.length || 0;
  const globalMax = [];
  for (let ci = 0; ci < colCount; ci++){
    let m = 0;
    for (const targets of tableTargets){
      const w = targets?.[ci] || 0;
      if (w > m) m = w;
    }
    globalMax[ci] = m;
  }

  // 第三遍：把 globalMax 写到所有表的 col.style.width，并按其总和确定每张表的表宽。
  // 关键点：累加时直接用 globalMax 数组（已确定值），不读实时 col rect。
  tables.forEach((tbl, ti) => {
    const cols = tbl.querySelectorAll("colgroup col");
    const targets = tableTargets[ti];
    if (!cols.length || !targets) return;
    let total = 0;
    cols.forEach((col, colIdx) => {
      const w = globalMax[colIdx] || targets[colIdx] || 0;
      col.style.width = w + "px";
      total += w;
    });
    tbl.style.width = Math.ceil(total) + "px";
  });
}
function bindColumnResize(){
  // 用事件委托：任何 col-resizer 的 mousedown 都接管（绑在 document 上，避免依赖元素是否存在）
  document.addEventListener("mousedown", e => {
    const hand = e.target.closest && e.target.closest(".col-resizer");
    if (!hand) return;
    e.preventDefault();
    const originalIdx = parseInt(hand.dataset.col, 10);
    if (!Number.isFinite(originalIdx)) return;
    const table = hand.closest("table");
    if (!table) return;
    const col = table.querySelector(`colgroup col[data-col="${originalIdx}"]`);
    if (!col) return;
    _colDrag = {
      originalIdx,
      startX: e.clientX,
      startW: col.getBoundingClientRect().width,
      hand,
      table
    };
    hand.classList.add("dragging");
    document.body.classList.add("col-resizing");
    // 拖拽手柄仅在 fixed 列渲染；拖拽期间 table-layout 保持 auto，浏览器会自动跟随。
    // 如需防跳变：在 mousemove 里直接同步 col.style.width，浏览器会按当前 width 排队重算。
  });
  document.addEventListener("mousemove", e => {
    if (!_colDrag) return;
    const dx = e.clientX - _colDrag.startX;
    const newW = Math.max(40, Math.round(_colDrag.startW + dx));
    state.colWidths[_colDrag.originalIdx] = newW;
    // 同步到所有表格的对应 col（按 data-col 原始下标定位）。
    // table-layout:auto 下浏览器按 col width + 内容算列宽，写 width 后立即生效。
    document.querySelectorAll(`#tableArea .proj-table colgroup col[data-col="${_colDrag.originalIdx}"]`)
      .forEach(c => { c.style.width = newW + "px"; });
  });
  document.addEventListener("mouseup", () => {
    if (!_colDrag) return;
    _colDrag.hand.classList.remove("dragging");
    document.body.classList.remove("col-resizing");
    saveColumnWidths();
    _colDrag = null;
  });
}

function show(el){ document.getElementById(el).classList.remove("hidden"); }
function hide(el){ document.getElementById(el).classList.add("hidden"); }

async function api(path, opts){
  const resp = await fetch(path, Object.assign({credentials:"same-origin"}, opts));
  let data = null;
  try { data = await resp.json(); } catch(e){}
  if (resp.status === 401){
    // 会话失效，回到登录页
    hide("boardView"); show("loginView");
    throw new Error("会话已失效，请重新登录");
  }
  if (!resp.ok || (data && data.ok === false)){
    throw new Error((data && data.error) || ("请求失败：" + resp.status));
  }
  return data;
}

async function doLogin(){
  const btn = document.getElementById("loginBtn");
  const alert = document.getElementById("loginAlert");
  alert.classList.add("hidden");
  const clientId = document.getElementById("clientId").value.trim();
  const clientSecret = document.getElementById("clientSecret").value.trim();
  if (!clientId || !clientSecret){
    alert.textContent = "Client ID 和 Client Secret 均不能为空";
    alert.classList.remove("hidden");
    return;
  }
  btn.disabled = true; btn.textContent = "验证中…";
  try {
    const r = await api("/api/login", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({
        client_id: clientId,
        client_secret: clientSecret,
        tenant: document.getElementById("tenantInput").value.trim()
      })
    });
    if (r.tenant_host) state.tenantHost = r.tenant_host;
    if (r.client_id_masked) state.clientIdMasked = r.client_id_masked;
    if (r.tenant_fingerprint) state.tenantFingerprint = r.tenant_fingerprint;
    renderTenantBadge();
    hide("loginView"); show("boardView");
    await loadProjects();
  } catch(e){
    alert.textContent = e.message;
    alert.classList.remove("hidden");
  } finally {
    btn.disabled = false; btn.textContent = "进入看板";
  }
}

async function doLogout(){
  try { await api("/api/logout", {method:"POST"}); } catch(e){}
  state.expanded.clear(); state.commentsCache = {};
  state.clientIdMasked = ""; state.tenantFingerprint = "";
  renderTenantBadge();
  hide("boardView"); show("loginView");
  document.getElementById("clientSecret").value = "";
}

/** 顶栏租户徽标：展示当前租户打码 client_id 与指纹，让用户直观确认
 *  自己处于隔离的租户空间（与其他租户数据互不可见）。 */
function renderTenantBadge(){
  const el = document.getElementById("tenantBadge");
  if (!el) return;
  if (state.clientIdMasked){
    const fp = state.tenantFingerprint ? ` · #${state.tenantFingerprint}` : "";
    el.textContent = `租户：${state.clientIdMasked}${fp}`;
    el.classList.add("active");
  } else {
    el.textContent = "租户：—";
    el.classList.remove("active");
  }
}

/* ====================== 搜索式项目选择器 ====================== */
let _pickerHighlighted = -1;

function initProjectPicker(){
  const input = document.getElementById("projectInput");
  const menu = document.getElementById("projectMenu");
  const picker = document.getElementById("projectPicker");
  input.addEventListener("focus", () => {
    input.select();
    openProjectMenu();
  });
  input.addEventListener("input", () => renderProjectMenu(input.value));
  input.addEventListener("keydown", onProjectKey);
  // 点击外部自动关闭
  document.addEventListener("click", (e) => {
    if (!picker.contains(e.target)) closeProjectMenu();
  });
}

/** 把 fixed 定位的浮层对齐到 anchor 元素下方（与 input 同宽）。 */
function positionMenuUnder(menu, anchor){
  if (!menu || !anchor) return;
  const r = anchor.getBoundingClientRect();
  menu.style.minWidth = r.width + "px";
  menu.style.left = r.left + "px";
  menu.style.top  = (r.bottom + 4) + "px";
}

function openProjectMenu(){
  const input = document.getElementById("projectInput");
  const menu = document.getElementById("projectMenu");
  // 若输入框当前显示的是已选项名，重新聚焦打开时不预填筛选
  renderProjectMenu(input.value === state.projectName ? "" : input.value);
  positionMenuUnder(menu, input);
  menu.hidden = false;
  _pickerHighlighted = -1;
}

function closeProjectMenu(){
  document.getElementById("projectMenu").hidden = true;
  document.getElementById("projectInput").value = state.projectName || "";
  _pickerHighlighted = -1;
}

function renderProjectMenu(filterText){
  const menu = document.getElementById("projectMenu");
  menu.innerHTML = "";
  const items = [{id:"__all__", name:"全部项目"}]
    .concat((state.projects || []).map(p => ({id: p.id, name: p.name})));
  const q = (filterText || "").trim().toLowerCase();
  const filtered = q
    ? items.filter(it => it.name.toLowerCase().includes(q))
    : items;
  if (!filtered.length){
    const empty = document.createElement("div");
    empty.className = "opt-empty";
    empty.textContent = "没有匹配的项目";
    menu.appendChild(empty);
    return;
  }
  filtered.forEach((it, idx) => {
    const div = document.createElement("div");
    div.className = "opt" + (it.id === state.projectId ? " selected" : "");
    div.dataset.id = it.id;
    if (q){
      const lower = it.name.toLowerCase();
      const pos = lower.indexOf(q);
      if (pos >= 0){
        div.innerHTML =
          escapeHtml(it.name.slice(0, pos)) +
          '<span class="hl">' + escapeHtml(it.name.slice(pos, pos + q.length)) + '</span>' +
          escapeHtml(it.name.slice(pos + q.length));
      } else {
        div.textContent = it.name;
      }
    } else {
      div.textContent = it.name;
    }
    div.addEventListener("click", () => selectProject(it.id, it.name));
    div.addEventListener("mouseenter", () => {
      _pickerHighlighted = idx;
      updatePickerHighlight();
    });
    menu.appendChild(div);
  });
}

function updatePickerHighlight(){
  const items = document.querySelectorAll("#projectMenu .opt");
  items.forEach((el, i) => el.classList.toggle("highlighted", i === _pickerHighlighted));
}

function scrollHighlightedIntoView(){
  const menu = document.getElementById("projectMenu");
  const el = menu.querySelector(".opt.highlighted");
  if (el) el.scrollIntoView({block:"nearest"});
}

function onProjectKey(e){
  const menu = document.getElementById("projectMenu");
  const input = document.getElementById("projectInput");
  if (e.key === "Escape"){
    closeProjectMenu();
    input.blur();
    e.preventDefault();
    return;
  }
  const items = Array.from(document.querySelectorAll("#projectMenu .opt"));
  if (e.key === "ArrowDown"){
    if (menu.hidden) openProjectMenu();
    _pickerHighlighted = Math.min(_pickerHighlighted + 1, Math.max(items.length - 1, 0));
    updatePickerHighlight();
    scrollHighlightedIntoView();
    e.preventDefault();
  } else if (e.key === "ArrowUp"){
    _pickerHighlighted = Math.max(_pickerHighlighted - 1, 0);
    updatePickerHighlight();
    scrollHighlightedIntoView();
    e.preventDefault();
  } else if (e.key === "Enter"){
    if (!menu.hidden && _pickerHighlighted >= 0 && items[_pickerHighlighted]){
      const it = items[_pickerHighlighted];
      selectProject(it.dataset.id, it.textContent.trim());
    }
    e.preventDefault();
  }
}

async function loadTasks(){
  if (!state.projectId) return;
  const area = document.getElementById("tableArea");
  area.innerHTML = '<div class="loading">加载任务中…</div>';
  try {
    const kw = buildSearchKeyword();
    const url = `/api/tasks?project_id=${encodeURIComponent(state.projectId)}`
      + `&page=${state.page}&page_size=${state.pageSize}`
      + (kw ? `&keyword=${encodeURIComponent(kw)}` : ``);

    state.total = data.total;
    state.hasMore = data.has_more;

}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);
}

/**
 * 拼接 Worktile 任务详情页 URL。
 * 规则（已用真实 URL 验证）：https://{tenant}/mission/projects/{project_id}/tasks/{task_id}
 * 缺少租户域名或 project_id/task_id 时返回 null（调用方降级为纯文本）。
 */
function buildTaskUrl(t){
  if (!state.tenantHost || !t.project_id || !t.task_id) return null;
  return "https://" + state.tenantHost
    + "/mission/projects/" + encodeURIComponent(t.project_id)
    + "/tasks/" + encodeURIComponent(t.task_id);
}

/** 任务名称渲染：可点击 → 新标签页打开 Worktile 任务详情；缺字段时降级为纯文本。 */
function buildTaskTitle(t){
  const url = buildTaskUrl(t);
  const title = highlightTitle(t.title || "");
  if (!url) return title;
  return `<a href="${url}" target="_blank" rel="noopener" `
    + `title="在新标签页打开 Worktile 任务详情">${title}</a>`;
}

/** 任务名称命中多个关键字（按 | 拆分）的部分加黄色高亮（先转义再包裹，避免 XSS/错位）。 */
function highlightTitle(title){
  const kw = (buildSearchKeyword() || "").trim().toLowerCase();
  if (!kw) return escapeHtml(title);
  const terms = kw.split("|").map(s => s.trim()).filter(Boolean);
  if (!terms.length) return escapeHtml(title);
  const lower = (title || "").toLowerCase();
  // 标记所有命中区间（按 | 拆分，任一匹配即高亮），然后按位置排序+合并重叠段
  const ranges = [];
  for (const t of terms){
    let i = 0, idx;
    while ((idx = lower.indexOf(t, i)) !== -1){
      ranges.push([idx, idx + t.length]);
      i = idx + t.length;
    }
  }
  if (!ranges.length) return escapeHtml(title);
  ranges.sort((a,b) => a[0]-b[0] || b[1]-a[1]);
  const merged = [];
  for (const r of ranges){
    const last = merged[merged.length - 1];
    if (last && r[0] <= last[1]) last[1] = Math.max(last[1], r[1]);
    else merged.push([r[0], r[1]]);
  }
  let out = "", i = 0;
  for (const [s, e] of merged){
    out += escapeHtml(title.slice(i, s));
    out += '<span class="hl">' + escapeHtml(title.slice(s, e)) + '</span>';
    i = e;
  }
  out += escapeHtml(title.slice(i));
  return out;
}

function renderTable(items){
  const area = document.getElementById("tableArea");
  if (!items.length){
    area.innerHTML = '<div class="loading">该项目下暂无任务</div>';
    return;
  }
  // 按项目名分组；每个项目渲染成独立的 <table>（外加 <div class="proj-block"> 做分组卡片）
  // 这样 proj 单元格的 rowspan 只在各自表内生效，不会跨组溢出造成"阶梯嵌套"假象
  const groups = [];
  for (const t of items){
    const key = t.project_name || "(未命名项目)";
    let g = groups[groups.length - 1];
    if (!g || g.name !== key){ g = {name: key, tasks: []}; groups.push(g); }
    g.tasks.push(t);
  }
  let html = '';
  groups.forEach(g => {
    // 任务数 * 2 = 该表总行数（任务行 + 评论明细行），作为 proj 单元格的 rowspan
    const span = g.tasks.length * 2;
    html += '<div class="proj-block">';
    // ====== 列定义：按 state.colOrder 顺序 + colVisible 过滤后的可见列 ======
    // 注意：可见列中第一列若是 "proj"（分组锚定列），则用 rowspan 合并单元格；
    //     若用户隐藏了 proj，则按"每行重复显示项目名"的方式降级渲染，保持 .proj-block 分组卡片仍在。
    const visibleCols = state.colOrder
      .map((key, originalIdx) => {
        const meta = COLS_META.find(m => m.key === key);
        return { key, label: meta.label, anchor: !!meta.anchor, originalIdx };
      })
      .filter(c => state.colVisible[c.key]);
    if (!visibleCols.length){
      // 兜底：万一全隐藏了，至少保留"任务编号"列
      visibleCols.push({ key: "code", label: "任务编号", anchor: false, originalIdx: 1 });
      state.colVisible.code = true;
    }
    const groupLen = g.tasks.length;

    // colgroup：每个 col 用 data-col 存"原始下标"，与 state.colWidths 索引对齐；
    //           这样用户拖动列宽后，即使重排列顺序也不会丢失自定义宽度。
    //           auto 列不写 style.width，让浏览器按内容自适应；
    //           fixed 列才写 style.width。
    let colgroupHtml = '<colgroup>';
    visibleCols.forEach((c, renderIdx) => {
      const isAuto = state.colModes[c.key] === "auto";
      if (isAuto){
        // 自适应：不指定 width，浏览器按内容分配
        colgroupHtml += `<col data-col="${c.originalIdx}" data-mode="auto">`;
      } else {
        const defW = DEFAULT_COL_WIDTHS[c.key];
        const customW = state.colWidths[c.originalIdx];
        const w = customW || defW;
        colgroupHtml += `<col data-col="${c.originalIdx}" data-mode="fixed" style="width:${w}px">`;
      }
    });
    colgroupHtml += '</colgroup>';

    // thead：auto 列不加 resizer（自适应列没拖的意义），仅 fixed 列可拖
    let theadHtml = '<thead><tr>';
    visibleCols.forEach((c, renderIdx) => {
      const isLast = renderIdx === visibleCols.length - 1;
      const isAuto = state.colModes[c.key] === "auto";
      // auto 列不渲染 resizer（视觉提示：自适应列没有手动拖拽手柄）
      const resizer = (isLast || isAuto)
        ? ''
        : `<span class="col-resizer" data-col="${c.originalIdx}"></span>`;
      // auto 列加一个小角标，提示用户这列是自适应
      const tag = isAuto ? ' <span class="mode-tag" title="此列按内容自适应列宽">自适应</span>' : '';
      // 给 th 标 data-mode，CSS 据此设 white-space:nowrap 让列宽紧贴内容
      const thAttr = isAuto ? ' data-mode="auto"' : '';
      theadHtml += `<th${thAttr}>${resizer}${escapeHtml(c.label)}${tag}</th>`;
    });
    theadHtml += '</tr></thead>';

    // tbody：行内按 visibleCols 顺序生成 td；遇到"第一个可见列 === proj"时按 rowspan 合并
    html += `<table class="proj-table">${colgroupHtml}${theadHtml}<tbody>`;
    const anchorFirst = (visibleCols[0] && visibleCols[0].key === "proj");

    g.tasks.forEach((t, idx) => {
      // 评论列渲染策略（未变）
      const cached = state.commentsCache[t.task_id];
      let commentsHtml;
      if (cached === undefined){
        commentsHtml = '<div class="cell-loading">加载评论中…</div>';
      } else if (!cached.length){
        commentsHtml = '<div class="cell-empty">该任务暂无评论</div>';
      } else {
        commentsHtml = renderComments(cached);
      }

      html += `<tr class="task-row" data-id="${escapeHtml(t.task_id)}">`;
      visibleCols.forEach((c, renderIdx) => {
        if (anchorFirst && c.key === "proj"){
          // 分组合并的"项目名称"列：仅 idx===0 写一次
          if (idx === 0){
            // 项目名称默认 fixed 96，强制固定列宽（避免被 auto 列挤压）
            const projW = DEFAULT_COL_WIDTHS.proj;
            html += `<td class="proj-cell" rowspan="${groupLen}" style="min-width:${projW}px; max-width:${projW}px">`
              + `<span class="proj-name">${escapeHtml(g.name)}</span>`
              + `<span class="proj-count">共 ${groupLen} 条</span>`
              + '</td>';
          }
          return;
        }
        // 自适应列加 data-mode="auto"，CSS 据此设 white-space:nowrap 让列宽紧贴内容
        const dataMode = state.colModes[c.key] === "auto" ? ' data-mode="auto"' : '';
        // 固定列：在每个 td 写内联 min-width/max-width，让 table-layout:auto 下也能真固定
        // （否则浏览器按内容把 fixed 列也压成内容宽度，fixed 就名存实亡了）
        const fixedW = state.colWidths[c.originalIdx] || DEFAULT_COL_WIDTHS[c.key];
        const fixStyle = state.colModes[c.key] === "fixed"
          ? ` style="min-width:${fixedW}px; max-width:${fixedW}px"`
          : '';
        // 普通 td 渲染（按 key 分发）
        switch (c.key){
          case "code":
            html += `<td class="cell-id"${dataMode}${fixStyle}>${escapeHtml(t.identifier || "-")}</td>`;
            break;
          case "title":
            html += `<td class="cell-title"${dataMode}${fixStyle}>${buildTaskTitle(t)}</td>`;
            break;
          case "comments":
            html += `<td class="cell-comments" data-comments="${escapeHtml(t.task_id)}"${dataMode}${fixStyle}>${commentsHtml}</td>`;
            break;
          case "owner":
            html += `<td${dataMode}${fixStyle} title="${escapeHtml(t.assignee || "")}">${escapeHtml(t.assignee)}</td>`;
            break;
          case "updated":
            html += `<td${dataMode}${fixStyle} title="${escapeHtml(t.updated_at || t.updated_at_str)}">${escapeHtml(t.updated_at_str)}</td>`;
            break;
          case "proj":
            // 非首列的 proj（理论上不会出现，因 anchor 限制，但兜底用每行重复显示）
            html += `<td class="proj-cell-inline"${dataMode}${fixStyle}><span class="proj-name">${escapeHtml(g.name)}</span></td>`;
            break;
        }
      });
      html += '</tr>';
    });
    html += '</tbody></table></div>';
  });
  area.innerHTML = html;

  // 把用户保存的自定义列宽同步到本次渲染出的所有 proj-table 上
  applyColumnWidths();

  // 自适应列：量每列最长 cell 的"内容宽 + padding"（含表头），写入 col.style.width 让列贴内容；
  // 同时把整张表定宽到"各列宽之和"（确定像素宽 → 剩余空间=0），彻底消除 fixed+auto 下
  // 浏览器把容器剩余宽度均摊给 auto 列导致的短 cell 被拉宽（实测旧版 code/owner/updated
  // 被拉到 134/147/160px；修正后约 84/97/110px，紧贴内容）。
  measureAndFitAutoColumns();

  // 搜索命中提示横幅（仅在有搜索关键字时显示）
  const kw = buildSearchKeyword();
  if (kw){
    const banner = document.createElement("div");
    banner.className = "search-banner";
    const parts = kw.split("|").filter(Boolean);
    const chipsHtml = parts.map(p => `「<b>${escapeHtml(p)}</b>」`).join(" OR ");
    banner.innerHTML = `正在按任务名称筛选 ${chipsHtml}`
      + (state.total != null ? `，命中 ${state.total} 条` : "") + `。`;
    area.insertBefore(banner, area.firstChild);
  }

  // 首屏渲染后，并发拉取所有未缓存任务的评论（带并发限流，避免瞬时压垮 API）
  const pending = items.map(t => t.task_id).filter(id => state.commentsCache[id] === undefined);
  if (pending.length) prefetchComments(pending);
}

async function prefetchComments(taskIds){
  // 并发限流：每次最多 6 个并发请求
  const CONCURRENCY = 6;
  let i = 0;
  const workers = Array.from({length: Math.min(CONCURRENCY, taskIds.length)}, async () => {
    while (i < taskIds.length){
      const id = taskIds[i++];
      await loadComments(id);
    }
  });
  await Promise.all(workers);
}

async function loadComments(taskId){
  const cell = document.querySelector(`td.cell-comments[data-comments="${cssEscape(taskId)}"]`);
  if (!cell) return;
  try {
    const data = await api("/api/tasks/" + encodeURIComponent(taskId) + "/comments");
    state.commentsCache[taskId] = data.comments || [];
    cell.innerHTML = state.commentsCache[taskId].length
      ? renderComments(state.commentsCache[taskId])
      : '<div class="cell-empty">该任务暂无评论</div>';
  } catch(e){
    cell.innerHTML = `<div class="cell-error">${escapeHtml(e.message)}</div>`;
  }
}

function renderComments(comments){
  if (!comments || !comments.length){
    return '<div class="cell-empty">该任务暂无评论</div>';
  }
  return '<div class="comments-inner">' + comments.map(c => {
    const atts = (c.attachments || []).map(a => {
      const name = escapeHtml(a.name || "未命名");
      if (a.file_id) {
        const fid = encodeURIComponent(a.file_id);
        if (a.is_image) {
          // 图片：缩略图 + 点击放大
          return `<span class="att img-type">`
            + `<img class="att-thumb" src="/api/file/${fid}" loading="lazy" alt="${name}" `
            + `title="点击放大查看" onclick="openLightbox(this.src)">`
            + `<span class="fname">${name}</span></span>`;
        }
        // 文件：新标签打开预览 / 下载
        return `<a class="att file-type" href="/api/file/${fid}" target="_blank" `
          + `rel="noopener" title="点击预览 / 下载">📄 <span class="fname">${name}</span></a>`;
      }
      // 无 file_id（极少数情况）：降级为纯文本标签
      const cls = a.is_image ? "att img-type" : "att file-type";
      const label = a.is_image ? "图片" : "文件";
      return `<span class="${cls}"><span>${label}</span>`
        + `<span class="fname">${name}</span></span>`;
    }).join("");
    // eslint-disable-next-line no-control-regex
  const EMOJI_ONLY = /^[\s\u200d\ufe0f]*([\p{Extended_Pictographic}\u200d\ufe0f]+[\s\u200d\ufe0f]*){1,6}$/u;
  const isEmojiOnly = (s) => typeof s === "string" && EMOJI_ONLY.test(s.trim());
  const bodyHtml = renderContent(c.content || "");
  const bodyCls = isEmojiOnly(c.content || "") ? "body emoji-only" : "body";
    return `<div class="comment-block">`
      + `<div class="meta"><b>${escapeHtml(c.author)}</b>·${escapeHtml(c.created_at_str)}</div>`
      + `<div class="${bodyCls}">${bodyHtml}</div>`
      + (atts ? `<div class="atts">${atts}</div>` : "")
      + '</div>';
  }).join("") + '</div>';
}

/**
 * 把评论纯文本渲染成结构化 HTML：
 *  - ```lang\n...\n``` markdown 代码块 → <pre class="code-block">
 *  - 行内 `code` → <code>code</code>
 *  - 其他段落合并换行 → <p>...</p>
 */
function renderContent(text){
  if (!text) return "";
  // 1) 先抽出 ``` 代码块（避免后续行内 code / escape 影响它），用占位符替入
  const blocks = [];
  let s = escapeHtml(text).replace(
    /```([a-zA-Z0-9+_\-]*)[ \t]*\n([\s\S]*?)```/g,
    (_, lang, code) => {
      const idx = blocks.length;
      blocks.push({ lang: lang || "", code });
      return "\u0000CB" + idx + "\u0000";
    }
  );
  // 2) 行内 `code`
  s = s.replace(/`([^`\n]+)`/g, "<code>$1</code>");
  // 3) 按行处理：连续非空行合并成 <p>，占位符独立成 <pre>
  const lines = s.split("\n");
  const out = [];
  let para = [];
  const flush = () => {
    if (para.length) {
      out.push("<p>" + para.join("<br>") + "</p>");
      para = [];
    }
  };
  for (const line of lines){
    const m = line.match(/^\u0000CB(\d+)\u0000$/);
    if (m){
      flush();
      const b = blocks[+m[1]];
      const lang = b.lang ? `<span class="lang">${b.lang}</span>` : "";
      out.push(`<pre class="code-block">${lang}${b.code}</pre>`);
      continue;
    }
    para.push(line);
  }
  flush();
  return out.join("");
}

function renderPager(){
  const pager = document.getElementById("pager");
  const curr = state.page + 1;
  let totalHtml = "";
  let maxPage = null;

  if (state.total != null){
    maxPage = Math.max(1, Math.ceil(state.total / state.pageSize));
    totalHtml = `<span class="info">共 ${state.total} 条 · 共 ${maxPage} 页</span>`;
  } else if (state.hasMore){
    totalHtml = `<span class="info">第 ${curr} 页（还有更多）</span>`;
  } else {
    totalHtml = `<span class="info">第 ${curr} 页</span>`;
  }

  // 跳转输入框：total 已知时设 max；hasMore 但 total 未知时也放开可输入（不写 max）；
  // 两边都为否（首屏单页）才置灰。
  const enableJump = (state.total != null) || state.hasMore;
  const jumpMaxAttr = (state.total != null) ? `max="${maxPage}"` : "";
  const jumpHint = (!state.hasMore && state.total == null) ? `placeholder="-"`
                  : (state.total == null && state.hasMore) ? `placeholder="N"`
                  : "";

  pager.innerHTML = `
    <button class="pager-btn" id="prevBtn" ${state.page<=0?'disabled':''} onclick="gotoPage(-1)">上一页</button>
    ${totalHtml}
    <span class="page-jump">
      <span>前往</span>
      <input id="pageInput" class="page-input" type="number" min="1"
             ${jumpMaxAttr} value="${curr}" ${jumpHint}
             ${enableJump ? "" : "disabled"}
             onkeydown="if(event.key==='Enter'){gotoExactPage();}">
      <span>页</span>
      <button class="page-go" onclick="gotoExactPage()" ${enableJump ? "" : "disabled"}>跳转</button>
    </span>
    <button class="pager-btn" id="nextBtn" ${state.hasMore?'':'disabled'} onclick="gotoPage(1)">下一页</button>
  `;
}

function gotoExactPage(){
  if (state.total == null && !state.hasMore) return;
  const input = document.getElementById("pageInput");
  if (!input) return;
  let n = parseInt(input.value, 10);
  if (!Number.isFinite(n) || n < 1) { input.value = state.page + 1; return; }
  if (state.total != null){
    const maxPage = Math.max(1, Math.ceil(state.total / state.pageSize));
    if (n > maxPage) n = maxPage;
  }
  input.value = n;
  const target = n - 1;
  if (target === state.page) return;
  state.page = target;
  loadTasks();
}

function gotoPage(delta){
  const next = state.page + delta;
  if (next < 0) return;
  if (delta > 0 && !state.hasMore) return;
  state.page = next;
  loadTasks();
}

/** 把当前 chips 与草稿合并成 OR 的 keyword 字符串（用于 URL 参数）。 */
function buildSearchKeyword(){
  const parts = state.titleChips.map(c => c.title).filter(Boolean);
  const draft = (state.titleDraft || "").trim();
  if (draft) parts.push(draft);
  // 去重（保持原顺序）
  const seen = new Set(); const out = [];
  for (const p of parts){ if (!seen.has(p)) { seen.add(p); out.push(p); } }
  return out.join("|");
}

/** 触发一次任务匹配（点查询按钮 / 选中候选后回车 / 草稿回车）。 */
async function onChipSearch(){
  closeTitleMenu();
  state.titleDraft = "";
  const input = document.getElementById("titleSearch");
  if (input) input.value = "";

/** 清除所有 chips + 草稿，重新加载全量。 */
async function clearTitleSearch(){
  state.titleChips = [];
  state.titleDraft = "";
  state.titleCandidates = [];
  state.titleIdx = -1;
  // 清空 input DOM（包括屏幕上看不到、但 value 残留的字符）
  const input = document.getElementById("titleSearch");
  if (input){
    input.value = "";
    // 主动派发 input 事件，让 onTitleInputChange 等任何监听者重新计算 has-value 等样式
    input.dispatchEvent(new Event("input", {bubbles: true}));
  }
  renderChips();           // 把 DOM 里的 chip 元素也实际移除（之前漏了，state 清了 DOM 还在）
  closeTitleMenu();
  updateChipSearchState();
  state.page = 0; state.expanded.clear(); state.commentsCache = {};
  await loadTasks();
}

/** 移除指定 chip（按 id），同时清掉输入框里的草稿并刷新表格。 */
function removeChip(taskId){
  state.titleChips = state.titleChips.filter(c => c.task_id !== taskId);
  state.titleDraft = "";
  const input = document.getElementById("titleSearch");
  if (input){
    input.value = "";
    input.dispatchEvent(new Event("input", {bubbles: true}));
  }
  renderChips();
  updateChipSearchState();
  // 移除一个 chip 后，剩余 chips 仍作为筛选条件，让表格立刻反映新过滤集
  state.page = 0; state.expanded.clear(); state.commentsCache = {};

/** 渲染 chips 区。 */
function renderChips(){
  const area = document.getElementById("chipArea");
  area.innerHTML = "";
  state.titleChips.forEach(chip => {
    const el = document.createElement("span");
    el.className = "chip";
    el.title = (chip.project_name ? `【${chip.project_name}】 ` : "") + chip.title
              + (chip.identifier ? `（${chip.identifier}）` : "");
    const meta = chip.project_name
      ? `<span class="chip-meta">${escapeHtml(chip.project_name)}</span>` : "";
    el.innerHTML = meta + escapeHtml(chip.title)
      + `<button class="chip-close" title="移除" data-id="${escapeHtml(chip.task_id)}">×</button>`;
    el.querySelector(".chip-close").addEventListener("click", (e) => {

/** 输入框变化：保存草稿、防抖触发候选请求。 */
function onTitleInputChange(){

  updateChipSearchState();

  const q = state.titleDraft.trim();

    closeTitleMenu();
    return;

  state.titleDebounceTimer = setTimeout(fetchTitleCandidates, state.titleDebounceMs);

async function fetchTitleCandidates(){
  const q = state.titleDraft.trim();
  if (!q || !state.projectId){ closeTitleMenu(); return; }
  try {
    const data = await api(`/api/task_titles?project_id=${encodeURIComponent(state.projectId)}`
      + `&q=${encodeURIComponent(q)}&limit=15`);
    state.titleCandidates = data.items || [];
    state.titleIdx = state.titleCandidates.length ? 0 : -1;
    openTitleMenu();   // 先显示 + 定位；空结果也会显示「没有匹配」提示，避免「什么都不弹」
    renderTitleMenu();
  } catch(e){
    console.error("fetchTitleCandidates failed:", e);
    closeTitleMenu();
  }
}

function renderTitleMenu(){
  const menu = document.getElementById("titleMenu");
  menu.innerHTML = "";
  // 浮层标题（始终显示，让用户知道这是「候选」不是「全局查询结果」）
  const title = document.createElement("div");
  title.className = "menu-title";
  const n = state.titleCandidates.length;
  title.innerHTML = `<span class="dot"></span>任务候选 · ${n ? n + " 项匹配" : "实时匹配"}
    <span style="flex:1"></span>
    <span style="font-size:11px;color:#94a3b8">输入即搜</span>`;
  menu.appendChild(title);
  if (!n){
    const empty = document.createElement("div");
    empty.className = "opt-empty";
    empty.textContent = "没有匹配的任务；直接按 Enter 会把当前草稿当关键字执行全局查询";
    menu.appendChild(empty);
  } else {
    state.titleCandidates.forEach((cand, i) => {
      const div = document.createElement("div");
      div.className = "opt" + (i === state.titleIdx ? " highlighted" : "");
      div.dataset.idx = String(i);
      const titleHtml = highlightInline(cand.title || "", state.titleDraft);
      const meta = (cand.project_name ? `【${cand.project_name}】` : "")
        + (cand.identifier ? ` · ${cand.identifier}` : "");
      div.innerHTML =
        `<div>${titleHtml}</div>`
        + (meta ? `<div class="opt-meta">${escapeHtml(meta)}</div>` : "");
      div.addEventListener("mouseenter", () => {
        state.titleIdx = i; updateTitleHighlight();
      });
      div.addEventListener("mousedown", (e) => {
        // 用 mousedown 避免 input blur 先触发、菜单先关闭
        e.preventDefault();
        pickTitleCandidate(i);
      });
      menu.appendChild(div);
    });
  }
  // 底部使用提示
  const hint = document.createElement("div");
  hint.className = "menu-hint";
  hint.textContent = "↑↓ 选择 · Enter 加入查询 · Esc 关闭";
  menu.appendChild(hint);
}

function updateTitleHighlight(){
  const items = document.querySelectorAll("#titleMenu .opt");
  items.forEach((el, i) => el.classList.toggle("highlighted", i === state.titleIdx));
}

/** 在输入框下方/候选列表里给命中关键字加高亮（先转义再包标签）。 */
function highlightInline(text, kw){
  const safe = escapeHtml(text);
  const q = (kw || "").trim();
  if (!q) return safe;
  const lowerText = text.toLowerCase();
  const lowerQ = q.toLowerCase();
  let out = "";
  let i = 0, idx;
  while ((idx = lowerText.indexOf(lowerQ, i)) !== -1){
    // 由于 safe 是转义后的，索引仍然按原字符算（escapeHtml 不增删字符）
    out += safe.slice(i, idx);
    out += '<span class="hl">' + safe.slice(idx, idx + q.length) + '</span>';
    i = idx + q.length;
  }
  out += safe.slice(i);
  return out;
}

/** 从候选中选一项加入 chip（重复任务不重复加）。 */
async function pickTitleCandidate(idx){
  const cand = state.titleCandidates[idx];
  if (!cand) return;
  if (!state.titleChips.some(c => c.task_id === cand.task_id)){
    state.titleChips.push({
      task_id: cand.task_id,
      identifier: cand.identifier,
      title: cand.title,
      project_name: cand.project_name,
    });
  }
  // 选中后清掉输入框和草稿，让用户继续添加
  state.titleDraft = "";
  const input = document.getElementById("titleSearch");
  if (input) input.value = "";
  closeTitleMenu();
  renderChips();
  updateChipSearchState();
  // 让输入框聚焦，保持流畅添加
  if (input) input.focus();
}

/** 输入框键盘事件：↑↓ Enter Esc。 */
function onTitleKey(e){
  const menu = document.getElementById("titleMenu");
  if (e.key === "ArrowDown"){
    if (menu.hidden && state.titleDraft.trim()) fetchTitleCandidates();
    if (!state.titleCandidates.length) return;
    state.titleIdx = Math.min(state.titleIdx + 1, state.titleCandidates.length - 1);
    updateTitleHighlight();
    const el = menu.querySelector(".opt.highlighted");
    if (el) el.scrollIntoView({block:"nearest"});
    e.preventDefault();
  } else if (e.key === "ArrowUp"){
    if (!state.titleCandidates.length) return;
    state.titleIdx = Math.max(state.titleIdx - 1, 0);
    updateTitleHighlight();
    const el = menu.querySelector(".opt.highlighted");
    if (el) el.scrollIntoView({block:"nearest"});
    e.preventDefault();
  } else if (e.key === "Enter"){
    e.preventDefault();
    if (!menu.hidden && state.titleIdx >= 0 && state.titleCandidates[state.titleIdx]){
      pickTitleCandidate(state.titleIdx);
    } else {
      // 无选中候选：把当前草稿当 keyword 触发查询
      onChipSearch();
    }
  } else if (e.key === "Escape"){
    if (!menu.hidden){ closeTitleMenu(); e.preventDefault(); }
  }
}

function initTitleSearch(){
  const input = document.getElementById("titleSearch");
  const wrap = document.getElementById("chipSearch");
  input.addEventListener("input", onTitleInputChange);
  input.addEventListener("keydown", onTitleKey);
  input.addEventListener("focus", () => {
    // 只要草稿非空就拉一次候选，确保用户重新聚焦也能看到结果
    if (state.titleDraft.trim()) fetchTitleCandidates();
  });
  // 点击外部关闭菜单
  document.addEventListener("click", (e) => {
    if (!wrap.contains(e.target)) closeTitleMenu();
  });
  // fixed 浮层需要跟随滚动/缩放/窗口变化重新对齐（否则会跑位）
  const reposition = () => {
    const menu = document.getElementById("titleMenu");
    if (menu && !menu.hidden) positionMenuUnder(menu, input);
  };
  window.addEventListener("scroll", reposition, true);
  window.addEventListener("resize", reposition);
  renderChips();
  updateChipSearchState();
}

initTitleSearch();

/* ====================== 列设置弹窗 ====================== */

/** 打开弹窗：渲染列设置列表。 */
function openColumnSettings(){
  const ul = document.getElementById("colSettingsList");
  ul.innerHTML = "";
  // 按当前 colOrder 顺序渲染（proj 永远在最上面作为锚定）
  state.colOrder.forEach((key, idx) => {
    ul.appendChild(buildColumnSettingRow(key, idx));
  });
  document.getElementById("colModalMask").classList.remove("hidden");
  bindColumnRowDrag();
}
function closeColumnSettings(){
  document.getElementById("colModalMask").classList.add("hidden");
}
/** 点遮罩层关闭（但点 modal 卡片内部不会冒泡到 mask）。 */
function onColModalMaskClick(e){
  if (e.target.id === "colModalMask") closeColumnSettings();
}

/** 重置列设置：清空所有用户改动，回 6 列全显 + 默认顺序 + 默认宽度 + 默认模式。 */
function resetColumnSettings(){
  state.colOrder = [...DEFAULT_COL_ORDER];
  for (const c of COLS_META) state.colVisible[c.key] = true;
  state.colModes = { ...DEFAULT_COL_MODES };
  state.colModes["proj"] = "fixed";   // 锚定列永远固定
  state.colWidths = {};
  saveColumnConfig();
  saveColumnWidths();
  // 重新渲染弹窗列表（让 UI 与默认状态一致）
  openColumnSettings();
  // 重新渲染主表格（应用默认列宽 + 默认列集合 + 默认模式）
  applyColumnConfig();
}

/** 创建弹窗里的一行（li.col-row）。 */
function buildColumnSettingRow(key, idx){
  const meta = COLS_META.find(m => m.key === key);
  const li = document.createElement("li");
  li.className = "col-row" + (meta.anchor ? " anchor" : "");
  li.dataset.key = key;
  li.dataset.originalIdx = String(idx);
  if (!state.colVisible[key]) li.classList.add("is-hidden");

  // 拖拽手柄（anchored 行 disable 视觉）
  const handle = document.createElement("span");
  handle.className = "drag-handle";
  handle.textContent = "⋮⋮";
  if (meta.anchor) handle.setAttribute("aria-disabled", "true");

  // 复选框（anchor 行 disabled）
  const cb = document.createElement("input");
  cb.type = "checkbox";
  cb.checked = state.colVisible[key];
  cb.disabled = !!meta.anchor;
  cb.addEventListener("change", () => {
    state.colVisible[key] = cb.checked;
    li.classList.toggle("is-hidden", !cb.checked);
    applyColumnConfig();
  });

  // 列名
  const label = document.createElement("span");
  label.className = "col-label";
  label.textContent = meta.label;

  // 锚定标签
  const tag = meta.anchor ? document.createElement("span") : null;
  if (tag){
    tag.className = "col-tag";
    tag.textContent = "固定";
    tag.title = "项目名称列用于分组合并，固定为第 1 列且不可隐藏";
  }

  // 模式切换器：固定（可拖拽调宽）/ 自适应（按内容计算）
  const modeSwitch = document.createElement("div");
  modeSwitch.className = "mode-switch";
  const curMode = state.colModes[key] || meta.mode || "auto";
  // 锚定列：永远固定，禁用切换
  const switchDisabled = !!meta.anchor;
  for (const mode of ["fixed", "auto"]){
    const opt = document.createElement("label");
    opt.className = "mode-opt" + (mode === curMode ? " active" : "");
    opt.dataset.mode = mode;
    opt.title = mode === "fixed"
      ? "固定列宽：可拖拽表头右侧手柄手动调节"
      : "自适应列宽：按当前内容自动算列宽";
    if (switchDisabled) opt.classList.add("disabled");
    const radio = document.createElement("input");
    radio.type = "radio";
    radio.name = `colmode-${key}`;
    radio.value = mode;
    radio.checked = (mode === curMode);
    radio.disabled = switchDisabled;
    opt.appendChild(radio);
    const text = document.createElement("span");
    text.textContent = mode === "fixed" ? "固定" : "自适应";
    opt.appendChild(text);
    opt.addEventListener("click", e => {
      if (switchDisabled){ e.preventDefault(); return; }
      if (state.colModes[key] === mode) return;
      state.colModes[key] = mode;
      // 更新 group 内的 active 状态
      modeSwitch.querySelectorAll(".mode-opt").forEach(o => {
        o.classList.toggle("active", o.dataset.mode === mode);
      });
      applyColumnConfig();
    });
    modeSwitch.appendChild(opt);
  }

  li.appendChild(handle);
  li.appendChild(cb);
  li.appendChild(label);
  if (tag) li.appendChild(tag);
  li.appendChild(modeSwitch);
  return li;
}

/* -------- 弹窗内拖拽排序实现 -------- */
let _colRowDrag = null;   // { srcLi, startY, srcRect }
function bindColumnRowDrag(){
  const list = document.getElementById("colSettingsList");
  // 解绑老监听（避免重复绑定）：直接 cloneNode 替换 element
  // 但保留 children 状态复杂，更稳妥做法是用一组 flag 标记，仅首次绑定。
  if (list.dataset.dragBound === "1") return;
  list.dataset.dragBound = "1";

  // 计算当前 hover 位置（目标 li 上半 / 下半）
  const computeHoverTarget = (clientY) => {
    const items = [...list.querySelectorAll(".col-row:not(.dragging)")];
    for (const el of items){
      const r = el.getBoundingClientRect();
      if (clientY < r.top + r.height / 2){
        return { el, side: "top" };
      }
    }
    if (items.length){
      return { el: items[items.length - 1], side: "bot" };
    }
    return { el: null, side: null };
  };

  list.addEventListener("mousedown", e => {
    const handle = e.target.closest(".drag-handle");
    if (!handle) return;
    const li = handle.closest(".col-row");
    if (!li || li.classList.contains("anchor")) return;   // 锚定行不可拖
    if (e.button !== 0) return;
    e.preventDefault();
    _colRowDrag = {
      srcLi: li,
      startY: e.clientY,
      srcRect: li.getBoundingClientRect(),
    };
    li.classList.add("dragging");
    document.body.classList.add("col-resizing");   // 复用全局禁选样式（避免选词）
  });

  document.addEventListener("mousemove", e => {
    if (!_colRowDrag) return;
    // 清除所有高亮
    list.querySelectorAll(".col-row").forEach(r => {
      r.classList.remove("drag-over-top", "drag-over-bot");
    });
    const { el, side } = computeHoverTarget(e.clientY);
    if (el && el !== _colRowDrag.srcLi){
      // 禁止越过 anchor 行：anchor 行的上方永远不能插入
      if (el.classList.contains("anchor")){
        if (side === "top") return;   // 试图放到 anchor 上方 → 不响应
      }
      el.classList.add(side === "top" ? "drag-over-top" : "drag-over-bot");
    }
  });

  document.addEventListener("mouseup", e => {
    if (!_colRowDrag) return;
    const { srcLi } = _colRowDrag;
    const { el, side } = computeHoverTarget(e.clientY);
    // 清理高亮
    list.querySelectorAll(".col-row").forEach(r => {
      r.classList.remove("drag-over-top", "drag-over-bot");
    });
    srcLi.classList.remove("dragging");
    document.body.classList.remove("col-resizing");

    // 真正的 DOM 重排 + state 更新
    if (el && el !== srcLi){
      // 若目标在 anchor 行上方，禁止
      if (el.classList.contains("anchor") && side === "top"){
        _colRowDrag = null;
        return;
      }
      if (side === "top") el.parentNode.insertBefore(srcLi, el);
      else el.parentNode.insertBefore(srcLi, el.nextSibling);
      // 同步 state.colOrder
      const newOrder = [...list.querySelectorAll(".col-row")].map(r => r.dataset.key);
      state.colOrder = newOrder;
      applyColumnConfig();
    }
    _colRowDrag = null;
  });
}
</script>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Worktile 任务评论区看板</title>
<style>
  :root {
    --bg: #f5f7fa;
    --panel: #ffffff;
    --text: #1f2937;
    --muted: #6b7280;
    --border: #e5e7eb;
    --accent: #2563eb;
    --accent-soft: #eff6ff;
    --danger: #dc2626;
    --tag-img-bg: #fef3c7;
    --tag-img-fg: #92400e;
    --tag-file-bg: #e0e7ff;
    --tag-file-fg: #3730a3;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    line-height: 1.5;
  }
  .wrap { max-width: 1200px; margin: 0 auto; padding: 24px; }

  /* ---------- 登录页 ---------- */
  .login-card {
    max-width: 420px; margin: 12vh auto; background: var(--panel);
    border: 1px solid var(--border); border-radius: 12px; padding: 32px;
    box-shadow: 0 4px 20px rgba(0,0,0,.06);
  }
  .login-card h1 { font-size: 20px; margin: 0 0 6px; }
  .login-card p.sub { color: var(--muted); margin: 0 0 24px; }
  label.field { display: block; margin-bottom: 16px; }
  label.field span { display: block; margin-bottom: 6px; font-weight: 600; }
  input[type=text], input[type=password], select {
    width: 100%; padding: 10px 12px; border: 1px solid var(--border);
    border-radius: 8px; font-size: 14px; background: #fff; color: var(--text);
  }
  input:focus, select:focus { outline: none; border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft); }
  button {
    cursor: pointer; border: none; border-radius: 8px; font-size: 14px;
    padding: 10px 16px; background: var(--accent); color: #fff; font-weight: 600;
  }
  button:hover { filter: brightness(1.05); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .btn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); }
  .alert { background: #fef2f2; color: var(--danger); border: 1px solid #fecaca;
    border-radius: 8px; padding: 10px 12px; margin-bottom: 16px; font-size: 13px; }

  /* ---------- 看板 ---------- */
  .topbar { display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    margin-bottom: 16px; }
  .topbar h2 { font-size: 18px; margin: 0; flex: 1; }
  .toolbar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    margin-bottom: 16px; }
  .toolbar .group { display: flex; align-items: center; gap: 6px; }
  .toolbar select { width: auto; padding: 8px 10px; }

  /* 搜索式项目选择器 */
  .search-select { position: relative; display: inline-block; min-width: 220px; }
  .search-select input {
    width: 100%; padding: 8px 28px 8px 10px; border: 1px solid var(--border);
    border-radius: 8px; font-size: 14px; background: #fff; color: var(--text);
    cursor: pointer;
  }
  .search-select input:focus { outline: none; border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft); }
  .search-select .caret {
    position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
    pointer-events: none; color: var(--muted); font-size: 12px;
  }
  .search-select-menu {
    position: absolute; top: calc(100% + 4px); left: 0; right: 0; max-height: 280px;
    overflow-y: auto; background: var(--panel); border: 1px solid var(--border);
    border-radius: 8px; box-shadow: 0 4px 12px rgba(0,0,0,.08); z-index: 100;
  }
  .search-select-menu .opt {
    padding: 8px 12px; cursor: pointer; font-size: 14px; color: var(--text);
    border-bottom: 1px solid #f3f4f6;
  }
  .search-select-menu .opt:last-child { border-bottom: none; }
  .search-select-menu .opt:hover,
  .search-select-menu .opt.highlighted { background: var(--accent-soft); }
  .search-select-menu .opt.selected { font-weight: 600; color: var(--accent); }
  .search-select-menu .opt .hl {
    background: #fff3a0; color: #333; border-radius: 2px; padding: 0 1px;
  }
  .search-select-menu .opt-meta { font-size: 12px; color: var(--muted); margin-left: 6px; }
  .search-select-menu .opt-empty {
    padding: 14px; color: var(--muted); text-align: center; font-size: 13px;
  }

  /* 任务名称模糊搜索框 */
  .chip-search {
    position: relative; display: inline-flex; flex-wrap: wrap; align-items: center;
    gap: 6px; min-width: 320px; max-width: 580px;
    padding: 6px 8px; border: 1px solid var(--border); border-radius: 8px;
    background: #fff; color: var(--text);
  }
  .chip-search:focus-within { border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft); }
  .chip-area { display: contents; }   /* 让 chip 直接参与父容器 flex 排列 */
  .chip {
    display: inline-flex; align-items: center; gap: 4px; max-width: 220px;
    padding: 3px 4px 3px 8px; background: var(--accent-soft);
    border: 1px solid #bfdbfe; border-radius: 14px;
    font-size: 12.5px; color: #1e40af; line-height: 1.3;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .chip .chip-meta {
    color: #64748b; margin-right: 2px; max-width: 80px;
    overflow: hidden; text-overflow: ellipsis;
  }
  .chip .chip-close {
    border: none; background: transparent; color: #475569;
    width: 18px; height: 18px; line-height: 16px; text-align: center;
    border-radius: 50%; padding: 0; font-size: 14px; cursor: pointer;
  }
  .chip .chip-close:hover { background: rgba(0,0,0,.08); }
  .chip-search .search-input { position: relative; display: inline-flex; align-items: center; flex: 1; min-width: 160px; }
  .chip-search .search-input input {
    flex: 1; min-width: 140px; padding: 4px 26px 4px 6px;
    border: none; outline: none; background: transparent;
    font-size: 14px; color: var(--text);
  }
  .chip-search .search-clear {
    position: absolute; right: 4px; top: 50%; transform: translateY(-50%);
    width: 18px; height: 18px; line-height: 16px; text-align: center;
    border: none; background: #e5e7eb; color: #475569; border-radius: 50%;
    font-size: 14px; padding: 0; cursor: pointer; display: none;
  }
  .chip-search .search-clear:hover { background: #d1d5db; }
  .chip-search.has-value .search-clear { display: block; }
  .chip-search .search-go {
    padding: 5px 12px; font-size: 13px; line-height: 1;
  }

  /* 任务名称命中关键词高亮 */
  td.cell-title .hl {
    background: #fff3a0; color: #333; border-radius: 2px; padding: 0 1px;
  }
  .search-banner {
    margin-bottom: 12px; padding: 9px 14px;
    background: var(--accent-soft); border: 1px solid #bfdbfe;
    border-radius: 8px; font-size: 13px; color: #1e40af;
  }
  .search-banner b { color: #1d4ed8; }

  table { width: 100%; border-collapse: collapse; background: var(--panel);
    border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  /* 项目卡片内的表格：固定列宽，所有卡片共用同一套宽度 */
  table.proj-table { table-layout: fixed; }
  table.proj-table th, table.proj-table td {
    overflow-wrap: anywhere; word-break: break-all; /* 长字段自动换行 */
  }
  th, td { text-align: left; padding: 12px 14px; border-bottom: 1px solid var(--border);
    vertical-align: top; }
  th { background: #f9fafb; font-weight: 600; color: var(--muted); font-size: 13px; }
  tbody tr.task-row:hover { background: var(--accent-soft); }
  /* 项目名称合并单元格（Excel 跨行合并风格） */
  /* 每个项目一个独立 <table>，外加 .proj-block 分组卡片 */
  .proj-block {
    margin-bottom: 16px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
  }
  .proj-block:last-child { margin-bottom: 0; }
  .proj-block table { border: none; border-radius: 0; }   /* 让卡片自带的边框生效 */
  td.proj-cell {
    background: #eef4ff;            /* 浅蓝底，明显区别于白底任务行 */
    vertical-align: top;             /* 顶对齐：长项目名时保持从顶端开始阅读 */
    font-weight: 700; font-size: 15px;
    color: #1e3a8a;
    line-height: 1.4;
    /* 四周都有边框，让合并区域边界清晰 */
    border-top: 2px solid #93c5fd;
    border-bottom: 2px solid #93c5fd;
    border-left: 2px solid #93c5fd;
    border-right: 2px solid #2563eb;  /* 右侧加重，做"分栏线" */
    padding: 12px 14px;
    /* 注意：不要对 td 用 position: sticky，Chrome/Safari 对 td 的 sticky
       支持不完善，会让同一列的合并单元格错位呈现"嵌套"假象 */
  }
  td.proj-cell .proj-name {
    /* 让长项目名在 160px 列内自动换行，不会撑爆单元格 */
    overflow-wrap: anywhere;
    word-break: break-all;
    display: block;
  }
  td.proj-cell .proj-count {
    display: block; margin-top: 6px;       /* 任务数独占一行，更像 Excel 标签 */
    font-weight: 500; font-size: 12px;
    color: #475569;
  }
  /* 任务名称：可点击跳转 Worktile 任务详情页（新标签页） */
  td.cell-title a {
    color: var(--accent); text-decoration: none; font-weight: 600;
  }
  td.cell-title a:hover { text-decoration: underline; }
  .muted { color: var(--muted); }

  /* 任务行内的评论列：紧凑堆叠多条评论 */
  td.cell-comments { vertical-align: top; }
  td.cell-comments .comments-inner { padding: 0; }
  .comment-block {
    border-left: 3px solid var(--accent-soft);
    padding: 6px 10px;
    margin-bottom: 8px;
    background: #fbfcfe;
    border-radius: 0 6px 6px 0;
  }
  .comment-block:last-child { margin-bottom: 0; }
  .comment-block .meta {
    font-size: 12px; color: var(--muted); margin-bottom: 3px;
  }
  .comment-block .meta b { color: var(--text); margin-right: 4px; }
  .comment-block .body.emoji-only {
    font-size: 28px; line-height: 1.2;
    padding: 4px 0 2px;
  }
  .comment-block .body {
    font-size: 13px; line-height: 1.5;
    word-break: break-word;
  }
  /* 评论正文段落换行 */
  .comment-block .body p { margin: 0 0 6px; line-height: 1.55; word-break: break-word; }
  .comment-block .body p:last-child { margin-bottom: 0; }
  /* 行内 code（含 markdown `code`） */
  .comment-block .body code:not(pre code) {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    background: #f1f5f9; color: #0f172a;
    padding: 1px 5px; border-radius: 3px;
    border: 1px solid #e2e8f0;
    font-size: 12.5px; word-break: break-all;
  }
  /* 代码块（``` ``` 包裹 / 启发式 shell 段） */
  .comment-block .body pre.code-block {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    background: #0f172a; color: #e2e8f0;
    padding: 10px 12px; border-radius: 6px;
    margin: 6px 0; overflow-x: auto;
    font-size: 12.5px; line-height: 1.55;
    white-space: pre; word-break: normal;
    border: 1px solid #1e293b;
  }
  .comment-block .body pre.code-block .lang {
    display: block;
    color: #64748b; font-size: 11px;
    margin-bottom: 6px; letter-spacing: .05em;
    text-transform: uppercase; user-select: none;
  }
  .comment-block .atts {
    margin-top: 6px;
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  /* 图片附件：垂直卡片（缩略图上 + 文件名下），长文件名自动换行 */
  .comment-block .att.img-type {
    display: inline-flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 4px;
    padding: 4px;
    max-width: 200px;
    background: #ecfeff;
    color: #155e75;
    border: 1px solid #a5f3fc;
    border-radius: 4px;
    font-size: 12px;
  }
  /* 文件附件：链接，长文件名自动换行 */
  .comment-block .att.file-type {
    display: inline-flex;
    align-items: flex-start;
    padding: 4px 8px;
    max-width: 240px;
    background: #f1f5f9;
    color: #334155;
    border: 1px solid #cbd5e1;
    border-radius: 4px;
    font-size: 12px;
    text-decoration: none;
    word-break: break-all;
  }
  .comment-block .att.file-type:hover { background: #e2e8f0; }
  /* 文件名：自动换行 */
  .comment-block .att .fname {
    font-weight: 500;
    display: block;
    width: 100%;
    word-break: break-all;
    line-height: 1.4;
  }
  /* 图片缩略图：可点击放大，宽度在父容器内自适应 */
  .att-thumb {
    display: block;
    max-width: 100%;
    max-height: 92px;
    width: auto; height: auto;
    border-radius: 4px;
    border: 1px solid #cbd5e1;
    object-fit: cover;
    cursor: zoom-in;
  }
  /* 图片放大遮罩层 */
  #lightbox {
    position: fixed; inset: 0; z-index: 9999;
    display: none;
    align-items: center; justify-content: center;
    background: rgba(15, 23, 42, 0.82);
    cursor: zoom-out;
  }
  #lightbox.active { display: flex; }
  #lightbox img {
    max-width: 92vw; max-height: 92vh;
    object-fit: contain;
    border-radius: 6px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.5);
  }
  .cell-loading, .cell-empty, .cell-error {
    font-size: 12px; color: var(--muted); padding: 6px 0;
  }
  .cell-error { color: #b91c1c; }
  .comment .empty { color: var(--muted); font-style: italic; }
  .loading { padding: 24px; text-align: center; color: var(--muted); }
  .loading.error { color: var(--danger); background: #fef2f2; border-radius: 6px; border: 1px solid #fecaca; }
  .error-hint { margin-top: 8px; font-size: 12px; color: var(--muted); }

  /* 分页 */
  .pager { display: flex; align-items: center; justify-content: center;
    gap: 12px; flex-wrap: wrap; margin-top: 18px; margin-bottom: 8px; }
  .pager .info { color: var(--muted); }
  .pager select { padding: 7px 10px; }
  .pager .page-jump { display: inline-flex; align-items: center; gap: 6px;
    font-size: 13px; color: var(--muted); }
  .pager .page-input {
    width: 56px; padding: 6px 8px; text-align: center;
    border: 1px solid #cbd5e1; border-radius: 4px; font-size: 13px;
    background: #fff;
  }
  .pager .page-input:focus { outline: none;
    border-color: #3b82f6; box-shadow: 0 0 0 2px rgba(59,130,246,0.15); }
  .pager .page-input:disabled { background: #f1f5f9; color: #94a3b8; }
  .hidden { display: none; }
</style>
</head>
<body>
<div class="wrap">

  <!-- 登录页 -->
  <div id="loginView">
    <div class="login-card">
      <h1>Worktile 任务评论区看板</h1>
      <p class="sub">输入租户的 Client ID 与 Client Secret 即可查看对应数据（公有云）</p>
      <div id="loginAlert" class="alert hidden"></div>
      <label class="field">
        <span>Client ID</span>
        <input type="text" id="clientId" placeholder="请输入 Client ID" autocomplete="off">
      </label>
      <label class="field">
        <span>Client Secret</span>
        <input type="password" id="clientSecret" placeholder="请输入 Client Secret" autocomplete="off">
      </label>
      <label class="field">
        <span>Worktile 域名（用于跳转任务详情页）</span>
        <input type="text" id="tenantInput" value="techwll.worktile.com"
               placeholder="如 techwll.worktile.com" autocomplete="off" spellcheck="false">
      </label>
      <button id="loginBtn" style="width:100%" onclick="doLogin()">进入看板</button>
    </div>
  </div>

  <!-- 看板页 -->
  <div id="boardView" class="hidden">
    <div class="topbar">
      <h2>任务评论区看板</h2>
      <button class="btn-ghost" onclick="doLogout()">退出登录</button>
    </div>

    <div class="toolbar">
      <div class="group">
        <span class="muted">项目：</span>
        <div class="search-select" id="projectPicker">
          <input type="text" id="projectInput" placeholder="搜索或选择项目…" autocomplete="off" spellcheck="false">
          <span class="caret">▾</span>
          <div class="search-select-menu" id="projectMenu" hidden></div>
        </div>
      </div>
      <div class="group">
        <span class="muted">每页</span>
        <select id="pageSize" onchange="onPageSizeChange()">
          {% for opt in page_size_options %}
          <option value="{{ opt }}" {% if opt == 50 %}selected{% endif %}>{{ opt }}</option>
          {% endfor %}
        </select>
        <span class="muted">条</span>
      </div>
      <div class="group">
        <span class="muted">任务名称</span>
        <div class="chip-search" id="chipSearch">
          <div class="chip-area" id="chipArea"></div>
          <div class="search-input" id="titleSearchWrap">
            <input type="text" id="titleSearch" placeholder="输入关键字，从候选中选择…" autocomplete="off" spellcheck="false">
            <button id="titleClear" class="search-clear" title="清除全部" onclick="clearTitleSearch()">×</button>
          </div>
          <button id="titleSearchBtn" class="btn-ghost search-go" onclick="onChipSearch()">查询</button>
          <div class="search-select-menu" id="titleMenu" hidden></div>
        </div>
      </div>
      <button id="refreshBtn" class="btn-ghost" onclick="refreshAll()" title="重新拉取任务列表与评论">刷新</button>
    </div>

    <div id="tableArea"></div>

    <div class="pager" id="pager"></div>
  </div>

</div>

<script>
const state = {
  projectId: "__all__",
  projectName: "全部项目",
  projects: [],       // 项目列表缓存（来自 /api/projects）
  tenantHost: "techwll.worktile.com",  // 任务详情页跳转用的租户域名（来自 /api/me 或登录响应）
  // 任务名称搜索：typeahead + 多选 chip + OR 查询
  titleChips: [],         // 已选 chip 列表（每项 {task_id, identifier, title, project_name}）
  titleDraft: "",         // 输入框当前草稿（未选中前）
  titleCandidates: [],    // 当前候选列表（typeahead）
  titleIdx: -1,           // 候选下拉键盘高亮下标
  titleDebounceTimer: null,
  titleDebounceMs: 300,
  page: 0,
  pageSize: 50,
  total: null,
  hasMore: false,
  expanded: new Set(),
  commentsCache: {},   // taskId -> comments array
};

function show(el){ document.getElementById(el).classList.remove("hidden"); }
function hide(el){ document.getElementById(el).classList.add("hidden"); }

async function api(path, opts){
  const resp = await fetch(path, Object.assign({credentials:"same-origin"}, opts));
  let data = null;
  try { data = await resp.json(); } catch(e){}
  if (resp.status === 401){
    // 会话失效，回到登录页
    hide("boardView"); show("loginView");
    throw new Error("会话已失效，请重新登录");
  }
  if (!resp.ok || (data && data.ok === false)){
    throw new Error((data && data.error) || ("请求失败：" + resp.status));
  }
  return data;
}

async function doLogin(){
  const btn = document.getElementById("loginBtn");
  const alert = document.getElementById("loginAlert");
  alert.classList.add("hidden");
  const clientId = document.getElementById("clientId").value.trim();
  const clientSecret = document.getElementById("clientSecret").value.trim();
  if (!clientId || !clientSecret){
    alert.textContent = "Client ID 和 Client Secret 均不能为空";
    alert.classList.remove("hidden");
    return;
  }
  btn.disabled = true; btn.textContent = "验证中…";
  try {
    const r = await api("/api/login", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({
        client_id: clientId,
        client_secret: clientSecret,
        tenant: document.getElementById("tenantInput").value.trim()
      })
    });
    if (r.tenant_host) state.tenantHost = r.tenant_host;
    hide("loginView"); show("boardView");
    await loadProjects();
  } catch(e){
    alert.textContent = e.message;
    alert.classList.remove("hidden");
  } finally {
    btn.disabled = false; btn.textContent = "进入看板";
  }
}

async function doLogout(){
  try { await api("/api/logout", {method:"POST"}); } catch(e){}
  state.expanded.clear(); state.commentsCache = {};
  hide("boardView"); show("loginView");
  document.getElementById("clientSecret").value = "";
}

async function loadProjects(){
  const data = await api("/api/projects");
  state.projects = data.projects || [];
  renderProjectMenu("");
  if (data.projects && data.projects.length){
    selectProject("__all__", "全部项目");
  } else if (data.error){
    document.getElementById("tableArea").innerHTML =
      '<div class="loading error">加载项目失败：' + escapeHtml(data.error) +
      '<div class="error-hint">请检查网络代理是否能访问 Worktile 服务器（沙箱出网代理可能会拦截）。</div></div>';
  } else {
    document.getElementById("tableArea").innerHTML =
      '<div class="loading">该租户下没有可用的项目</div>';
  }
}

function selectProject(id, name){
  state.projectId = id;
  state.projectName = name;
  closeProjectMenu();
  // 切换项目时清空任务名称搜索（chips + 草稿），避免跨项目残留关键字造成困惑

let _pickerHighlighted = -1;

function initProjectPicker(){
  const input = document.getElementById("projectInput");

  input.addEventListener("focus", () => {

function openProjectMenu(){
  const input = document.getElementById("projectInput");
  // 若输入框当前显示的是已选项名，重新聚焦打开时不预填筛选
  renderProjectMenu(input.value === state.projectName ? "" : input.value);
  document.getElementById("projectMenu").hidden = false;
  _pickerHighlighted = -1;
}

function closeProjectMenu(){
  document.getElementById("projectMenu").hidden = true;
  document.getElementById("projectInput").value = state.projectName || "";
  _pickerHighlighted = -1;
}

function renderProjectMenu(filterText){
  const menu = document.getElementById("projectMenu");
  menu.innerHTML = "";
  const items = [{id:"__all__", name:"全部项目"}]
    .concat((state.projects || []).map(p => ({id: p.id, name: p.name})));
  const q = (filterText || "").trim().toLowerCase();
  const filtered = q
    ? items.filter(it => it.name.toLowerCase().includes(q))
    : items;
  if (!filtered.length){
    const empty = document.createElement("div");
    empty.className = "opt-empty";
    empty.textContent = "没有匹配的项目";
    menu.appendChild(empty);
    return;
  }
  filtered.forEach((it, idx) => {
    const div = document.createElement("div");
    div.className = "opt" + (it.id === state.projectId ? " selected" : "");
    div.dataset.id = it.id;
    if (q){
      const lower = it.name.toLowerCase();
      const pos = lower.indexOf(q);
      if (pos >= 0){
        div.innerHTML =
          escapeHtml(it.name.slice(0, pos)) +
          '<span class="hl">' + escapeHtml(it.name.slice(pos, pos + q.length)) + '</span>' +
          escapeHtml(it.name.slice(pos + q.length));
      } else {
        div.textContent = it.name;
      }
    } else {
      div.textContent = it.name;
    }
    div.addEventListener("click", () => selectProject(it.id, it.name));
    div.addEventListener("mouseenter", () => {
      _pickerHighlighted = idx;
      updatePickerHighlight();
    });
    menu.appendChild(div);
  });
}

function updatePickerHighlight(){
  const items = document.querySelectorAll("#projectMenu .opt");
  items.forEach((el, i) => el.classList.toggle("highlighted", i === _pickerHighlighted));
}

function scrollHighlightedIntoView(){
  const menu = document.getElementById("projectMenu");
  const el = menu.querySelector(".opt.highlighted");
  if (el) el.scrollIntoView({block:"nearest"});
}

function onProjectKey(e){
  const menu = document.getElementById("projectMenu");
  const input = document.getElementById("projectInput");
  if (e.key === "Escape"){
    closeProjectMenu();
    input.blur();
    e.preventDefault();
    return;
  }
  const items = Array.from(document.querySelectorAll("#projectMenu .opt"));
  if (e.key === "ArrowDown"){
    if (menu.hidden) openProjectMenu();
    _pickerHighlighted = Math.min(_pickerHighlighted + 1, Math.max(items.length - 1, 0));
    updatePickerHighlight();
    scrollHighlightedIntoView();
    e.preventDefault();
  } else if (e.key === "ArrowUp"){
    _pickerHighlighted = Math.max(_pickerHighlighted - 1, 0);
    updatePickerHighlight();
    scrollHighlightedIntoView();
    e.preventDefault();
  } else if (e.key === "Enter"){
    if (!menu.hidden && _pickerHighlighted >= 0 && items[_pickerHighlighted]){
      const it = items[_pickerHighlighted];
      selectProject(it.dataset.id, it.textContent.trim());
    }
    e.preventDefault();
  }
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);
}

/**
 * 拼接 Worktile 任务详情页 URL。
 * 规则（已用真实 URL 验证）：https://{tenant}/mission/projects/{project_id}/tasks/{task_id}
 * 缺少租户域名或 project_id/task_id 时返回 null（调用方降级为纯文本）。
 */
function buildTaskUrl(t){
  if (!state.tenantHost || !t.project_id || !t.task_id) return null;
  return "https://" + state.tenantHost
    + "/mission/projects/" + encodeURIComponent(t.project_id)
    + "/tasks/" + encodeURIComponent(t.task_id);
}

/** 任务名称渲染：可点击 → 新标签页打开 Worktile 任务详情；缺字段时降级为纯文本。 */
function buildTaskTitle(t){
  const url = buildTaskUrl(t);
  const title = highlightTitle(t.title || "");
  if (!url) return title;
  return `<a href="${url}" target="_blank" rel="noopener" `
    + `title="在新标签页打开 Worktile 任务详情">${title}</a>`;
}

/** 任务名称命中多个关键字（按 | 拆分）的部分加黄色高亮（先转义再包裹，避免 XSS/错位）。 */
function highlightTitle(title){
  const kw = (buildSearchKeyword() || "").trim().toLowerCase();
  if (!kw) return escapeHtml(title);
  const terms = kw.split("|").map(s => s.trim()).filter(Boolean);
  if (!terms.length) return escapeHtml(title);
  const lower = (title || "").toLowerCase();
  // 标记所有命中区间（按 | 拆分，任一匹配即高亮），然后按位置排序+合并重叠段
  const ranges = [];
  for (const t of terms){
    let i = 0, idx;
    while ((idx = lower.indexOf(t, i)) !== -1){
      ranges.push([idx, idx + t.length]);
      i = idx + t.length;
    }
  }
  if (!ranges.length) return escapeHtml(title);
  ranges.sort((a,b) => a[0]-b[0] || b[1]-a[1]);
  const merged = [];
  for (const r of ranges){
    const last = merged[merged.length - 1];
    if (last && r[0] <= last[1]) last[1] = Math.max(last[1], r[1]);
    else merged.push([r[0], r[1]]);
  }
  let out = "", i = 0;
  for (const [s, e] of merged){
    out += escapeHtml(title.slice(i, s));
    out += '<span class="hl">' + escapeHtml(title.slice(s, e)) + '</span>';
    i = e;
  }
  out += escapeHtml(title.slice(i));
  return out;
}

function renderTable(items){
  const area = document.getElementById("tableArea");
  if (!items.length){
    area.innerHTML = '<div class="loading">该项目下暂无任务</div>';
    return;
  }
  // 按项目名分组；每个项目渲染成独立的 <table>（外加 <div class="proj-block"> 做分组卡片）
  // 这样 proj 单元格的 rowspan 只在各自表内生效，不会跨组溢出造成"阶梯嵌套"假象
  const groups = [];
  for (const t of items){
    const key = t.project_name || "(未命名项目)";
    let g = groups[groups.length - 1];
    if (!g || g.name !== key){ g = {name: key, tasks: []}; groups.push(g); }
    g.tasks.push(t);
  }
  let html = '';
  groups.forEach(g => {
    // 任务数 * 2 = 该表总行数（任务行 + 评论明细行），作为 proj 单元格的 rowspan
    const span = g.tasks.length * 2;
    html += '<div class="proj-block">';
    // 统一的列宽定义：所有项目卡片共用同一套宽度，保证卡片间列宽一致
    // table-layout: fixed 会让 td 服从这里声明的列宽（不被内容撑爆）
    html += '<table class="proj-table">'
      + '<colgroup>'
      +   '<col style="width:160px">'
      +   '<col style="width:110px">'
      +   '<col>'                          <!-- 任务名称列：自动伸缩 -->
      +   '<col style="width:140px">'
      +   '<col style="width:160px">'
      +   '<col>'                          <!-- 评论列：自动伸缩，渲染评论内容 -->
      + '</colgroup>'
      + '<thead><tr>'
      + '<th>项目名称</th>'
      + '<th>任务编号</th><th>任务名称</th>'
      + '<th>任务负责人</th><th>最近更新时间</th><th>评论</th>'
      + '</tr></thead><tbody>';
    g.tasks.forEach((t, idx) => {
      const cached = state.commentsCache[t.task_id];
      const isFirst = idx === 0;
      // 评论列渲染策略：
      //   - 未拉取（undefined）：显示「加载评论中…」
      //   - 已拉取为空数组（[]）：显示「该任务暂无评论」
      //   - 已拉取有数据：直接堆叠渲染（按倒序，多条独立成块）
      let commentsHtml;
      if (cached === undefined){
        commentsHtml = '<div class="cell-loading">加载评论中…</div>';
      } else if (!cached.length){
        commentsHtml = '<div class="cell-empty">该任务暂无评论</div>';
      } else {
        commentsHtml = renderComments(cached);
      }
      // 合并跨度 = 项目任务数（详情行已去掉）
      const span = g.tasks.length;
      html += `<tr class="task-row" data-id="${escapeHtml(t.task_id)}">`;
      if (isFirst){
        html += `<td class="proj-cell" rowspan="${span}">`
          + `<span class="proj-name">${escapeHtml(g.name)}</span>`
          + `<span class="proj-count">共 ${g.tasks.length} 条</span>`
          + '</td>';
      }
      html += `<td class="cell-id">${escapeHtml(t.identifier || "-")}</td>`
        + `<td class="cell-title">${buildTaskTitle(t)}</td>`
        + `<td>${escapeHtml(t.assignee)}</td>`
        + `<td>${escapeHtml(t.updated_at_str)}</td>`
        + `<td class="cell-comments" data-comments="${escapeHtml(t.task_id)}">${commentsHtml}</td>`
        + '</tr>';
    });
    html += '</tbody></table></div>';
  });
  area.innerHTML = html;

  // 搜索命中提示横幅（仅在有搜索关键字时显示）
  const kw = buildSearchKeyword();
  if (kw){
    const banner = document.createElement("div");
    banner.className = "search-banner";
    const parts = kw.split("|").filter(Boolean);
    const chipsHtml = parts.map(p => `「<b>${escapeHtml(p)}</b>」`).join(" OR ");
    banner.innerHTML = `正在按任务名称筛选 ${chipsHtml}`
      + (state.total != null ? `，命中 ${state.total} 条` : "") + `。`;
    area.insertBefore(banner, area.firstChild);
  }

  // 首屏渲染后，并发拉取所有未缓存任务的评论（带并发限流，避免瞬时压垮 API）
  const pending = items.map(t => t.task_id).filter(id => state.commentsCache[id] === undefined);
  if (pending.length) prefetchComments(pending);
}

async function prefetchComments(taskIds){
  // 并发限流：每次最多 6 个并发请求
  const CONCURRENCY = 6;
  let i = 0;
  const workers = Array.from({length: Math.min(CONCURRENCY, taskIds.length)}, async () => {
    while (i < taskIds.length){
      const id = taskIds[i++];
      await loadComments(id);
    }
  });
  await Promise.all(workers);
}

async function loadComments(taskId){
  const cell = document.querySelector(`td.cell-comments[data-comments="${cssEscape(taskId)}"]`);
  if (!cell) return;
  try {

    state.commentsCache[taskId] = data.comments || [];
    cell.innerHTML = state.commentsCache[taskId].length
      ? renderComments(state.commentsCache[taskId])

    cell.innerHTML = `<div class="cell-error">${escapeHtml(e.message)}</div>`;

}

function renderComments(comments){

          + `rel="noopener" title="点击预览 / 下载">📄 <span class="fname">${name}</span></a>`;

    }).join("");
    // eslint-disable-next-line no-control-regex
  const EMOJI_ONLY = /^[\s\u200d\ufe0f]*([\p{Extended_Pictographic}\u200d\ufe0f]+[\s\u200d\ufe0f]*){1,6}$/u;
  const isEmojiOnly = (s) => typeof s === "string" && EMOJI_ONLY.test(s.trim());
  const bodyHtml = renderContent(c.content || "");
  const bodyCls = isEmojiOnly(c.content || "") ? "body emoji-only" : "body";
    return `<div class="comment-block">`

      + `<div class="${bodyCls}">${bodyHtml}</div>`

      + '</div>';
  }).join("") + '</div>';
}

/**
 * 把评论纯文本渲染成结构化 HTML：
 *  - ```lang\n...\n``` markdown 代码块 → <pre class="code-block">
 *  - 行内 `code` → <code>code</code>
 *  - 其他段落合并换行 → <p>...</p>
 */
function renderContent(text){
  if (!text) return "";
  // 1) 先抽出 ``` 代码块（避免后续行内 code / escape 影响它），用占位符替入
  const blocks = [];
  let s = escapeHtml(text).replace(
    /```([a-zA-Z0-9+_\-]*)[ \t]*\n([\s\S]*?)```/g,
    (_, lang, code) => {
      const idx = blocks.length;
      blocks.push({ lang: lang || "", code });
      return "\u0000CB" + idx + "\u0000";
    }
  );
  // 2) 行内 `code`
  s = s.replace(/`([^`\n]+)`/g, "<code>$1</code>");
  // 3) 按行处理：连续非空行合并成 <p>，占位符独立成 <pre>
  const lines = s.split("\n");
  const out = [];
  let para = [];
  const flush = () => {
    if (para.length) {
      out.push("<p>" + para.join("<br>") + "</p>");
      para = [];
    }
  };
  for (const line of lines){
    const m = line.match(/^\u0000CB(\d+)\u0000$/);
    if (m){
      flush();
      const b = blocks[+m[1]];
      const lang = b.lang ? `<span class="lang">${b.lang}</span>` : "";
      out.push(`<pre class="code-block">${lang}${b.code}</pre>`);
      continue;
    }
    para.push(line);
  }
  flush();
  return out.join("");
}

function renderPager(){
  const pager = document.getElementById("pager");
  const curr = state.page + 1;
  let totalHtml = "";
  let maxPage = null;

  if (state.total != null){
    maxPage = Math.max(1, Math.ceil(state.total / state.pageSize));
    totalHtml = `<span>共 ${state.total} 条</span>`;
  } else if (state.hasMore){
    totalHtml = `<span>第 ${curr} 页（还有更多）</span>`;
  } else {
    totalHtml = `<span>第 ${curr} 页</span>`;
  }

  const jumpHtml = (state.total != null) ? `
    <span class="page-jump">
      <span>前往</span>
      <input id="pageInput" class="page-input" type="number" min="1"
             max="${maxPage}" value="${curr}"
             onkeydown="if(event.key==='Enter'){gotoExactPage();}">
      <span>页 / 共 ${maxPage} 页</span>
    </span>` : `
    <span class="page-jump">
      <span>前往</span>
      <input id="pageInput" class="page-input" type="number" min="1"
             placeholder="-" disabled>
      <span>页</span>
    </span>`;

  pager.innerHTML = `
    <button id="prevBtn" ${state.page<=0?'disabled':''} onclick="gotoPage(-1)">上一页</button>
    ${totalHtml}
    ${jumpHtml}
    <button id="nextBtn" ${state.hasMore?'':'disabled'} onclick="gotoPage(1)">下一页</button>
  `;
}

function gotoExactPage(){
  if (state.total == null) return;
  const input = document.getElementById("pageInput");
  if (!input) return;
  let n = parseInt(input.value, 10);
  if (!Number.isFinite(n) || n < 1) { input.value = state.page + 1; return; }
  const maxPage = Math.max(1, Math.ceil(state.total / state.pageSize));
  if (n > maxPage) n = maxPage;
  input.value = n;
  const target = n - 1;
  if (target === state.page) return;
  state.page = target;
  loadTasks();
}

function gotoPage(delta){
  const next = state.page + delta;
  if (next < 0) return;
  if (delta > 0 && !state.hasMore) return;
  state.page = next;
  loadTasks();
}

function cssEscape(s){
  return String(s).replace(/["\\]/g, "\\$&");
}

/** 把当前 chips 与草稿合并成 OR 的 keyword 字符串（用于 URL 参数）。 */
function buildSearchKeyword(){
  const parts = state.titleChips.map(c => c.title).filter(Boolean);
  const draft = (state.titleDraft || "").trim();
  if (draft) parts.push(draft);
  // 去重（保持原顺序）
  const seen = new Set(); const out = [];
  for (const p of parts){ if (!seen.has(p)) { seen.add(p); out.push(p); } }
  return out.join("|");
}

/** 渲染 chips 区。 */
function renderChips(){
  const area = document.getElementById("chipArea");
  area.innerHTML = "";
  state.titleChips.forEach(chip => {
    const el = document.createElement("span");
    el.className = "chip";
    el.title = (chip.project_name ? `【${chip.project_name}】 ` : "") + chip.title
              + (chip.identifier ? `（${chip.identifier}）` : "");
    const meta = chip.project_name
      ? `<span class="chip-meta">${escapeHtml(chip.project_name)}</span>` : "";
    el.innerHTML = meta + escapeHtml(chip.title)
      + `<button class="chip-close" title="移除" data-id="${escapeHtml(chip.task_id)}">×</button>`;
    el.querySelector(".chip-close").addEventListener("click", (e) => {
      e.stopPropagation();
      removeChip(chip.task_id);
    });
    area.appendChild(el);
  });
}

/** 根据当前 chips/draft 更新清除按钮与 query 按钮的启用状态。 */
function updateChipSearchState(){
  const wrap = document.getElementById("chipSearch");
  const has = state.titleChips.length > 0 || (state.titleDraft || "").trim().length > 0;
  wrap.classList.toggle("has-value", has);
}

/** 输入框变化：保存草稿、防抖触发候选请求。 */
function onTitleInputChange(){
  const input = document.getElementById("titleSearch");
  state.titleDraft = input.value;
  updateChipSearchState();
  clearTimeout(state.titleDebounceTimer);
  const q = state.titleDraft.trim();
  if (!q){
    closeTitleMenu();
    return;
  }
  state.titleDebounceTimer = setTimeout(fetchTitleCandidates, state.titleDebounceMs);
}

async function fetchTitleCandidates(){
  const q = state.titleDraft.trim();
  if (!q || !state.projectId){ closeTitleMenu(); return; }
  try {
    const data = await api(`/api/task_titles?project_id=${encodeURIComponent(state.projectId)}`
      + `&q=${encodeURIComponent(q)}&limit=15`);
    state.titleCandidates = data.items || [];
    state.titleIdx = state.titleCandidates.length ? 0 : -1;
    renderTitleMenu();
    document.getElementById("titleMenu").hidden = false;
  } catch(e){
    closeTitleMenu();
  }
}

function renderTitleMenu(){
  const menu = document.getElementById("titleMenu");
  menu.innerHTML = "";
  if (!state.titleCandidates.length){
    const empty = document.createElement("div");
    empty.className = "opt-empty";
    empty.textContent = "没有匹配的任务；从已选 chip 直接点「查询」也会生效";
    menu.appendChild(empty);
    return;
  }
  state.titleCandidates.forEach((cand, i) => {
    const div = document.createElement("div");
    div.className = "opt" + (i === state.titleIdx ? " highlighted" : "");
    div.dataset.idx = String(i);
    const titleHtml = highlightInline(cand.title || "", state.titleDraft);
    const meta = (cand.project_name ? `【${cand.project_name}】` : "")
      + (cand.identifier ? ` · ${cand.identifier}` : "");
    div.innerHTML =
      `<div>${titleHtml}</div>`
      + (meta ? `<div class="opt-meta">${escapeHtml(meta)}</div>` : "");
    div.addEventListener("mouseenter", () => {
      state.titleIdx = i; updateTitleHighlight();
    });
    div.addEventListener("mousedown", (e) => {
      // 用 mousedown 避免 input blur 先触发、菜单先关闭
      e.preventDefault();
      pickTitleCandidate(i);
    });
    menu.appendChild(div);
  });
}

function updateTitleHighlight(){
  const items = document.querySelectorAll("#titleMenu .opt");
  items.forEach((el, i) => el.classList.toggle("highlighted", i === state.titleIdx));
}

function openTitleMenu(){
  document.getElementById("titleMenu").hidden = false;
}
function closeTitleMenu(){
  const menu = document.getElementById("titleMenu");
  if (menu){ menu.hidden = true; menu.innerHTML = ""; }
  state.titleCandidates = [];
  state.titleIdx = -1;
}

/** 在输入框下方/候选列表里给命中关键字加高亮（先转义再包标签）。 */
function highlightInline(text, kw){
  const safe = escapeHtml(text);
  const q = (kw || "").trim();
  if (!q) return safe;
  const lowerText = text.toLowerCase();
  const lowerQ = q.toLowerCase();
  let out = "";
  let i = 0, idx;
  while ((idx = lowerText.indexOf(lowerQ, i)) !== -1){
    // 由于 safe 是转义后的，索引仍然按原字符算（escapeHtml 不增删字符）
    out += safe.slice(i, idx);
    out += '<span class="hl">' + safe.slice(idx, idx + q.length) + '</span>';
    i = idx + q.length;
  }
  out += safe.slice(i);
  return out;
}

/** 从候选中选一项加入 chip（重复任务不重复加）。 */
async function pickTitleCandidate(idx){
  const cand = state.titleCandidates[idx];
  if (!cand) return;
  if (!state.titleChips.some(c => c.task_id === cand.task_id)){
    state.titleChips.push({
      task_id: cand.task_id,
      identifier: cand.identifier,
      title: cand.title,
      project_name: cand.project_name,
    });
  }
  // 选中后清掉输入框和草稿，让用户继续添加
  state.titleDraft = "";
  const input = document.getElementById("titleSearch");
  if (input) input.value = "";
  closeTitleMenu();
  renderChips();
  updateChipSearchState();
  // 让输入框聚焦，保持流畅添加
  if (input) input.focus();
}

/** 输入框键盘事件：↑↓ Enter Esc。 */
function onTitleKey(e){
  const menu = document.getElementById("titleMenu");
  if (e.key === "ArrowDown"){
    if (menu.hidden && state.titleDraft.trim()) fetchTitleCandidates();
    if (!state.titleCandidates.length) return;
    state.titleIdx = Math.min(state.titleIdx + 1, state.titleCandidates.length - 1);
    updateTitleHighlight();
    const el = menu.querySelector(".opt.highlighted");
    if (el) el.scrollIntoView({block:"nearest"});
    e.preventDefault();
  } else if (e.key === "ArrowUp"){
    if (!state.titleCandidates.length) return;
    state.titleIdx = Math.max(state.titleIdx - 1, 0);
    updateTitleHighlight();
    const el = menu.querySelector(".opt.highlighted");
    if (el) el.scrollIntoView({block:"nearest"});
    e.preventDefault();
  } else if (e.key === "Enter"){
    e.preventDefault();
    if (!menu.hidden && state.titleIdx >= 0 && state.titleCandidates[state.titleIdx]){
      pickTitleCandidate(state.titleIdx);
    } else {
      // 无选中候选：把当前草稿当 keyword 触发查询
      onChipSearch();
    }
  } else if (e.key === "Escape"){
    if (!menu.hidden){ closeTitleMenu(); e.preventDefault(); }
  }
}

function initTitleSearch(){
  const input = document.getElementById("titleSearch");
  const wrap = document.getElementById("chipSearch");
  input.addEventListener("input", onTitleInputChange);
  input.addEventListener("keydown", onTitleKey);
  input.addEventListener("focus", () => {
    if (state.titleDraft.trim()) fetchTitleCandidates();
  });
  // 点击外部关闭菜单
  document.addEventListener("click", (e) => {
    if (!wrap.contains(e.target)) closeTitleMenu();
  });
  renderChips();
  updateChipSearchState();
}

initTitleSearch();
</script>
